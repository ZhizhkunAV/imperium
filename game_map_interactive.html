<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная игровая карта Италии</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #map {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }
        
        .leaflet-control-zoom { display: none !important; }
        .leaflet-attribution-control { display: none !important; }
        
        .city-label {
            font-weight: bold;
            font-size: 14px;
            color: white;
            text-shadow: -1px -1px 3px #000, 1px -1px 3px #000, -1px 1px 3px #000, 1px 1px 3px #000;
            pointer-events: none;
            white-space: nowrap;
        }
        
        .info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 15px;
            border: 2px solid #ffd700;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
            font-family: 'Courier New', monospace;
        }
        
        .info-panel div {
            margin: 5px 0;
        }
        
        .info-panel .label {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="info-panel">
        <div><span class="label">Позиция юнита:</span> <span id="unitPos">X: 0, Y: 0</span></div>
        <div><span class="label">Управление:</span> стрелочки ↑ ↓ ← →</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // === КОНФИГУРАЦИЯ ===
        const GRID_SIZE = 40; // размер клетки в пиксельных координатах карты
        const CITIES = [
            { name: 'Рим', lat: 44.0, lng: 10.5 },
            { name: 'Неаполь', lat: 40.5, lng: 15.0 },
            { name: 'Палермо', lat: 37.5, lng: 14.0 }
        ];
        
        let map;
        let unitGridX = 10, unitGridY = 10; // позиция юнита в клетках
        let unitMarker;
        let imageWidth, imageHeight;
        let mapImageLoaded = false;

        function initMap() {
            console.log('=== Инициализация карты Италии ===');
            
            // Создаём карту в режиме простых координат
            map = L.map('map', {
                center: [41.0, 12.5],
                zoom: 2,
                crs: L.CRS.Simple,
                maxBounds: [[-10, 0], [50, 25]],
                zoomControl: false,
                attributionControl: false,
                dragging: true,
                scrollWheelZoom: true
            });

            // Загружаем нашу картинку как подложку
            const img = new Image();
            img.onload = function() {
                imageWidth = img.width;
                imageHeight = img.height;
                
                console.log('✓ Картинка загружена. Размер:', imageWidth, 'x', imageHeight, 'пикселей');
                
                // Рассчитываем границы карты в координатах Leaflet
                const bounds = [[0, 0], [imageHeight, imageWidth]];
                
                // Добавляем картинку как слой
                L.imageOverlay('/images/game_map.png', bounds).addTo(map);
                
                // Центрируем и масштабируем карту под экран
                map.fitBounds(bounds);
                
                mapImageLoaded = true;
                
                // Рисуем сетку (невидимую, но можно сделать видимой для отладки)
                drawGrid(bounds);
                
                // Добавляем города
                addCities();
                
                // Добавляем юнита
                createUnit();
            };
            
            img.onerror = function() {
                console.error('✗ Ошибка загрузки картинки с пути:', imagePath);
                alert('Ошибка: не удалось загрузить картинку. Проверьте консоль (F12)');
                document.getElementById('map').innerHTML = '<div style="color: red; font-size: 18px; padding: 20px;">Ошибка загрузки карты: ' + imagePath + '</div>';
            };
            
            const imagePath = '/images/game_map.png';
            console.log('Пытаемся загрузить картинку с:', imagePath);
            img.src = imagePath;
            
            // Обработчики клавиатуры
            setupKeyboardHandlers();
        }

        function drawGrid(bounds) {
            // Сетка будет невидимой по умолчанию
            // Раскомментируй строки ниже для отладки
            
            const latMin = bounds[0][0];
            const lngMin = bounds[0][1];
            const latMax = bounds[1][0];
            const lngMax = bounds[1][1];
            
            // Рисуем вертикальные линии сетки
            for (let lng = lngMin; lng <= lngMax; lng += GRID_SIZE) {
                L.polyline(
                    [[latMin, lng], [latMax, lng]],
                    { color: 'rgba(255,255,255,0.05)', weight: 1, dashArray: '5,5' }
                ).addTo(map);
            }
            
            // Рисуем горизонтальные линии сетки
            for (let lat = latMin; lat <= latMax; lat += GRID_SIZE) {
                L.polyline(
                    [[lat, lngMin], [lat, lngMax]],
                    { color: 'rgba(255,255,255,0.05)', weight: 1, dashArray: '5,5' }
                ).addTo(map);
            }
            
            console.log('✓ Сетка нарисована (невидимая)');
        }

        function addCities() {
            CITIES.forEach(city => {
                // Жёлтый кружок
                L.circleMarker([city.lat, city.lng], {
                    radius: 8,
                    fillColor: '#FFD700',
                    color: '#FFA500',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);
                
                // Текстовая подпись
                const label = L.marker([city.lat, city.lng], {
                    icon: L.divIcon({
                        html: `<div class="city-label">${city.name}</div>`,
                        iconSize: [60, 30],
                        iconAnchor: [30, 30]
                    })
                }).addTo(map);
            });
            
            console.log('✓ Города добавлены');
        }

        function createUnit() {
            // Преобразуем координаты сетки в географические координаты
            const lat = unitGridY * GRID_SIZE;
            const lng = unitGridX * GRID_SIZE;
            
            // Зелёный квадрат (юнит)
            unitMarker = L.rectangle(
                [[lat, lng], [lat + GRID_SIZE, lng + GRID_SIZE]],
                {
                    color: '#00FF00',
                    weight: 2,
                    fillColor: '#00AA00',
                    fillOpacity: 0.7,
                    dashArray: ''
                }
            ).addTo(map);
            
            updateUnitDisplay();
            console.log('✓ Юнит создан на позиции:', unitGridX, 'x', unitGridY);
        }

        function updateUnitDisplay() {
            // Обновляем позицию юнита
            const lat = unitGridY * GRID_SIZE;
            const lng = unitGridX * GRID_SIZE;
            
            if (unitMarker) {
                map.removeLayer(unitMarker);
            }
            
            unitMarker = L.rectangle(
                [[lat, lng], [lat + GRID_SIZE, lng + GRID_SIZE]],
                {
                    color: '#00FF00',
                    weight: 2,
                    fillColor: '#00AA00',
                    fillOpacity: 0.7
                }
            ).addTo(map);
            
            // Обновляем информационную панель
            document.getElementById('unitPos').textContent = `X: ${unitGridX}, Y: ${unitGridY}`;
        }

        function moveUnit(dx, dy) {
            const newX = unitGridX + dx;
            const newY = unitGridY + dy;
            
            // Простая проверка границ
            // Предполагаем, что сетка охватывает всю карту
            // Ограничиваем движение в разумные пределы (например, 0-20 по каждой оси)
            
            if (newX >= 0 && newY >= 0) {
                unitGridX = newX;
                unitGridY = newY;
                updateUnitDisplay();
                console.log(`Юнит переместился на [${unitGridX}, ${unitGridY}]`);
            }
        }

        function setupKeyboardHandlers() {
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowUp':
                        moveUnit(0, -1);
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        moveUnit(0, 1);
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        moveUnit(-1, 0);
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        moveUnit(1, 0);
                        e.preventDefault();
                        break;
                }
            });
        }

        // Запускаем при загрузке страницы
        window.addEventListener('load', initMap);
        
        // Перерисовываем при изменении размера окна
        window.addEventListener('resize', () => {
            if (map) {
                map.invalidateSize();
            }
        });
    </script>
</body>
</html>
