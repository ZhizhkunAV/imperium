<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex Map Prototype (autogen)</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #050505;
        overflow: hidden;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        user-select: none;
        backdrop-filter: blur(6px);
      }
      .hud button {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.9);
      }
      .hud button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .hud input {
        width: 110px;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.25);
        color: rgba(255, 255, 255, 0.9);
      }
      .hud .label {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <span class="label">Seed</span>
      <input id="seedInput" value="rome-001" />
      <button id="regenBtn">Regenerate</button>
      <span class="label" id="stats"></span>
    </div>
    <script type="module" src="./hexApp.js"></script>
  </body>
</html>
