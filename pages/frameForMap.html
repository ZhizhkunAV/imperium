<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кампания — Римская республика</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --bronze: #6b5a3a;
            --text: #d4c5a9;
            --bg-panel: rgba(5, 3, 1, 0.92);
            --border-panel: rgba(180, 140, 60, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'EB Garamond', 'Georgia', serif;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* === ГЛАВНЫЙ КОНТЕЙНЕР === */
        .game-frame {
            width: 100vw;
            height: 100vh;
            background: #0a0502;
            background-image:
                radial-gradient(ellipse at 60% 45%, rgba(30, 15, 5, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at center, transparent 20%, rgba(0, 0, 0, 0.9) 100%);
            border: 3px solid var(--gold-dark);
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .game-frame::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(201, 168, 76, 0.3);
            pointer-events: none;
            z-index: 10;
        }

        /* === ОСНОВНАЯ ОБЛАСТЬ (КАРТА) === */
        .game-main {
            flex: 0 0 75.1%;
            display: flex;
            position: relative;
            z-index: 2;
            min-height: 0;
            margin: 4px 4px 0 4px;
        }

        .map-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(201, 168, 76, 0.12);
        }

        .map-placeholder {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            letter-spacing: 4px;
            color: rgba(201, 168, 76, 0.2);
            text-transform: uppercase;
            text-align: center;
        }

        /* === НИЖНЯЯ ПАНЕЛЬ === */
        .bottom-panel {
            flex: 1;
            background: var(--bg-panel);
            z-index: 3;
            display: flex;
            align-items: stretch;
            padding: 0;
            gap: 0;
            margin: 0 4px 4px 4px;
            border: 1px solid rgba(201, 168, 76, 0.15);
            min-height: 0;
            position: relative;
        }

        /* === БЛОК 1: МИНИ-КАРТА === */
        .block-left {
            flex-shrink: 0;
            width: 384px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 0px 6px 0px;
            position: relative;
        }

        .block-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold));
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.25);
            z-index: 5;
        }

        .minimap-frame {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(201, 168, 76, 0.55);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(201, 168, 76, 0.1);
        }

        .minimap {
            width: 100%;
            height: 100%;
            background: rgba(201, 168, 76, 0.03);
            border: 1px solid rgba(201, 168, 76, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            letter-spacing: 1px;
            color: rgba(201, 168, 76, 0.3);
            text-transform: uppercase;
            text-align: center;
        }

        .minimap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.9) contrast(1.1) saturate(0.9);
        }

        /* === АНТИЧНАЯ КОЛОННА === */
        .antique-column {
            width: 22px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px 0;
            z-index: 5;
            position: relative;
        }

        .column-capital {
            width: 22px;
            height: 10px;
            position: relative;
            flex-shrink: 0;
        }

        .column-capital::before {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            right: -3px;
            height: 5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold));
            border-radius: 2px 2px 1px 1px;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.3);
        }

        .column-capital::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: -3px;
            right: -3px;
            height: 2px;
            background: var(--gold);
        }

        .column-shaft {
            flex: 1;
            width: 12px;
            background: linear-gradient(180deg, rgba(180,140,80,0.5), rgba(140,100,50,0.4), rgba(180,140,80,0.5));
            position: relative;
            border-left: 1px solid rgba(201,168,76,0.3);
            border-right: 1px solid rgba(201,168,76,0.3);
        }

        .column-shaft::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(201,168,76,0.2);
            box-shadow:
                3px 0 0 rgba(201,168,76,0.15),
                6px 0 0 rgba(201,168,76,0.1);
        }

        .column-base {
            width: 22px;
            height: 12px;
            position: relative;
            flex-shrink: 0;
        }

        .column-base::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            right: -4px;
            height: 6px;
            background: linear-gradient(180deg, var(--gold), var(--gold-dark));
            border-radius: 1px 1px 3px 3px;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.3);
        }

        .column-base::after {
            content: '';
            position: absolute;
            top: 2px;
            left: -4px;
            right: -4px;
            height: 2px;
            background: var(--gold-light);
            opacity: 0.6;
        }

        /* === БЛОК 2: ВКЛАДКИ + КАРТОЧКИ === */
        .block-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            gap: 0;
            min-width: 0;
            position: relative;
        }

        .block-center::before {
            content: '';
            position: absolute;
            top: 11px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.15);
            z-index: 4;
        }

        .tab-switcher {
            display: flex;
            gap: 0;
            position: relative;
            z-index: 6;
            height: 24px;
            align-items: center;
        }

        .tab-btn {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            background: var(--bg-panel);
            border: 1px solid rgba(201, 168, 76, 0.35);
            color: #8b7355;
            transition: all 0.2s;
            padding: 3px 14px;
            height: 22px;
            line-height: 1;
            white-space: nowrap;
            position: relative;
        }

        .tab-btn:hover {
            color: var(--gold-light);
            border-color: rgba(201, 168, 76, 0.6);
            background: rgba(201, 168, 76, 0.06);
        }

        .tab-btn.active {
            color: #fff;
            border-color: var(--gold);
            background: rgba(201, 168, 76, 0.18);
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.2);
        }

        .block-center-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 3;
        }

        .card-area {
            flex: 1;
            display: flex;
            align-items: stretch;
            padding: 2px;
            gap: 2px;
        }

        .card-area-top {
            border-bottom: 1px solid rgba(201, 168, 76, 0.3);
            padding-bottom: 3px;
        }

        .card-area-bottom {
            padding-top: 3px;
        }

        .card-slot {
            flex: 1;
            background: rgba(201, 168, 76, 0.04);
            border: 1px dashed rgba(201, 168, 76, 0.2);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(201, 168, 76, 0.2);
            font-size: 0.55rem;
        }

        .card-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: brightness(0.95) contrast(1.05);
        }

        /* === БЛОК 3: ГОД / КАЗНА / ИКОНКИ / ХОД === */
        .block-right {
            flex-shrink: 0;
            width: 384px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 0px 6px 0px;
            position: relative;
        }

        .block-right::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold), transparent);
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.25);
            z-index: 5;
        }

        .right-info-frame {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(201, 168, 76, 0.55);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(201, 168, 76, 0.1);
        }

        /* Верхняя строка: иконки армии/строительства */
        .icon-stack {
            display: flex;
            flex-direction: row;
            gap: 6px;
            justify-content: flex-start;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(201, 168, 76, 0.35);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: rgba(201, 168, 76, 0.5);
        }

        .btn-icon:hover {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(201, 168, 76, 0.08);
        }

        .btn-icon.active {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(201, 168, 76, 0.15);
            box-shadow: 0 0 15px rgba(201, 168, 76, 0.3);
        }

        /* Средняя строка: год и казна */
        .info-rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 1px;
            color: var(--gold);
        }

        .info-row span {
            color: #fff;
            font-weight: 700;
            font-size: 0.68rem;
        }

        .info-divider {
            width: 100%;
            height: 1px;
            background: rgba(201, 168, 76, 0.15);
        }

        /* Нижняя строка: иконка фракции слева, кнопка хода справа */
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 8px;
        }

        .faction-icon-large {
            width: 64px;
            height: 64px;
            background: rgba(201, 168, 76, 0.06);
            border: 2px solid rgba(201, 168, 76, 0.45);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 0 18px rgba(201, 168, 76, 0.15);
            color: var(--gold-light);
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .faction-icon-large img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            display: block;
            filter: brightness(0.95) contrast(1.05);
        }

        .faction-icon-large:hover {
            border-color: #ffd700;
            box-shadow: 0 0 28px rgba(201, 168, 76, 0.35);
            background: rgba(201, 168, 76, 0.12);
            transform: scale(1.05);
        }

        .btn-end-turn {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            cursor: pointer;
            background: rgba(139, 26, 26, 0.25);
            border: 1px solid rgba(200, 80, 80, 0.45);
            color: #c08080;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .btn-end-turn:hover {
            background: rgba(139, 26, 26, 0.45);
            border-color: #c05050;
            color: #ffaaaa;
            box-shadow: 0 0 15px rgba(200, 80, 80, 0.25);
        }

        @media (max-width: 1000px) {
            .game-main {
                flex: 0 0 55%;
            }

            .bottom-panel {
                flex-wrap: wrap;
            }

            .block-left,
            .block-right {
                width: 200px;
            }

            .antique-column {
                width: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="game-frame">

        <div class="game-main">
            <div class="map-area">
                <span class="map-placeholder" id="mapPlaceholder">Карта кампании</span>
            </div>
        </div>

        <div class="bottom-panel">

            <!-- БЛОК 1: МИНИ-КАРТА -->
            <div class="block-left">
                <div class="minimap-frame">
                    <div class="minimap">
                        <img id="minimapImage" src="../assets/images/mapOfRome.png" alt="Мини-карта">
                    </div>
                </div>
            </div>

            <!-- КОЛОННА -->
            <div class="antique-column">
                <div class="column-capital"></div>
                <div class="column-shaft"></div>
                <div class="column-base"></div>
            </div>

            <!-- БЛОК 2: КАРТОЧКИ -->
            <div class="block-center">
                <div class="tab-switcher">
                    <button class="tab-btn active" onclick="switchTab('army')">Отряды</button>
                    <button class="tab-btn" onclick="switchTab('settlement')">Поселение</button>
                </div>

                <div class="block-center-inner">
                    <div class="card-area card-area-top">
                        <div class="card-slot"><img src="../assets/images/faceOfScipio.png" alt="Портрет полководца"></div><div class="card-slot" data-entity="legionary" oncontextmenu="openDetail(event,'legionary')"><img src="../assets/images/legioner.png" alt="Легионер"></div><div class="card-slot" data-entity="veles" oncontextmenu="openDetail(event,'veles')"><img src="../assets/images/velit.png" alt="Велит"></div><div class="card-slot">4</div><div class="card-slot">5</div>
                        <div class="card-slot">6</div><div class="card-slot">7</div><div class="card-slot">8</div><div class="card-slot">9</div><div class="card-slot">10</div>
                    </div>
                    <div class="card-area card-area-bottom">
                        <div class="card-slot">11</div><div class="card-slot">12</div><div class="card-slot">13</div><div class="card-slot">14</div><div class="card-slot">15</div>
                        <div class="card-slot">16</div><div class="card-slot">17</div><div class="card-slot">18</div><div class="card-slot">19</div><div class="card-slot">20</div>
                    </div>
                </div>
            </div>

            <!-- КОЛОННА -->
            <div class="antique-column">
                <div class="column-capital"></div>
                <div class="column-shaft"></div>
                <div class="column-base"></div>
            </div>

            <!-- БЛОК 3: ПРАВЫЙ -->
            <div class="block-right">
                <div class="right-info-frame">

                    <!-- Иконки ⚔️ 🏗️ 🔬 сверху -->
                    <div class="icon-stack">
                        <button class="btn-icon active" id="iconArmy" onclick="openArmyPage()" title="Армии">⚔️</button>
                        <button class="btn-icon" id="iconBuild" onclick="openBuildPage()" title="Строительство">🏗️</button>
                        <button class="btn-icon" id="iconTech" onclick="openTechPage()" title="Технологии">🔬</button>
                    </div>

                    <!-- Год + Казна -->
                    <div class="info-rows">
                        <div class="info-row">Год <span>270 до н.э.</span></div>
                        <div class="info-divider"></div>
                        <div class="info-row">Казна <span>ⓓ 5 000</span></div>
                    </div>

                    <!-- Нижний ряд: иконка фракции + конец хода -->
                    <div class="bottom-row">
                        <div class="faction-icon-large" id="factionIcon" onclick="openFactionWindow()" title="Открыть окно фракции">
                            <img id="factionIconImg" src="../assets/images/icon_rome.png" alt="Фракция">
                        </div>
                        <button class="btn-end-turn" onclick="endTurn()" title="Конец хода">⏳</button>
                    </div>

                </div>
            </div>

        </div>

        <iframe id="modalContent" style="display:none; position:fixed; top:0; right:0; width:40%; height:100vh; z-index:1001; border-left:2px solid #c9a84c; background:#0a0502; box-shadow: -10px 0 30px rgba(0,0,0,0.8);" frameborder="0"></iframe>
        <iframe id="secondaryContent" style="display:none; position:fixed; top:0; left:0; width:40%; height:100vh; z-index:1002; border-right:2px solid #c9a84c; background:#0a0502; box-shadow: 10px 0 30px rgba(0,0,0,0.8);" frameborder="0"></iframe>
    </div>

    <script>
        function setModalPosition(centered) {
            const modal = document.getElementById('modalContent');
            if (centered) {
                modal.style.top = '0';
                modal.style.left = '0';
                modal.style.width = '100%';
                modal.style.height = '100vh';
                modal.style.transform = 'none';
                modal.style.border = 'none';
                modal.style.boxShadow = 'none';
            } else {
                modal.style.top = '0';
                modal.style.left = 'auto';
                modal.style.right = '0';
                modal.style.width = '40%';
                modal.style.height = '100vh';
                modal.style.transform = 'none';
                modal.style.borderLeft = '2px solid #c9a84c';
                modal.style.border = 'none';
                modal.style.boxShadow = '-10px 0 30px rgba(0,0,0,0.8)';
            }
        }

        function openModal(url, centered = false) {
            setModalPosition(centered);
            document.getElementById('modalContent').style.display = 'block';
            document.getElementById('modalContent').src = url;
        }

        function closeModal() {
            document.getElementById('modalContent').style.display = 'none';
            document.getElementById('modalContent').src = '';
        }

        function openSecondaryModal(url, options = {}) {
            const sec = document.getElementById('secondaryContent');
            sec.style.display = 'block';
            sec.src = url;
            if (options.position === 'center') {
                sec.style.position = 'fixed';
                sec.style.left = '50%';
                sec.style.top = '50%';
                sec.style.width = '78%';
                sec.style.height = '84%';
                sec.style.transform = 'translate(-50%, -50%)';
                sec.style.border = '2px solid #c9a84c';
                sec.style.borderRight = 'none';
                sec.style.boxShadow = '0 0 40px rgba(0,0,0,0.8)';
            } else {
                sec.style.position = 'fixed';
                sec.style.left = '0';
                sec.style.top = '0';
                sec.style.width = '40%';
                sec.style.height = '100vh';
                sec.style.transform = 'none';
                sec.style.borderRight = '2px solid #c9a84c';
                sec.style.border = 'none';
                sec.style.boxShadow = '10px 0 30px rgba(0,0,0,0.8)';
            }
        }

        function closeSecondaryModal() {
            const sec = document.getElementById('secondaryContent');
            sec.style.display = 'none';
            sec.src = '';
        }

        function openDetail(event, entity) {
            if (event) {
                event.preventDefault();
            }
            if (!entity) return;
            if (window.parent && window.parent.openSecondaryModal) {
                window.parent.openSecondaryModal(`../assets/pageOfDetailAboutUnitAndBuild.html?entity=${encodeURIComponent(entity)}`, { position: 'left' });
            } else {
                openSecondaryModal(`../assets/pageOfDetailAboutUnitAndBuild.html?entity=${encodeURIComponent(entity)}`, { position: 'left' });
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.block-center .tab-btn').forEach(b => b.classList.remove('active'));
            const idx = tab === 'army' ? 0 : 1;
            document.querySelectorAll('.block-center .tab-btn')[idx].classList.add('active');
            document.getElementById('iconArmy').classList.toggle('active', tab === 'army');
            document.getElementById('iconBuild').classList.toggle('active', tab === 'settlement');
            document.getElementById('iconTech').classList.remove('active');
        }

        function openArmyPage() {
            document.getElementById('iconArmy').classList.add('active');
            document.getElementById('iconBuild').classList.remove('active');
            document.getElementById('iconTech').classList.remove('active');
            openModal('../assets/buildArmy.html?tab=recruit', false);
        }

        function openBuildPage() {
            document.getElementById('iconArmy').classList.remove('active');
            document.getElementById('iconBuild').classList.add('active');
            document.getElementById('iconTech').classList.remove('active');
            openModal('../assets/buildArmy.html?tab=build', false);
        }

        function openTechPage() {
            document.getElementById('iconArmy').classList.remove('active');
            document.getElementById('iconBuild').classList.remove('active');
            document.getElementById('iconTech').classList.add('active');
            openModal('../assets/tech.html', true);
        }

        function openFactionWindow() {
            alert('Окно фракции — будет позже.');
        }

        function endTurn() {
            const btn = document.querySelector('.btn-end-turn');
            btn.style.opacity = '0.5';
            setTimeout(() => {
                alert('Ход передан другим фракциям.');
                btn.style.opacity = '1';
            }, 400);
        }

        (function initFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const faction = (params.get('faction') || 'rome').toLowerCase();

            const mapPlaceholder = document.getElementById('mapPlaceholder');
            const factionIconImg = document.getElementById('factionIconImg');
            const minimapImage = document.getElementById('minimapImage');

            const config = {
                rome: {
                    title: 'Кампания — Римская республика',
                    iconSrc: '../assets/images/icon_rome.png',
                    minimapSrc: '../assets/images/mapOfRome.png',
                    label: 'Карта кампании (Рим)'
                },
                carthage: {
                    title: 'Кампания — Карфаген',
                    iconSrc: '../assets/images/icon_carphago.png',
                    minimapSrc: '../assets/images/mapOfCarphago.png',
                    label: 'Карта кампании (Карфаген)'
                }
            }[faction] || {
                title: 'Кампания',
                iconSrc: '../assets/images/icon_rome.png',
                minimapSrc: '../assets/images/mapOfRome.png',
                label: 'Карта кампании'
            };

            document.title = config.title;
            mapPlaceholder.textContent = config.label;
            factionIconImg.src = config.iconSrc;
            minimapImage.src = config.minimapSrc;
        })();
    </script>

</body>
