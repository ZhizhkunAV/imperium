<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор фракции — Имперская кампания</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e0c878;
            --bronze: #6b5a3a;
            --text: #d4c5a9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0604;
            background-image:
                radial-gradient(ellipse at 50% 40%, rgba(40, 25, 10, 0.35) 0%, transparent 70%),
                radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.6) 100%);
            font-family: 'EB Garamond', 'Georgia', serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            padding: 10px 15px 15px;
            gap: 10px;
        }

        /* === ЗАГОЛОВОК === */
        .header-section {
            text-align: center;
            flex-shrink: 0;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold-light);
            text-shadow: 0 0 20px rgba(201, 168, 76, 0.4);
            margin-bottom: 6px;
        }

        .gold-divider {
            width: 70%;
            max-width: 700px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
            margin: 0 auto 6px;
        }

        .faction-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-light);
            text-shadow: 0 0 12px rgba(201, 168, 76, 0.4);
        }

        /* === ВЕРХНИЙ РЯД: КАРТА + ИКОНКИ === */
        .top-row {
            display: flex;
            gap: 0;
            align-items: stretch;
            flex-shrink: 0;
            height: 340px;
        }

        /* Карта */
        .map-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(201, 168, 76, 0.35);
            padding: 0;
            min-width: 0;
            overflow: hidden;
            z-index: 1;
        }

        .map-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: brightness(0.85) contrast(1.1) saturate(0.9);
            padding: 0 10px;
        }

        /* Правая панель: иконки (смещена влево к карте) */
        .factions-sidebar {
            width: 330px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(201, 168, 76, 0.35);
            display: flex;
            flex-direction: row;
            gap: 15px;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            position: relative;
            z-index: 2;
            margin-left: -20px;
        }

        .faction-icon-placeholder {
            width: 102px;
            height: 108px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed rgba(201, 168, 76, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: rgba(201, 168, 76, 0.5);
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .faction-icon-placeholder img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .faction-icon-placeholder:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(201, 168, 76, 0.05);
        }

        .faction-icon-placeholder.selected {
            border-color: #ffd700;
            border-style: solid;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .faction-icon-placeholder.selected-carthage {
            border-color: #e07070;
            border-style: solid;
            box-shadow: 0 0 25px rgba(224, 112, 112, 0.4);
            color: #e07070;
            background: rgba(224, 112, 112, 0.1);
        }

        /* === НАДПИСЬ ПОД КАРТОЙ === */
        .map-subtitle {
            text-align: center;
            flex-shrink: 0;
        }

        .choose-faction-text {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(201, 168, 76, 0.25);
            display: inline-block;
        }

        .checkbox-row-bottom:hover {
            color: #f0e6d3;
        }

        @media (max-width: 900px) {
            .top-row {
                flex-direction: column;
                height: auto;
            }

            .factions-sidebar {
                width: 100%;
                margin: 0;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
                padding: 12px;
            }

            .map-area {
                height: 220px;
                flex: none;
            }

            .map-image {
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ЗАГОЛОВОК -->
    <div class="header-section">
        <div class="main-title">Имперская кампания</div>
        <div class="gold-divider"></div>
        <div class="faction-subtitle" id="factionSubtitle">Рим</div>
    </div>

    <!-- ВЕРХ: КАРТА + ИКОНКИ -->
    <div class="top-row">
        <div class="map-area">
            <img
                class="map-image"
                src="../assets/images/mapOfRome.png"
                alt="Карта Средиземноморья"
                id="mapImage"
                onerror="this.style.opacity='0.3';"
            >
        </div>

        <!-- ИКОНКИ В РЯД -->
        <div class="factions-sidebar">
            <div class="faction-icon-placeholder selected" id="romeIcon" onclick="selectFaction('rome')" title="Рим">
                <img src="../assets/images/icon_rome.png" alt="Рим">
                РИМ
            </div>
            <div class="faction-icon-placeholder" id="carthageIcon" onclick="selectFaction('carthage')" title="Карфаген">
                <img src="../assets/images/icon_carphago.png" alt="Карфаген">
                КАРФАГЕН
            </div>
        </div>
    </div>

    <script>
        let selectedFaction = 'rome';
        const factionData = {
            rome: {
                name: 'Рим',
                map: '../assets/images/mapOfRome.png'
            },
            carthage: {
                name: 'Карфаген',
                map: '../assets/images/mapOfCarphago.png'
            }
        };

        function selectFaction(faction) {
            selectedFaction = faction;
            const data = factionData[faction];
            document.getElementById('romeIcon').classList.remove('selected', 'selected-carthage');
            document.getElementById('carthageIcon').classList.remove('selected', 'selected-carthage');
            if (faction === 'rome') {
                document.getElementById('romeIcon').classList.add('selected');
            } else {
                document.getElementById('carthageIcon').classList.add('selected-carthage');
            }
            document.getElementById('factionSubtitle').textContent = data.name;
            document.getElementById('mapImage').src = data.map;
        }
    </script>

</body>
</html>
