<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кампания — Римская республика</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --bronze: #6b5a3a;
            --text: #d4c5a9;
            --bg-panel: rgba(5, 3, 1, 0.92);
            --border-panel: rgba(180, 140, 60, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'EB Garamond', 'Georgia', serif;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* === ГЛАВНЫЙ КОНТЕЙНЕР === */
        .game-frame {
            width: 100vw;
            height: 100vh;
            background: #0a0502;
            background-image:
                radial-gradient(ellipse at 60% 45%, rgba(30, 15, 5, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at center, transparent 20%, rgba(0, 0, 0, 0.9) 100%);
            border: 3px solid var(--gold-dark);
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .game-frame::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(201, 168, 76, 0.3);
            pointer-events: none;
            z-index: 10;
        }

        /* === ОСНОВНАЯ ОБЛАСТЬ (КАРТА) === */
        .game-main {
            flex: 0 0 75.1%;
            display: flex;
            position: relative;
            z-index: 2;
            min-height: 0;
            margin: 4px 4px 0 4px;
        }

        .map-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(201, 168, 76, 0.12);
            position: relative;
        }

        .btn-home {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 20;
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 12px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(201, 168, 76, 0.45);
            color: var(--gold-light);
            text-decoration: none;
            transition: all 0.25s;
        }

        .btn-home:hover {
            border-color: var(--gold);
            color: #fff;
            box-shadow: 0 0 14px rgba(201, 168, 76, 0.25);
            background: rgba(201, 168, 76, 0.12);
        }

        .map-placeholder {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            letter-spacing: 4px;
            color: rgba(201, 168, 76, 0.2);
            text-transform: uppercase;
        }

        /* === НИЖНЯЯ ПАНЕЛЬ === */
        .bottom-panel {
            flex: 1;
            background: var(--bg-panel);
            z-index: 3;
            display: flex;
            align-items: stretch;
            padding: 0;
            gap: 0;
            margin: 0 4px 4px 4px;
            border: 1px solid rgba(201, 168, 76, 0.15);
            min-height: 0;
            position: relative;
        }

        /* === БЛОК 1: МИНИ-КАРТА === */
        .block-left {
            flex-shrink: 0;
            width: 384px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 0px 6px 0px;
            position: relative;
        }

        .block-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold));
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.25);
            z-index: 5;
        }

        .minimap-frame {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(201, 168, 76, 0.55);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(201, 168, 76, 0.1);
        }

        .minimap {
            width: 100%;
            height: 100%;
            background: rgba(201, 168, 76, 0.03);
            border: 1px solid rgba(201, 168, 76, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            letter-spacing: 1px;
            color: rgba(201, 168, 76, 0.3);
            text-transform: uppercase;
            text-align: center;
        }

        /* === АНТИЧНАЯ КОЛОННА === */
        .antique-column {
            width: 22px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px 0;
            z-index: 5;
            position: relative;
        }

        .column-capital {
            width: 22px;
            height: 10px;
            position: relative;
            flex-shrink: 0;
        }

        .column-capital::before {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            right: -3px;
            height: 5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold));
            border-radius: 2px 2px 1px 1px;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.3);
        }

        .column-capital::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: -3px;
            right: -3px;
            height: 2px;
            background: var(--gold);
        }

        .column-shaft {
            flex: 1;
            width: 12px;
            background: linear-gradient(180deg, rgba(180,140,80,0.5), rgba(140,100,50,0.4), rgba(180,140,80,0.5));
            position: relative;
            border-left: 1px solid rgba(201,168,76,0.3);
            border-right: 1px solid rgba(201,168,76,0.3);
        }

        .column-shaft::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(201,168,76,0.2);
            box-shadow:
                3px 0 0 rgba(201,168,76,0.15),
                6px 0 0 rgba(201,168,76,0.1);
        }

        .column-base {
            width: 22px;
            height: 12px;
            position: relative;
            flex-shrink: 0;
        }

        .column-base::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            right: -4px;
            height: 6px;
            background: linear-gradient(180deg, var(--gold), var(--gold-dark));
            border-radius: 1px 1px 3px 3px;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.3);
        }

        .column-base::after {
            content: '';
            position: absolute;
            top: 2px;
            left: -4px;
            right: -4px;
            height: 2px;
            background: var(--gold-light);
            opacity: 0.6;
        }

        /* === БЛОК 2: ВКЛАДКИ + КАРТОЧКИ === */
        .block-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            gap: 0;
            min-width: 0;
            position: relative;
        }

        .block-center::before {
            content: '';
            position: absolute;
            top: 11px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.15);
            z-index: 4;
        }

        .tab-switcher {
            display: flex;
            gap: 0;
            position: relative;
            z-index: 6;
            height: 24px;
            align-items: center;
        }

        .tab-btn {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            background: var(--bg-panel);
            border: 1px solid rgba(201, 168, 76, 0.35);
            color: #8b7355;
            transition: all 0.2s;
            padding: 3px 14px;
            height: 22px;
            line-height: 1;
            white-space: nowrap;
            position: relative;
        }

        .tab-btn:hover {
            color: var(--gold-light);
            border-color: rgba(201, 168, 76, 0.6);
            background: rgba(201, 168, 76, 0.06);
        }

        .tab-btn.active {
            color: #fff;
            border-color: var(--gold);
            background: rgba(201, 168, 76, 0.18);
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.2);
        }

        .block-center-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 3;
        }

        .card-area {
            flex: 1;
            display: flex;
            align-items: stretch;
            padding: 2px;
            gap: 2px;
        }

        .card-area-top {
            border-bottom: 1px solid rgba(201, 168, 76, 0.3);
            padding-bottom: 3px;
        }

        .card-area-bottom {
            padding-top: 3px;
        }

        .card-slot {
            flex: 1;
            background: rgba(201, 168, 76, 0.04);
            border: 1px dashed rgba(201, 168, 76, 0.2);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(201, 168, 76, 0.2);
            font-size: 0.55rem;
        }

        /* === БЛОК 3: ГОД / КАЗНА / ИКОНКИ / ХОД === */
        .block-right {
            flex-shrink: 0;
            width: 384px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 0px 6px 0px;
            position: relative;
        }

        .block-right::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold), transparent);
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.25);
            z-index: 5;
        }

        .right-info-frame {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(201, 168, 76, 0.55);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(201, 168, 76, 0.1);
        }

        /* Верхняя строка: иконки армии/строительства */
        .icon-stack {
            display: flex;
            flex-direction: row;
            gap: 6px;
            justify-content: flex-start;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(201, 168, 76, 0.35);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: rgba(201, 168, 76, 0.5);
        }

        .btn-icon:hover {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(201, 168, 76, 0.08);
        }

        .btn-icon.active {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(201, 168, 76, 0.15);
            box-shadow: 0 0 15px rgba(201, 168, 76, 0.3);
        }

        /* Средняя строка: год и казна */
        .info-rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 1px;
            color: var(--gold);
        }

        .info-row span {
            color: #fff;
            font-weight: 700;
            font-size: 0.68rem;
        }

        .info-divider {
            width: 100%;
            height: 1px;
            background: rgba(201, 168, 76, 0.15);
        }

        /* Нижняя строка: иконка фракции слева, кнопка хода справа */
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 8px;
        }

        .faction-icon-large {
            width: 64px;
            height: 64px;
            background: rgba(201, 168, 76, 0.06);
            border: 2px solid rgba(201, 168, 76, 0.45);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 0 18px rgba(201, 168, 76, 0.15);
            color: var(--gold-light);
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            overflow: hidden;
            padding: 0;
        }

        .faction-icon-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .faction-icon-large:hover {
            border-color: #ffd700;
            box-shadow: 0 0 28px rgba(201, 168, 76, 0.35);
            background: rgba(201, 168, 76, 0.12);
            transform: scale(1.05);
        }

        .btn-end-turn {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            cursor: pointer;
            background: rgba(139, 26, 26, 0.25);
            border: 1px solid rgba(200, 80, 80, 0.45);
            color: #c08080;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .btn-end-turn:hover {
            background: rgba(139, 26, 26, 0.45);
            border-color: #c05050;
            color: #ffaaaa;
            box-shadow: 0 0 15px rgba(200, 80, 80, 0.25);
        }

        @media (max-width: 1000px) {
            .game-main {
                flex: 0 0 55%;
            }

            .bottom-panel {
                flex-wrap: wrap;
            }

            .block-left,
            .block-right {
                width: 200px;
            }

            .antique-column {
                width: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="game-frame">

        <div class="game-main">
            <div class="map-area">
                <a href="windowDownload.html" class="btn-home" data-i18n="btn.home">На главную</a>
                <span class="map-placeholder" id="mapPlaceholder" data-i18n="map.placeholder">Карта кампании</span>
            </div>
        </div>

        <div class="bottom-panel">

            <!-- БЛОК 1: МИНИ-КАРТА -->
            <div class="block-left">
                <div class="minimap-frame">
                    <div class="minimap">Мини-карта</div>
                </div>
            </div>

            <!-- КОЛОННА -->
            <div class="antique-column">
                <div class="column-capital"></div>
                <div class="column-shaft"></div>
                <div class="column-base"></div>
            </div>

            <!-- БЛОК 2: КАРТОЧКИ -->
            <div class="block-center">
                <div class="tab-switcher">
                    <button class="tab-btn active" onclick="switchTab('army')" data-i18n="tabs.units">Отряды</button>
                    <button class="tab-btn" onclick="switchTab('settlement')" data-i18n="tabs.settlement">Поселение</button>
                </div>

                <div class="block-center-inner">
                    <div class="card-area card-area-top">
                        <div class="card-slot">1</div><div class="card-slot">2</div><div class="card-slot">3</div><div class="card-slot">4</div><div class="card-slot">5</div>
                        <div class="card-slot">6</div><div class="card-slot">7</div><div class="card-slot">8</div><div class="card-slot">9</div><div class="card-slot">10</div>
                    </div>
                    <div class="card-area card-area-bottom">
                        <div class="card-slot">11</div><div class="card-slot">12</div><div class="card-slot">13</div><div class="card-slot">14</div><div class="card-slot">15</div>
                        <div class="card-slot">16</div><div class="card-slot">17</div><div class="card-slot">18</div><div class="card-slot">19</div><div class="card-slot">20</div>
                    </div>
                </div>
            </div>

            <!-- КОЛОННА -->
            <div class="antique-column">
                <div class="column-capital"></div>
                <div class="column-shaft"></div>
                <div class="column-base"></div>
            </div>

            <!-- БЛОК 3: ПРАВЫЙ -->
            <div class="block-right">
                <div class="right-info-frame">

                    <!-- Иконки ⚔️ 🏗️ сверху -->
                    <div class="icon-stack">
                        <button class="btn-icon active" id="iconArmy" onclick="openBuildArmy('recruit')" data-i18n-title="btn.army" title="Армии">⚔️</button>
                        <button class="btn-icon" id="iconBuild" onclick="openBuildArmy('build')" data-i18n-title="btn.build" title="Строительство">🏗️</button>
                        <button class="btn-icon" id="iconTech" onclick="openTech()" data-i18n-title="btn.tech" title="Технологии">🧠</button>
                    </div>

                    <!-- Год + Казна -->
                    <div class="info-rows">
                        <div class="info-row"><span data-i18n="info.year">Год</span> <span data-i18n="info.yearValue">270 до н.э.</span></div>
                        <div class="info-divider"></div>
                        <div class="info-row"><span data-i18n="info.treasury">Казна</span> <span>ⓓ 5 000</span></div>
                    </div>

                    <!-- Нижний ряд: иконка фракции + конец хода -->
                    <div class="bottom-row">
                        <div class="faction-icon-large" id="factionIconBtn" onclick="openFactionWindow()" data-i18n-title="btn.faction" title="Открыть окно фракции">
                            <img id="factionIconImg" src="../images/icon_rome.png" alt="">
                        </div>
                        <button class="btn-end-turn" onclick="endTurn()" data-i18n-title="btn.endTurn" title="Конец хода">⏳</button>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <script src="../js/i18n.js"></script>
    <script src="../js/i18n-content.js"></script>
    <script>
        const PANEL_EDGE = 4;
        const PANEL_WIDTH = '40%';
        const FRAME_INSET = 24;
        const SIDE_PANEL_HEIGHT_SCALE = 1.2;
        let modalMode = 'right';

        function getSidePanelMetrics() {
            const bottomPanel = document.querySelector('.bottom-panel');
            const bottomHeight = bottomPanel ? bottomPanel.getBoundingClientRect().height : 120;
            const baseHeight = window.innerHeight - bottomHeight - PANEL_EDGE;
            return {
                width: window.innerWidth * 0.4,
                height: baseHeight * SIDE_PANEL_HEIGHT_SCALE,
            };
        }

        function getSidePanelHeight() {
            const metrics = getSidePanelMetrics();
            return `${Math.ceil(metrics.height)}px`;
        }

        function applyPanelBorder(el, side) {
            if (side === 'right') {
                el.style.border = 'none';
                el.style.borderLeft = '2px solid #c9a84c';
                el.style.borderTop = '2px solid #c9a84c';
                el.style.borderBottom = '2px solid #c9a84c';
                el.style.borderRight = 'none';
            } else {
                el.style.border = 'none';
                el.style.borderRight = '2px solid #c9a84c';
                el.style.borderTop = '2px solid #c9a84c';
                el.style.borderBottom = '2px solid #c9a84c';
                el.style.borderLeft = 'none';
            }
        }

        function layoutSidePanel(el, side) {
            el.style.position = 'fixed';
            el.style.top = `${PANEL_EDGE}px`;
            el.style.width = PANEL_WIDTH;
            el.style.height = getSidePanelHeight();
            el.style.transform = 'none';
            el.style.pointerEvents = 'auto';
            el.style.background = '#0a0502';
            el.style.borderRadius = '0';

            if (side === 'right') {
                el.style.left = 'auto';
                el.style.right = `${PANEL_EDGE}px`;
                el.style.boxShadow = '-10px 0 30px rgba(0,0,0,0.8)';
            } else {
                el.style.left = `${PANEL_EDGE}px`;
                el.style.right = 'auto';
                el.style.boxShadow = '10px 0 30px rgba(0,0,0,0.8)';
            }

            applyPanelBorder(el, side);
        }

        function layoutFramedPanel(el) {
            el.style.position = 'fixed';
            el.style.top = `${FRAME_INSET}px`;
            el.style.left = `${FRAME_INSET}px`;
            el.style.right = `${FRAME_INSET}px`;
            el.style.bottom = `${FRAME_INSET}px`;
            el.style.width = 'auto';
            el.style.height = 'auto';
            el.style.transform = 'none';
            el.style.pointerEvents = 'auto';
            el.style.background = '#0a0502';
            el.style.border = '2px solid #c9a84c';
            el.style.borderRadius = '6px';
            el.style.boxShadow = '0 0 40px rgba(0,0,0,0.85)';
        }

        function layoutTechPanel(el) {
            const margin = 0.05;
            const techW = Math.round(window.innerWidth * (1 - margin * 2));
            const techH = Math.round(window.innerHeight * (1 - margin * 2));
            const left = Math.round(window.innerWidth * margin);
            const top = Math.round(window.innerHeight * margin);

            el.style.position = 'fixed';
            el.style.top = `${top}px`;
            el.style.left = `${left}px`;
            el.style.right = 'auto';
            el.style.bottom = 'auto';
            el.style.width = `${techW}px`;
            el.style.height = `${techH}px`;
            el.style.transform = 'none';
            el.style.pointerEvents = 'auto';
            el.style.background = '#0a0502';
            el.style.border = '2px solid #c9a84c';
            el.style.borderRadius = '6px';
            el.style.boxShadow = '0 0 40px rgba(0,0,0,0.85)';
        }

        function layoutCenterDetailPanel(el) {
            el.style.position = 'fixed';
            el.style.left = '50%';
            el.style.top = '50%';
            el.style.width = 'min(960px, 94vw)';
            el.style.height = 'min(90vh, 880px)';
            el.style.transform = 'translate(-50%, -50%)';
            el.style.pointerEvents = 'auto';
            el.style.background = '#0a0502';
            el.style.border = '2px solid #c9a84c';
            el.style.borderRadius = '6px';
            el.style.boxShadow = '0 0 40px rgba(0,0,0,0.85)';
        }

        function isSecondaryOpen() {
            const sec = document.getElementById('secondaryContent');
            return sec && sec.style.display === 'block' && sec.src && !sec.src.endsWith('about:blank');
        }

        function switchTab(tab) {
            document.querySelectorAll('.block-center .tab-btn').forEach(b => b.classList.remove('active'));
            const idx = tab === 'army' ? 0 : 1;
            document.querySelectorAll('.block-center .tab-btn')[idx].classList.add('active');
            document.getElementById('iconArmy').classList.toggle('active', tab === 'army');
            document.getElementById('iconBuild').classList.toggle('active', tab === 'settlement');
        }

        function openBuildArmy(tab) {
            document.getElementById('iconArmy')?.classList.add('active');
            document.getElementById('iconBuild')?.classList.remove('active');
            document.getElementById('iconTech')?.classList.remove('active');
            openModal(`buildArmy.html?tab=${encodeURIComponent(tab)}&faction=${encodeURIComponent(getCampaignFaction())}`, 'right');
        }

        function getCampaignFaction() {
            const params = new URLSearchParams(window.location.search);
            return (params.get('faction') || 'rome').toLowerCase();
        }

        function openTech() {
            closeSecondaryModal();
            document.getElementById('iconArmy')?.classList.remove('active');
            document.getElementById('iconBuild')?.classList.remove('active');
            document.getElementById('iconTech')?.classList.add('active');
            openModal('tech.html', 'tech');
        }

        function openModal(url, mode = 'right') {
            const modal = document.getElementById('modalContent');
            const backdrop = document.getElementById('modalBackdrop');
            if (!modal || !backdrop) return;

            modalMode = mode;

            if (mode === 'tech') {
                closeSecondaryModal();
                layoutTechPanel(modal);
            } else if (mode === 'framed') {
                closeSecondaryModal();
                layoutFramedPanel(modal);
            } else {
                layoutSidePanel(modal, 'right');
            }

            modal.style.display = 'block';
            backdrop.style.display = 'block';
            modal.src = url;
        }

        function closeModal() {
            closeSecondaryModal();
            const modal = document.getElementById('modalContent');
            const backdrop = document.getElementById('modalBackdrop');
            if (modal) {
                modal.style.display = 'none';
                modal.src = 'about:blank';
                modalMode = 'right';
            }
            if (backdrop) backdrop.style.display = 'none';
        }

        function openSecondaryModal(url, options = {}) {
            const sec = document.getElementById('secondaryContent');
            if (!sec) return;

            if (options.position === 'center') {
                layoutCenterDetailPanel(sec);
            } else {
                layoutSidePanel(sec, 'left');
            }

            sec.style.display = 'block';

            if (isSecondaryOpen()) {
                sec.src = url;
            } else {
                sec.src = url;
            }
        }

        function closeSecondaryModal() {
            const sec = document.getElementById('secondaryContent');
            if (sec) {
                sec.style.display = 'none';
                sec.src = 'about:blank';
            }
            notifyTechIframe();
        }

        function notifyTechIframe() {
            const modal = document.getElementById('modalContent');
            if (modal && modal.style.display === 'block' && modal.contentWindow) {
                modal.contentWindow.postMessage({ type: 'tech-state-changed' }, '*');
            }
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'tech-state-changed') {
                notifyTechIframe();
            }
        });

        function closeAllPanels() {
            closeModal();
        }

        function openFactionWindow() {
            closeSecondaryModal();
            document.getElementById('iconArmy')?.classList.remove('active');
            document.getElementById('iconBuild')?.classList.remove('active');
            document.getElementById('iconTech')?.classList.remove('active');
            openModal(`pageOfCountry.html?faction=${encodeURIComponent(getCampaignFaction())}`, 'tech');
        }

        function loadFactionIcon() {
            const faction = getCampaignFaction();
            const img = document.getElementById('factionIconImg');
            if (!img) return;

            const icons = {
                rome: '../images/icon_rome.png',
                carthage: '../images/icon_carthage.png',
            };

            if (window.GameContent) {
                const data = GameContent.getFaction(faction);
                if (data?.icon) {
                    img.src = data.icon;
                    img.alt = data.name || faction;
                    return;
                }
            }

            img.src = icons[faction] || icons.rome;
            img.alt = faction;
        }

        function endTurn() {
            const btn = document.querySelector('.btn-end-turn');
            btn.style.opacity = '0.5';
            setTimeout(() => {
                alert(window.GameI18n ? GameI18n.t('alert.endTurn') : 'Ход передан другим фракциям.');
                btn.style.opacity = '1';
            }, 400);
        }

        window.addEventListener('resize', () => {
            const modal = document.getElementById('modalContent');
            const sec = document.getElementById('secondaryContent');
            if (modal && modal.style.display === 'block') {
                if (modalMode === 'tech') {
                    layoutTechPanel(modal);
                } else if (modalMode === 'framed') {
                    layoutFramedPanel(modal);
                } else {
                    layoutSidePanel(modal, 'right');
                }
            }
            if (sec && sec.style.display === 'block') {
                if (sec.style.transform.includes('translate')) {
                    layoutCenterDetailPanel(sec);
                } else {
                    layoutSidePanel(sec, 'left');
                }
            }
        });

        (function initFromQuery() {
            if (window.GameI18n) GameI18n.apply();
            loadFactionIcon();

            const params = new URLSearchParams(window.location.search);
            const faction = (params.get('faction') || 'rome').toLowerCase();
            const mapPlaceholder = document.getElementById('mapPlaceholder');
            if (!mapPlaceholder) return;

            const config = {
                rome: {
                    titleKey: 'title.campaign.rome',
                    labelKey: 'map.rome',
                },
                carthage: {
                    titleKey: 'title.campaign.carthage',
                    labelKey: 'map.carthage',
                },
            }[faction] || {
                titleKey: 'title.campaign.rome',
                labelKey: 'map.placeholder',
            };

            document.title = GameI18n.t(config.titleKey);
            mapPlaceholder.textContent = GameI18n.t(config.labelKey);
        })();
    </script>

    <div id="modalBackdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:1000; pointer-events:none;"></div>
    <iframe id="modalContent" style="display:none; position:fixed; z-index:1001; border:none; background:#0a0502;" frameborder="0"></iframe>
    <iframe id="secondaryContent" style="display:none; position:fixed; z-index:1002; border:none; background:#0a0502;" frameborder="0"></iframe>

</body>
</html>
