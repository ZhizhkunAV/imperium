<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кампания — Римская республика</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --bronze: #6b5a3a;
            --text: #d4c5a9;
            --bg-panel: rgba(5, 3, 1, 0.92);
            --border-panel: rgba(180, 140, 60, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'EB Garamond', 'Georgia', serif;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* === ГЛАВНЫЙ КОНТЕЙНЕР / РАМКА === */
        .game-frame {
            width: 100vw;
            height: 100vh;
            background: #0a0502;
            background-image:
                radial-gradient(ellipse at 60% 45%, rgba(30, 15, 5, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at center, transparent 20%, rgba(0, 0, 0, 0.9) 100%);
            border: 3px solid var(--gold-dark);
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .game-frame::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(201, 168, 76, 0.3);
            pointer-events: none;
            z-index: 10;
        }

        /* === ОСНОВНАЯ ОБЛАСТЬ (КАРТА) === */
        .game-main {
            flex: 0 0 75.1%;
            display: flex;
            position: relative;
            z-index: 2;
            min-height: 0;
            margin: 4px 4px 0 4px;
        }

        .map-area {
            flex: 1;
            display: flex;
            align-items: stretch;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(201, 168, 76, 0.12);
            position: relative;
            overflow: hidden;
        }

        .map-viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            background: #152a3c;
            perspective: 1100px;
            perspective-origin: 50% 88%;
        }

        .map-viewport.is-dragging {
            cursor: grabbing;
        }

        .map-extra-frame {
            position: absolute;
            inset: 0;
            z-index: 4;
            width: 100%;
            height: 100%;
            border: 0;
            display: none;
            background: #050302;
        }

        .map-extra-frame.visible {
            display: block !important;
        }

        .map-extra-frame:not(.visible) {
            display: none !important;
            pointer-events: none;
        }

        .map-area.extra-mode .map-viewport,
        .map-area.extra-mode .map-placeholder {
            visibility: hidden;
            pointer-events: none;
        }
        .map-area.extra-mode .map-side-panel {
            visibility: visible;
            pointer-events: none;
            z-index: 40;
        }
        .map-area.extra-mode .map-side-panel.open {
            pointer-events: auto;
        }

        /* Нижняя рамка с мини-картой всегда видна (как в RTW). */

        .map-stage {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center 92%;
            transform-style: preserve-3d;
            will-change: transform;
            background: #152a3c;
        }

        .map-underlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            display: none;
            image-rendering: auto;
        }

        .map-stage.is-pixel-view .map-underlay {
            display: block;
        }

        .map-terrain {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            mix-blend-mode: overlay;
            opacity: 0.42;
        }

        .map-stage:not(.is-pixel-view) .map-underlay,
        .map-stage:not(.is-pixel-view) .map-terrain {
            display: none !important;
            opacity: 0;
            mix-blend-mode: normal;
        }

        .map-stage.is-pixel-view .map-terrain {
            display: none !important;
            opacity: 0;
        }

        .map-stage.is-view4 .map-terrain {
            display: none !important;
        }

        .map-relief {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            z-index: 2;
        }
        .map-relief.is-on {
            display: block;
        }
        .map-relief canvas,
        .map-relief .map-relief-view {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            image-rendering: auto;
        }

        .map-stage > #mapCanvas {
            display: block;
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            image-rendering: auto;
            background: #2a6e90;
        }
        .map-stage.is-pixel-view > #mapCanvas {
            background: transparent !important;
        }
        .map-stage.is-pixel-view .map-underlay {
            display: block;
            z-index: 0;
        }
        .map-stage.is-pixel-view .map-terrain {
            display: none !important;
            opacity: 0;
        }
        .map-stage > #mapTerrain {
            position: absolute;
            z-index: 1;
        }

        .map-placeholder {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: rgba(201, 168, 76, 0.35);
            text-transform: uppercase;
            pointer-events: none;
            background: rgba(5, 3, 1, 0.55);
        }

        .map-placeholder.hidden {
            display: none;
        }

        .camera-scale {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 36;
            min-width: 118px;
            padding: 8px 10px 9px;
            background: linear-gradient(180deg, rgba(40, 32, 22, 0.92), rgba(16, 12, 8, 0.88));
            border: 1px solid rgba(201, 168, 76, 0.45);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
            color: #efe4d0;
            pointer-events: none;
            font-family: 'EB Garamond', Georgia, serif;
        }
        .camera-scale-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            line-height: 1.35;
        }
        .camera-scale-row + .camera-scale-row { margin-top: 3px; }
        .camera-scale-row span {
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #b7a078;
        }
        .camera-scale-row b {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            color: #f5e6c8;
            min-width: 42px;
            text-align: right;
        }
        .map-area.extra-mode .camera-scale { display: none; }

        .map-toolbar {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: stretch;
            max-height: calc(100% - 20px);
            overflow-y: auto;
        }

        .map-variant-btn,
        .btn-home {
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 10px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(201, 168, 76, 0.45);
            color: var(--gold-light);
            text-decoration: none;
            text-align: center;
            transition: all 0.25s;
            min-width: 148px;
        }

        .map-variant-btn:hover,
        .btn-home:hover {
            border-color: var(--gold);
            color: #fff;
            box-shadow: 0 0 14px rgba(201, 168, 76, 0.25);
            background: rgba(201, 168, 76, 0.12);
        }

        .map-variant-btn.active {
            color: #fff;
            background: rgba(201, 168, 76, 0.2);
            box-shadow: inset 0 0 0 1px rgba(201, 168, 76, 0.35);
            border-color: var(--gold);
        }

        /* === БОКОВАЯ ПАНЕЛЬ РЕГИОНА === */
        .map-side-panel {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(320px, 42%);
            z-index: 25;
            background: rgba(8, 5, 2, 0.95);
            border-right: 2px solid var(--gold);
            transform: translateX(-105%);
            transition: transform 0.35s ease;
            padding: 18px 16px 16px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.55);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .map-side-panel.open {
            transform: translateX(0);
            pointer-events: auto;
        }

        .map-side-panel-close {
            align-self: flex-end;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(201, 168, 76, 0.45);
            background: rgba(0, 0, 0, 0.45);
            color: var(--gold-light);
            cursor: pointer;
            font-size: 14px;
        }

        .map-side-panel-close:hover {
            border-color: var(--gold);
            color: #fff;
        }

        .map-side-title {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(201, 168, 76, 0.65);
        }

        .map-side-name {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold-light);
            line-height: 1.25;
            text-shadow: 0 0 18px rgba(201, 168, 76, 0.25);
        }

        .map-side-note {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.45;
            opacity: 0.9;
        }

        /* === НИЖНЯЯ ПАНЕЛЬ === */
        .bottom-panel {
            flex: 1;
            background: var(--bg-panel);
            z-index: 3;
            display: flex;
            align-items: stretch;
            padding: 0;
            gap: 0;
            margin: 0 4px 4px 4px;
            border: 1px solid rgba(201, 168, 76, 0.15);
            min-height: 0;
            position: relative;
        }

        .block-left {
            flex-shrink: 0;
            width: 384px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 0 6px;
            position: relative;
        }

        .block-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold));
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.25);
            z-index: 5;
        }

        .minimap-frame {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(201, 168, 76, 0.55);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(201, 168, 76, 0.1);
        }

        .minimap {
            width: 100%;
            height: 100%;
            background: rgba(201, 168, 76, 0.03);
            border: 1px solid rgba(201, 168, 76, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            letter-spacing: 1px;
            color: rgba(201, 168, 76, 0.3);
            text-transform: uppercase;
            text-align: center;
        }

        .antique-column {
            width: 22px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px 0;
            z-index: 5;
            position: relative;
        }

        .column-capital {
            width: 22px;
            height: 10px;
            position: relative;
            flex-shrink: 0;
        }

        .column-capital::before {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            right: -3px;
            height: 5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold));
            border-radius: 2px 2px 1px 1px;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.3);
        }

        .column-capital::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: -3px;
            right: -3px;
            height: 2px;
            background: var(--gold);
        }

        .column-shaft {
            flex: 1;
            width: 12px;
            background: linear-gradient(180deg, rgba(180,140,80,0.5), rgba(140,100,50,0.4), rgba(180,140,80,0.5));
            position: relative;
            border-left: 1px solid rgba(201,168,76,0.3);
            border-right: 1px solid rgba(201,168,76,0.3);
        }

        .column-shaft::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(201,168,76,0.2);
            box-shadow:
                3px 0 0 rgba(201,168,76,0.15),
                6px 0 0 rgba(201,168,76,0.1);
        }

        .column-base {
            width: 22px;
            height: 12px;
            position: relative;
            flex-shrink: 0;
        }

        .column-base::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            right: -4px;
            height: 6px;
            background: linear-gradient(180deg, var(--gold), var(--gold-dark));
            border-radius: 1px 1px 3px 3px;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.3);
        }

        .column-base::after {
            content: '';
            position: absolute;
            top: 2px;
            left: -4px;
            right: -4px;
            height: 2px;
            background: var(--gold-light);
            opacity: 0.6;
        }

        .block-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            gap: 0;
            min-width: 0;
            position: relative;
        }

        #bottomArmyDetail {
            margin-top: 14px;
            border-radius: 2px;
        }

        .block-center::before {
            content: '';
            position: absolute;
            top: 11px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.15);
            z-index: 4;
        }

        .tab-switcher {
            display: flex;
            gap: 0;
            position: relative;
            z-index: 6;
            height: 24px;
            align-items: center;
        }

        .tab-btn {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            background: var(--bg-panel);
            border: 1px solid rgba(201, 168, 76, 0.35);
            color: #8b7355;
            transition: all 0.2s;
            padding: 3px 14px;
            height: 22px;
            line-height: 1;
            white-space: nowrap;
            position: relative;
        }

        .tab-btn:hover {
            color: var(--gold-light);
            border-color: rgba(201, 168, 76, 0.6);
            background: rgba(201, 168, 76, 0.06);
        }

        .tab-btn.active {
            color: #fff;
            border-color: var(--gold);
            background: rgba(201, 168, 76, 0.18);
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.2);
        }

        .block-center-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 3;
        }

        .card-area {
            flex: 1;
            display: flex;
            align-items: stretch;
            padding: 2px;
            gap: 2px;
        }

        .card-area-top {
            border-bottom: 1px solid rgba(201, 168, 76, 0.3);
            padding-bottom: 3px;
        }

        .card-area-bottom {
            padding-top: 3px;
        }

        .card-slot {
            flex: 1;
            background: rgba(201, 168, 76, 0.04);
            border: 1px dashed rgba(201, 168, 76, 0.2);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(201, 168, 76, 0.2);
            font-size: 0.55rem;
        }

        .block-right {
            flex-shrink: 0;
            width: 384px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 0 6px;
            position: relative;
        }

        .block-right::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold), transparent);
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.25);
            z-index: 5;
        }

        .right-info-frame {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(201, 168, 76, 0.55);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(201, 168, 76, 0.1);
        }

        .icon-stack {
            display: flex;
            flex-direction: row;
            gap: 6px;
            justify-content: flex-start;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(201, 168, 76, 0.35);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: rgba(201, 168, 76, 0.5);
        }

        .btn-icon:hover {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(201, 168, 76, 0.08);
        }

        .btn-icon.active {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(201, 168, 76, 0.15);
            box-shadow: 0 0 15px rgba(201, 168, 76, 0.3);
        }

        .info-rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 1px;
            color: var(--gold);
        }

        .info-row span {
            color: #fff;
            font-weight: 700;
            font-size: 0.68rem;
        }

        .info-divider {
            width: 100%;
            height: 1px;
            background: rgba(201, 168, 76, 0.15);
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 8px;
        }

        .faction-icon-large {
            width: 64px;
            height: 64px;
            background: rgba(201, 168, 76, 0.06);
            border: 2px solid rgba(201, 168, 76, 0.45);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(201, 168, 76, 0.15);
            color: var(--gold-light);
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            overflow: hidden;
            padding: 0;
        }

        .faction-icon-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .faction-icon-large:hover {
            border-color: #ffd700;
            box-shadow: 0 0 28px rgba(201, 168, 76, 0.35);
            background: rgba(201, 168, 76, 0.12);
            transform: scale(1.05);
        }

        .btn-end-turn {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            cursor: pointer;
            background: rgba(139, 26, 26, 0.25);
            border: 1px solid rgba(200, 80, 80, 0.45);
            color: #c08080;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .btn-end-turn:hover {
            background: rgba(139, 26, 26, 0.45);
            border-color: #c05050;
            color: #ffaaaa;
            box-shadow: 0 0 15px rgba(200, 80, 80, 0.25);
        }

        .campaign-top-bar {
            flex-shrink: 0;
            z-index: 45;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            background: linear-gradient(180deg, rgba(12, 8, 4, 0.92), rgba(12, 8, 4, 0.55));
            border-bottom: 1px solid rgba(201, 168, 76, 0.25);
        }
        .campaign-top-bar span { pointer-events: auto; }
        .campaign-top-title {
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 2px;
            color: var(--gold-light);
        }
        .campaign-top-stats {
            display: flex;
            gap: 18px;
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            color: var(--gold);
        }
        .campaign-top-stats b { color: #fff; margin-left: 4px; }

        #dayNightOverlay {
            display: none;
        }

        .minimap-wrap {
            width: 100%;
            height: 100%;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #minimapCanvas {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(201, 168, 76, 0.35);
            background: #0c1a24;
            cursor: pointer;
        }

        #settlementGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            flex: 1;
            padding: 4px;
            min-height: 0;
        }
        .settlement-slot {
            flex-direction: column;
            font-size: 0.45rem;
            color: var(--gold);
            cursor: pointer;
            padding: 2px;
            gap: 1px;
        }
        .settlement-slot.built {
            border-style: solid;
