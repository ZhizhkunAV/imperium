    <script>
(function () {
  'use strict';

  const GEOJSON_URLS = (window.MapView1 && window.MapView1.geojsonUrls) || [
    '/maps/view1/regions.geojson',
    '/maps/view1/provinces.geojson'
  ];

  const MINIMAP_GEO_URLS = [
    '/maps/minimap/italy.geojson',
    '/maps/view1/regions.geojson'
  ];

  const PIXEL_VIEW_ASSETS = (window.MapView2 && window.MapView2.assets) || {
    2: {
      underlay: ['/maps/view2/underlay.jpg', '/maps/view2/underlay_1x.png'],
      labels: ['/maps/view2/labels.png', '/maps/view2/labels_1x.png'],
      regionsKey: 'View2PixelRegions'
    }
  };

  /**
   * Контрольные точки под исходную подложку 1362×1155 (потом ×3).
   * lon/lat → пиксель; дальше масштабируются под фактический размер картинки.
   */
  const VIEW1_GCPS = [
    { lon: 9.19, lat: 45.46, x: 505, y: 205 },
    { lon: 12.33, lat: 45.44, x: 815, y: 190 },
    { lon: 13.80, lat: 45.65, x: 990, y: 150 },
    { lon: 8.95, lat: 44.41, x: 420, y: 275 },
    { lon: 12.50, lat: 41.90, x: 735, y: 500 },
    { lon: 14.27, lat: 40.85, x: 895, y: 635 },
    { lon: 16.87, lat: 41.12, x: 1170, y: 635 },
    { lon: 15.65, lat: 38.11, x: 1075, y: 905 },
    { lon: 13.36, lat: 38.12, x: 840, y: 1015 },
    { lon: 15.10, lat: 36.85, x: 970, y: 1088 },
    { lon: 9.12, lat: 39.22, x: 170, y: 695 },
    { lon: 8.30, lat: 40.90, x: 125, y: 530 },
    { lon: 12.10, lat: 43.15, x: 680, y: 365 }
  ];
  const VIEW1_REF = { w: 1362, h: 1155 };

  let view1Affine = null;

  /** Только scale+translate по осям (без shear) — стабильнее на рисованных картах. */
  function solveAxisAffine(gcps) {
    const n = gcps.length;
    if (n < 2) return null;

    function fit1D(us, vs) {
      let sumU = 0, sumV = 0, sumUU = 0, sumUV = 0;
      for (let i = 0; i < n; i++) {
        sumU += us[i];
        sumV += vs[i];
        sumUU += us[i] * us[i];
        sumUV += us[i] * vs[i];
      }
      const denom = n * sumUU - sumU * sumU || 1e-12;
      const a = (n * sumUV - sumU * sumV) / denom;
      const c = (sumV - a * sumU) / n;
      return [a, c];
    }

    const lons = gcps.map((g) => g.lon);
    const lats = gcps.map((g) => g.lat);
    const xs = gcps.map((g) => g.x);
    const ys = gcps.map((g) => g.y);
    const [a, c] = fit1D(lons, xs);
    const [e, f] = fit1D(lats, ys);
    // x = a*lon + c; y = e*lat + f  (b=0, d=0)
    return { a: a, b: 0, c: c, d: 0, e: e, f: f };
  }

  /** Ручная доводка после фита (пиксели подложки 1362×1155). */
  const VIEW1_NUDGE = { x: -58, y: -22 };

  function rebuildView1Affine() {
    if (!state.mapImage) {
      view1Affine = null;
      return;
    }
    const iw = state.mapImage.naturalWidth || state.mapImage.width || VIEW1_REF.w;
    const ih = state.mapImage.naturalHeight || state.mapImage.height || VIEW1_REF.h;
    const sx = iw / VIEW1_REF.w;
    const sy = ih / VIEW1_REF.h;
    const gcps = VIEW1_GCPS.map((g) => ({
      lon: g.lon,
      lat: g.lat,
      x: g.x * sx,
      y: g.y * sy
    }));
    const aff = solveAxisAffine(gcps);
    if (!aff) {
      view1Affine = null;
      return;
    }
    aff.c += VIEW1_NUDGE.x * sx;
    aff.f += VIEW1_NUDGE.y * sy;
    view1Affine = aff;
  }

  function projectView1(lon, lat) {
    if (!view1Affine) rebuildView1Affine();
    if (!view1Affine) return [0, 0];
    const aff = view1Affine;
    return [
      aff.a * lon + aff.b * lat + aff.c,
      aff.d * lon + aff.e * lat + aff.f
    ];
  }

  function unprojectView1(x, y) {
    if (!view1Affine) rebuildView1Affine();
    if (!view1Affine) return [0, 0];
    const aff = view1Affine;
    const lon = (x - aff.c) / (aff.a || 1e-12);
    const lat = (y - aff.f) / (aff.e || 1e-12);
    return [lon, lat];
  }

  const viewport = document.getElementById('mapViewport');
  const stage = document.getElementById('mapStage');
  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('mapPlaceholder');
  const sidePanel = document.getElementById('mapSidePanel');
  const sidePanelName = document.getElementById('sidePanelName');
  const sidePanelNote = document.getElementById('sidePanelNote');

  function isPixelView(v) {
    // Вид 2 теперь iframe-3D (EXTRA_MAPS); пиксельный canvas-режим отключён
    return false;
  }

  function pixelAssets(v) {
    return PIXEL_VIEW_ASSETS[Number(v)] || PIXEL_VIEW_ASSETS[2];
  }

  function pixelRefFor(v) {
    const key = pixelAssets(v).regionsKey;
    return window[key] || { width: 4086, height: 3465, regions: [], labelsUrl: pixelAssets(v).labels[0] };
  }

  let PIXEL_REF = pixelRefFor(2);
  const VIEW2_MAX_EDGE = 4096;
  const mapUnderlay = document.getElementById('mapUnderlay');
  const terrainCanvas = document.getElementById('mapTerrain');
  const terrainCtx = terrainCanvas ? terrainCanvas.getContext('2d') : null;
  const TERRAIN_URLS = {
    grass: ['/images/terrain/grass.png', '../images/terrain/grass.png'],
    forest: ['/images/terrain/forest.png', '../images/terrain/forest.png'],
    mountain: ['/images/terrain/mountain.png', '../images/terrain/mountain.png'],
    hills: ['/images/terrain/hills.png', '../images/terrain/hills.png']
  };
  const PROVINCE_TERRAIN = {
    cisalpina: 'forest',
    venetia: 'grass',
    liguria: 'mountain',
    etruria: 'hills',
    umbria: 'grass',
    latium: 'grass',
    campania: 'hills',
    apulia: 'hills',
    calabria: 'mountain',
    sicilia: 'hills',
    sardinia: 'hills'
  };
  const terrainTiles = {};
  let terrainReady = false;
  let terrainLayerKey = '';
  let pixelRegions = (PIXEL_REF.regions || []).slice();
  let pixelSelectedIndex = -1;
  let labelImage = null;
  let labelCanvas = null;
  let labelCtx = null;
  let labelData = null;
  const borderCache = {}; // provinceIndex -> ImageData outline overlay
  let view1Paint = null;
  let view1PaintKey = '';
  let selectedCityName = '';

  const BORDER_CYAN = (window.MapEngine && window.MapEngine.BORDER_CYAN) || {
    glow: 'rgba(50, 160, 220, 0.28)',
    mid: 'rgba(80, 195, 255, 0.7)',
    core: 'rgba(170, 235, 255, 0.95)',
    pick: 'rgba(200, 245, 255, 1)'
  };

  /** Города кампании — из CampaignState */
  const VIEW2_CITIES = (window.CampaignState && window.CampaignState.CITIES) || [];

  const cameraBtn = null;
  const mapArea = document.getElementById('mapArea');
  const mapExtraFrame = document.getElementById('mapExtraFrame');

  const EXTRA_MAPS = {
    4: '/maps/rome/map.html?view=4',
    5: '/maps/rome/map.html?view=5',
    10: '/maps/view10/map.html?engine=three',
    12: '/maps/view10/map.html?engine=phaser&v=20260831paint2',
    16: '/maps/view16/map.html'
  };
  const ENGINE_VIEWS = { 10: 'three', 12: 'phaser' };
  const VALID_VIEWS = [4, 5, 10, 12, 16];

  const pixelCache = {};
  let minimapGeo = null;
  let extraCamera = null;

  /** Углы камеры — из MapEngine */
  const CAMERA_MODES = (window.MapEngine && window.MapEngine.CAMERA_MODES) || [
    { id: 'rtw', label: 'Угол: Total War', a: 1, b: 0.05, c: -0.16, d: 0.88, lift: 0, fitY: 0.48, rotateX: 60, rotateZ: -8 }
  ];

  const state = {
    view: 1,
    scale: 1,
    tx: 0,
    ty: 0,
    cameraMode: 0,
    canvasW: 1200,
    canvasH: 1400,
    geojson: null,
    features: [],
    bbox: [6.5, 36.4, 18.6, 47.2], // [minLon, minLat, maxLon, maxLat]
    mapImage: null,
    selectedIndex: -1,
    dragging: false,
    moved: false,
    lastX: 0,
    lastY: 0,
    minScale: 0.5,
    maxScale: 4,
    tiltExtra: 0,
    yawExtra: 0
  };

  function syncPixelUnderlay() {
    if (!mapUnderlay || !stage) return;
    if (isPixelView(state.view) && state.mapImage && state.mapImage.src) {
      if (mapUnderlay.src !== state.mapImage.src) mapUnderlay.src = state.mapImage.src;
      stage.classList.add('is-pixel-view');
      stage.classList.toggle('is-view4', state.view === 4);
    } else {
      stage.classList.remove('is-pixel-view');
      stage.classList.remove('is-view4');
    }
    if (window.View4Relief) View4Relief.setActive(state.view === 4);
  }

  function setPlaceholder(text, show) {
    if (!placeholder) return;
    if (show === false) {
      placeholder.classList.add('hidden');
      return;
    }
    placeholder.textContent = text || '';
    placeholder.classList.toggle('hidden', !text);
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('image fail: ' + src));
      img.src = src;
    });
  }

  async function loadFirstImage(urls) {
    for (let i = 0; i < urls.length; i++) {
      try {
        return await loadImage(urls[i]);
      } catch (_) { /* next */ }
    }
    return null;
  }

  async function fetchFirstJson(urls) {
    let lastErr = null;
    for (let i = 0; i < urls.length; i++) {
      try {
        const res = await fetch(urls[i]);
        if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + urls[i]);
        return await res.json();
      } catch (err) {
        lastErr = err;
      }
    }
    throw lastErr || new Error('GeoJSON недоступен');
  }

  function simplifyRing(ring, maxPts) {
    if (!ring || ring.length <= maxPts) return ring;
    const step = Math.max(1, Math.ceil(ring.length / maxPts));
    const out = [];
    for (let i = 0; i < ring.length; i += step) out.push(ring[i]);
    const first = out[0];
    const last = out[out.length - 1];
    if (first && last && (first[0] !== last[0] || first[1] !== last[1])) out.push([first[0], first[1]]);
    return out;
  }

  function simplifyGeom(geom, maxPts) {
    if (!geom) return geom;
    if (geom.type === 'Polygon') {
      return {
        type: 'Polygon',
        coordinates: geom.coordinates.map(function (ring, idx) {
          return simplifyRing(ring, idx === 0 ? maxPts : Math.min(32, maxPts));
        })
      };
    }
    if (geom.type === 'MultiPolygon') {
      return {
        type: 'MultiPolygon',
        coordinates: geom.coordinates.map(function (poly) {
          return poly.map(function (ring, idx) {
            return simplifyRing(ring, idx === 0 ? maxPts : Math.min(32, maxPts));
          });
        })
      };
    }
    return geom;
  }

  function simplifyCollection(geo, maxPts) {
    if (!geo || !geo.features) return geo;
    return {
      type: 'FeatureCollection',
      features: geo.features.map(function (f) {
        return {
          type: 'Feature',
          properties: f.properties,
          geometry: simplifyGeom(f.geometry, maxPts)
        };
      })
    };
  }

  function rebuildView4Relief() {
    if (!window.View4Relief) return;
    if (state.view !== 4 || !state.mapImage || !labelData) {
      View4Relief.setActive(false);
      return;
    }
    try {
      rebuildView1Affine();
      const cam = cameraMode();
      const rx = Math.max(0, Math.min(75, (cam.rotateX || 0) + (state.tiltExtra || 0)));
      View4Relief.rebuild({
        stage: stage,
        mapImage: state.mapImage,
        labelData: labelData,
        pixelRegions: pixelRegions,
        canvasW: state.canvasW,
        canvasH: state.canvasH,
        tilt: rx,
        terrainTiles: terrainTiles,
        terrainReady: terrainReady,
        provinceTerrain: PROVINCE_TERRAIN,
        projectLonLat: function (lon, lat, w, h) {
          const p = projectView1(lon, lat);
          const iw = state.mapImage.naturalWidth || PIXEL_REF.width || 1;
          const ih = state.mapImage.naturalHeight || PIXEL_REF.height || 1;
          return [p[0] / iw * w, p[1] / ih * h];
        },
        unprojectLonLat: function (nx, ny) {
          const iw = state.mapImage.naturalWidth || PIXEL_REF.width || 1;
          const ih = state.mapImage.naturalHeight || PIXEL_REF.height || 1;
          return unprojectView1(nx * iw, ny * ih);
        }
      });
    } catch (err) {
      console.warn('view4 relief', err);
      View4Relief.setActive(false);
    }
  }

  async function loadLabelMaskFor(view) {
    const ref = pixelRefFor(view);
    const assets = pixelAssets(view);
    const urls = [];
    if (ref.labelsUrl) urls.push(ref.labelsUrl);
    (assets.labels || []).forEach(function (u) {
      if (urls.indexOf(u) < 0) urls.push(u);
    });
    const img = await loadFirstImage(urls);
    if (!img) return false;
    labelImage = img;
    labelCanvas = document.createElement('canvas');
    const srcW = labelImage.naturalWidth || ref.width || 4086;
    const srcH = labelImage.naturalHeight || ref.height || 3465;
    const k = Math.min(1, VIEW2_MAX_EDGE / Math.max(srcW, srcH));
    labelCanvas.width = Math.max(1, Math.round(srcW * k));
    labelCanvas.height = Math.max(1, Math.round(srcH * k));
    labelCtx = labelCanvas.getContext('2d', { willReadFrequently: true });
    labelCtx.imageSmoothingEnabled = false;
    labelCtx.drawImage(labelImage, 0, 0, labelCanvas.width, labelCanvas.height);
    labelData = labelCtx.getImageData(0, 0, labelCanvas.width, labelCanvas.height);
    return true;
  }

  function stashPixelView(view) {
    if (!isPixelView(view)) return;
    pixelCache[view] = {
      mapImage: state.mapImage,
      labelImage: labelImage,
      labelCanvas: labelCanvas,
      labelData: labelData,
      pixelRegions: (pixelRegions || []).slice(),
      PIXEL_REF: PIXEL_REF,
      borderSheet: borderCache.__sheet || null
    };
  }

  function applyPixelPack(view) {
    PIXEL_REF = pixelRefFor(view);
    pixelRegions = (PIXEL_REF.regions || []).slice();
    const pack = pixelCache[view];
    if (!pack) {
      state.mapImage = null;
      labelImage = null;
      labelCanvas = null;
      labelData = null;
      terrainLayerKey = '';
      borderCache.__sheet = null;
      borderCache.__queued = false;
      return false;
    }
    state.mapImage = pack.mapImage;
    labelImage = pack.labelImage;
    labelCanvas = pack.labelCanvas;
    labelData = pack.labelData;
    pixelRegions = pack.pixelRegions && pack.pixelRegions.length ? pack.pixelRegions : pixelRegions;
    PIXEL_REF = pack.PIXEL_REF || PIXEL_REF;
    terrainLayerKey = '';
    borderCache.__sheet = pack.borderSheet;
    borderCache.__queued = false;
    view1Affine = null;
    return Boolean(pack.mapImage);
  }

  async function ensurePixelView(view) {
    if (pixelCache[view] && pixelCache[view].mapImage && pixelCache[view].labelData) {
      applyPixelPack(view);
      return true;
    }
    PIXEL_REF = pixelRefFor(view);
    pixelRegions = (PIXEL_REF.regions || []).slice();
    const img = await loadFirstImage(pixelAssets(view).underlay);
    if (!img) return false;
    state.mapImage = img;
    const ok = await loadLabelMaskFor(view);
    if (!ok) console.warn('маска провинций вида ' + view + ' не загрузилась');
    borderCache.__sheet = null;
    borderCache.__queued = false;
    terrainLayerKey = '';
    view1Affine = null;
    stashPixelView(view);
    return true;
  }

  function loadTerrainTiles() {
    const names = Object.keys(TERRAIN_URLS);
    return Promise.all(names.map(function (name) {
      return loadFirstImage(TERRAIN_URLS[name]).then(function (img) {
        if (img) terrainTiles[name] = img;
      });
    })).then(function () {
      terrainReady = Boolean(terrainTiles.grass || terrainTiles.forest || terrainTiles.hills || terrainTiles.mountain);
      terrainLayerKey = '';
      rebuildTerrainLayer();
      if (state.view === 4) rebuildView4Relief();
    }).catch(function (err) {
      console.warn('terrain tiles', err);
    });
  }

  function rebuildTerrainLayer() {
    if (!terrainReady || !labelData || !terrainCanvas || !terrainCtx) return;
    if (!isPixelView(state.view) || state.canvasW < 8 || state.canvasH < 8) return;
    const key = state.canvasW + 'x' + state.canvasH;
    if (terrainLayerKey === key) return;
    const lw = labelData.width;
    const lh = labelData.height;
    const src = labelData.data;
    const cmap = {};
    for (let i = 0; i < pixelRegions.length; i++) {
      const r = pixelRegions[i];
      const code = (r.index != null ? r.index : i) + 1;
      cmap[code] = PROVINCE_TERRAIN[r.id] || 'grass';
    }
    const types = ['grass', 'forest', 'mountain', 'hills'];
    const masks = {};
    for (let t = 0; t < types.length; t++) {
      const mc = document.createElement('canvas');
      mc.width = lw;
      mc.height = lh;
      const mctx = mc.getContext('2d');
      const img = mctx.createImageData(lw, lh);
      masks[types[t]] = { canvas: mc, ctx: mctx, img: img };
    }
    for (let p = 0; p < src.length; p += 4) {
      const code = src[p];
      if (!code) continue;
      const type = cmap[code] || 'grass';
      const m = masks[type];
      if (!m) continue;
      m.img.data[p] = 255;
      m.img.data[p + 1] = 255;
      m.img.data[p + 2] = 255;
      m.img.data[p + 3] = 255;
    }
    types.forEach(function (type) {
      masks[type].ctx.putImageData(masks[type].img, 0, 0);
    });

    const w = state.canvasW;
    const h = state.canvasH;
    terrainCanvas.width = w;
    terrainCanvas.height = h;
    terrainCtx.clearRect(0, 0, w, h);
    types.forEach(function (type) {
      const tile = terrainTiles[type];
      if (!tile) return;
      const tmp = document.createElement('canvas');
      tmp.width = w;
      tmp.height = h;
      const tg = tmp.getContext('2d');
      const pat = tg.createPattern(tile, 'repeat');
      if (!pat) return;
      tg.fillStyle = pat;
      tg.fillRect(0, 0, w, h);
      tg.globalCompositeOperation = 'destination-in';
      tg.drawImage(masks[type].canvas, 0, 0, w, h);
      terrainCtx.drawImage(tmp, 0, 0);
    });
    terrainLayerKey = key;
  }

  let view2Cover = { dx: 0, dy: 0, dw: 0, dh: 0, scale: 1 };

  function updateView2Cover() {
    if (!state.mapImage) return;
    const iw = state.mapImage.naturalWidth || PIXEL_REF.width || 4086;
    const ih = state.mapImage.naturalHeight || PIXEL_REF.height || 3465;
    const scale = Math.min(state.canvasW / iw, state.canvasH / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    view2Cover = {
      dx: (state.canvasW - dw) / 2,
      dy: (state.canvasH - dh) / 2,
      dw: dw,
      dh: dh,
      scale: scale,
      iw: iw,
      ih: ih
    };
  }

  function labelAtCanvas(cx, cy) {
    if (!labelData) return 0;
    const lw = labelData.width;
    const lh = labelData.height;
    const c = view2Cover;
    const lx = ((cx - c.dx) / c.dw) * lw;
    const ly = ((cy - c.dy) / c.dh) * lh;
    const x = Math.max(0, Math.min(lw - 1, Math.floor(lx)));
    const y = Math.max(0, Math.min(lh - 1, Math.floor(ly)));
    if (lx < 0 || ly < 0 || lx >= lw || ly >= lh) return 0;
    return labelData.data[(y * lw + x) * 4];
  }

  function findPixelRegionAt(cx, cy) {
    const code = labelAtCanvas(cx, cy);
    if (!code) return null;
    const index = pixelRegions.findIndex((r) => (r.index != null ? r.index + 1 : 0) === code);
    if (index < 0) {
      // fallback: code-1 as seed order index
      const byIndex = pixelRegions.findIndex((r) => r.index === code - 1);
      if (byIndex < 0) return null;
      return { region: pixelRegions[byIndex], index: byIndex, code: code };
    }
    return { region: pixelRegions[index], index: index, code: code };
  }

  function ensureBorderSheet() {
    if (!labelData || borderCache.__sheet) return borderCache.__sheet;
    const lw = labelData.width;
    const lh = labelData.height;
    const src = labelData.data;
    const sheet = document.createElement('canvas');
    sheet.width = lw;
    sheet.height = lh;
    const sctx = sheet.getContext('2d');
    const out = sctx.createImageData(lw, lh);
    const dst = out.data;
    for (let y = 1; y < lh - 1; y++) {
      for (let x = 1; x < lw - 1; x++) {
        const i = (y * lw + x) * 4;
        const code = src[i];
        if (!code) continue;
        const left = src[i - 4];
        const right = src[i + 4];
        const up = src[i - lw * 4];
        const down = src[i + lw * 4];
        const landEdge =
          (left && left !== code) ||
          (right && right !== code) ||
          (up && up !== code) ||
          (down && down !== code);
        if (!landEdge) continue;
        dst[i] = 90;
        dst[i + 1] = 210;
        dst[i + 2] = 255;
        dst[i + 3] = 220;
        dst[i + 4] = 90; dst[i + 5] = 210; dst[i + 6] = 255; dst[i + 7] = 90;
        const j = i - 4;
        if (j >= 0) { dst[j] = 90; dst[j + 1] = 210; dst[j + 2] = 255; dst[j + 3] = 90; }
      }
    }
    sctx.putImageData(out, 0, 0);
    borderCache.__sheet = sheet;
    return sheet;
  }

  function ensureSelectSheet(code) {
    if (!labelData || !code) return null;
    const key = 'selSheet_' + code;
    if (borderCache[key]) return borderCache[key];
    const lw = labelData.width;
    const lh = labelData.height;
    const src = labelData.data;
    const sheet = document.createElement('canvas');
    sheet.width = lw;
    sheet.height = lh;
    const sctx = sheet.getContext('2d');
    const out = sctx.createImageData(lw, lh);
    const dst = out.data;
    for (let y = 1; y < lh - 1; y++) {
      for (let x = 1; x < lw - 1; x++) {
        const i = (y * lw + x) * 4;
        if (src[i] !== code) continue;
        if (
          src[i - 4] !== code ||
          src[i + 4] !== code ||
          src[i - lw * 4] !== code ||
          src[i + lw * 4] !== code
        ) {
          dst[i] = 190;
          dst[i + 1] = 245;
          dst[i + 2] = 255;
          dst[i + 3] = 255;
        }
      }
    }
    sctx.putImageData(out, 0, 0);
    // second pass thicken
    sctx.globalCompositeOperation = 'source-over';
    sctx.filter = 'blur(0.6px)';
    sctx.drawImage(sheet, 0, 0);
    sctx.filter = 'none';
    borderCache[key] = sheet;
    return sheet;
  }

  /** Вид 2: подложка на весь экран (cover) + провинции по маске. */
  function drawView2() {
    if (!state.mapImage) {
      drawView2GeoFallback();
      return;
    }
    try {
      updateView2Cover();
      const c = view2Cover;
      if (window.MapView2 && MapView2.paintBase) {
        MapView2.paintBase(ctx, state.mapImage, c, state.canvasW, state.canvasH);
      } else {
        ctx.clearRect(0, 0, state.canvasW, state.canvasH);
        ctx.drawImage(state.mapImage, c.dx, c.dy, c.dw, c.dh);
      }
      if (labelData) {
        if (window.CampaignUI && state.view !== 4) {
          CampaignUI.drawFactionFillView2(ctx, labelData, pixelRegions, c);
        }
        if (borderCache.__sheet) {
          ctx.drawImage(borderCache.__sheet, c.dx, c.dy, c.dw, c.dh);
        } else if (!borderCache.__queued) {
          borderCache.__queued = true;
          requestAnimationFrame(function () {
            try { ensureBorderSheet(); } catch (e) { console.warn('borders', e); }
            if (isPixelView(state.view)) render();
          });
        }

        if (pixelSelectedIndex >= 0 && pixelRegions[pixelSelectedIndex]) {
          const code = (pixelRegions[pixelSelectedIndex].index != null
            ? pixelRegions[pixelSelectedIndex].index
            : pixelSelectedIndex) + 1;
          const sel = ensureSelectSheet(code);
          if (sel) ctx.drawImage(sel, c.dx, c.dy, c.dw, c.dh);
        }
      }
      drawCampaignOnMap();
    } catch (err) {
      console.warn('drawView2', err);
    }
  }

  function geoCityPos(city) {
    const p = project(city.lon, city.lat);
    return { x: p[0], y: p[1] };
  }

  function drawCampaignOnMap() {
    if (!window.CampaignUI || !window.CampaignState) return;
    const cityPosFn = isPixelView(state.view)
      ? (city) => { const p = cityCanvasPos(city); return { x: p[0], y: p[1] }; }
      : (city) => geoCityPos(city);

    CampaignUI.drawCampaignLayer(ctx, {
      scale: state.scale,
      minScale: state.minScale,
      mapW: state.canvasW,
      mapH: state.canvasH,
      cityPos: cityPosFn,
      lonLatPos: function (lon, lat) {
        const p = lonLatToCanvas(lon, lat);
        return { x: p[0], y: p[1] };
      },
      provinceFog: false,
      labelData: isPixelView(state.view) ? labelData : null,
      pixelRegions: pixelRegions,
      cover: isPixelView(state.view) ? view2Cover : null
    });
  }

  function saneBbox(b) {
    const fallback = [6.5, 36.4, 18.6, 47.2];
    if (!b || b.length < 4) return fallback.slice();
    const minLon = Number(b[0]), minLat = Number(b[1]), maxLon = Number(b[2]), maxLat = Number(b[3]);
    if (![minLon, minLat, maxLon, maxLat].every(Number.isFinite)) return fallback.slice();
    if (maxLon - minLon < 0.2 || maxLat - minLat < 0.2) return fallback.slice();
    if (minLon < -30 || maxLon > 50 || minLat < 20 || maxLat > 65) return fallback.slice();
    return [minLon, minLat, maxLon, maxLat];
  }

  function project(lon, lat) {
    const box = saneBbox(state.bbox);
    const [minLon, minLat, maxLon, maxLat] = box;
    const w = maxLon - minLon;
    const h = maxLat - minLat;
    const pad = 0.02;
    const x0 = state.canvasW * pad;
    const y0 = state.canvasH * pad;
    const x1 = state.canvasW * (1 - pad);
    const y1 = state.canvasH * (1 - pad);
    const x = x0 + ((lon - minLon) / w) * (x1 - x0);
    const y = y0 + ((maxLat - lat) / h) * (y1 - y0);
    return [x, y];
  }

  function unproject(cx, cy) {
    const box = saneBbox(state.bbox);
    const [minLon, minLat, maxLon, maxLat] = box;
    const w = maxLon - minLon;
    const h = maxLat - minLat;
    const pad = 0.02;
    const x0 = state.canvasW * pad;
    const y0 = state.canvasH * pad;
    const x1 = state.canvasW * (1 - pad);
    const y1 = state.canvasH * (1 - pad);
    const lon = minLon + ((cx - x0) / ((x1 - x0) || 1)) * w;
    const lat = maxLat - ((cy - y0) / ((y1 - y0) || 1)) * h;
    return [lon, lat];
  }

  function canvasToLonLat(cx, cy) {
    if (isPixelView(state.view) && state.mapImage) {
      updateView2Cover();
      const c = view2Cover;
      const ix = ((cx - c.dx) / (c.dw || 1)) * (c.iw || 1);
      const iy = ((cy - c.dy) / (c.dh || 1)) * (c.ih || 1);
      rebuildView1Affine();
      if (view1Affine) return unprojectView1(ix, iy);
    }
    return unproject(cx, cy);
  }

  function lonLatToCanvas(lon, lat) {
    if (isPixelView(state.view) && state.mapImage) {
      updateView2Cover();
      rebuildView1Affine();
      if (view1Affine) {
        const p = projectView1(lon, lat);
        const c = view2Cover;
        return [
          c.dx + (p[0] / (c.iw || 1)) * c.dw,
          c.dy + (p[1] / (c.ih || 1)) * c.dh
        ];
      }
    }
    return project(lon, lat);
  }

  function ringsFromFeature(f) {
    if (!f || !f.geometry) return [];
    const g = f.geometry;
    if (g.type === 'Polygon') return g.coordinates[0] ? [g.coordinates[0]] : [];
    if (g.type === 'MultiPolygon') {
      const out = [];
      for (let i = 0; i < g.coordinates.length; i++) {
        if (g.coordinates[i] && g.coordinates[i][0]) out.push(g.coordinates[i][0]);
      }
      return out;
    }
    return [];
  }

  function findGeoFeatureAt(geo, lon, lat) {
    if (!geo || !geo.features || typeof turf === 'undefined') return null;
    const pt = turf.point([lon, lat]);
    for (let i = 0; i < geo.features.length; i++) {
      try {
        if (turf.booleanPointInPolygon(pt, geo.features[i])) return geo.features[i];
      } catch (_) { /* skip */ }
    }
    return null;
  }

  function drawRingPath(ring) {
    if (!ring || ring.length < 2) return;
    const p0 = project(ring[0][0], ring[0][1]);
    ctx.moveTo(p0[0], p0[1]);
    for (let i = 1; i < ring.length; i++) {
      const p = project(ring[i][0], ring[i][1]);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
  }

  function forEachPolygonRing(geometry, fn) {
    if (!geometry) return;
    if (geometry.type === 'Polygon') {
      geometry.coordinates.forEach(fn);
    } else if (geometry.type === 'MultiPolygon') {
      geometry.coordinates.forEach((poly) => poly.forEach(fn));
    }
  }

  /** Только обводка региона. Заливка выделения запрещена. */
  function strokeFeature(feature, style, lineWidth) {
    const geom = feature.geometry;
    ctx.beginPath();
    forEachPolygonRing(geom, (ring) => drawRingPath(ring));
    ctx.strokeStyle = style;
    ctx.lineWidth = lineWidth;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function fillFeature(feature, fillStyle) {
    const geom = feature.geometry;
    ctx.beginPath();
    forEachPolygonRing(geom, (ring) => drawRingPath(ring));
    ctx.fillStyle = fillStyle;
    ctx.fill();
  }

  function drawAllBorders(selected) {
    for (let i = 0; i < state.features.length; i++) {
      if (i === selected) continue;
      strokeFeature(state.features[i], BORDER_CYAN.glow, 5.5);
      strokeFeature(state.features[i], BORDER_CYAN.mid, 2.6);
      strokeFeature(state.features[i], BORDER_CYAN.core, 1.35);
    }
    if (selected >= 0 && state.features[selected]) {
      strokeFeature(state.features[selected], BORDER_CYAN.glow, 8);
      strokeFeature(state.features[selected], BORDER_CYAN.mid, 4);
      strokeFeature(state.features[selected], BORDER_CYAN.pick, 2.1);
    }
  }

  function landFillForLat(lat) {
    if (lat > 44.8) return '#c5d48a';
    if (lat > 43.2) return '#d2dc90';
    if (lat > 41.5) return '#e0d89a';
    if (lat > 39.5) return '#ead89a';
    return '#eddc9e';
  }

  function featureCentroid(feature) {
    try {
      if (typeof turf !== 'undefined') {
        const c = turf.centroid(feature);
        return c.geometry.coordinates;
      }
    } catch (_) { /* fall through */ }
    return [12.5, 42];
  }

  function paintView1Underlay() {
    const key = 'relief3:' + state.canvasW + 'x' + state.canvasH + ':' + state.features.length + ':' + ((window.ItalyDEM && ItalyDEM.ready()) ? 'd' : 'n');
    if (view1Paint && view1PaintKey === key) return view1Paint;

    const off = document.createElement('canvas');
    off.width = state.canvasW;
    off.height = state.canvasH;
    const g = off.getContext('2d');
    const W = state.canvasW;
    const H = state.canvasH;

    const sea = g.createRadialGradient(W * 0.52, H * 0.42, 40, W * 0.5, H * 0.52, Math.max(W, H) * 0.78);
    sea.addColorStop(0, '#8ed4e4');
    sea.addColorStop(0.18, '#5eb4cc');
    sea.addColorStop(0.45, '#3a8eb0');
    sea.addColorStop(0.75, '#2a6e90');
    sea.addColorStop(1, '#1e5570');
    g.fillStyle = sea;
    g.fillRect(0, 0, W, H);

    const hasDem = window.ItalyDEM && ItalyDEM.ready();
    if (hasDem) {
      const geo = ItalyDEM.paintGeo(Math.min(900, W), Math.min(1040, H), state.bbox, { sea: '#2a7a96' });
      g.drawImage(geo, 0, 0, W, H);
    } else {
      for (let i = 0; i < state.features.length; i++) {
        const f = state.features[i];
        const ll = featureCentroid(f);
        g.beginPath();
        forEachPolygonRing(f.geometry, (ring) => {
          if (!ring || ring.length < 2) return;
          const p0 = project(ring[0][0], ring[0][1]);
          g.moveTo(p0[0], p0[1]);
          const step = Math.max(1, Math.ceil(ring.length / 160));
          for (let k = step; k < ring.length; k += step) {
            const p = project(ring[k][0], ring[k][1]);
            g.lineTo(p[0], p[1]);
          }
          g.closePath();
        });
        const lg = g.createLinearGradient(0, 0, W * 0.35, H);
        lg.addColorStop(0, landFillForLat(ll[1] + 0.5));
        lg.addColorStop(1, landFillForLat(ll[1] - 0.7));
        g.fillStyle = lg;
        g.fill();
      }
    }

    g.beginPath();
    for (let i = 0; i < state.features.length; i++) {
      forEachPolygonRing(state.features[i].geometry, (ring, ringIdx) => {
        if (ringIdx > 0 || !ring || ring.length < 2) return;
        const p0 = project(ring[0][0], ring[0][1]);
        g.moveTo(p0[0], p0[1]);
        const step = Math.max(1, Math.ceil(ring.length / 180));
        for (let k = step; k < ring.length; k += step) {
          const p = project(ring[k][0], ring[k][1]);
          g.lineTo(p[0], p[1]);
        }
        g.closePath();
      });
    }
    g.strokeStyle = 'rgba(210, 245, 245, 0.45)';
    g.lineWidth = 2.2;
    g.stroke();
    g.strokeStyle = 'rgba(40, 90, 70, 0.35)';
    g.lineWidth = 1;
    g.stroke();

    view1Paint = off;
    view1PaintKey = key;
    return off;
  }

  function cityCanvasPos(city) {
    const c = view2Cover;
    const iw = c.iw || PIXEL_REF.width || 4086;
    const ih = c.ih || PIXEL_REF.height || 3465;
    return [
      c.dx + (city.x / iw) * c.dw,
      c.dy + (city.y / ih) * c.dh
    ];
  }

  function cityIconScale() {
    return 26 / Math.max(0.2, state.scale || 1);
  }

  function drawRtwCity(x, y, city, selected) {
    const u = cityIconScale();
    const s = (city.capital ? 1.2 : 1) * (u / 26);
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(2 * s, 5 * s, 12 * s, 4.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e8dcc4';
    ctx.fillRect(-9 * s, -6 * s, 8 * s, 8 * s);
    ctx.fillStyle = '#d4c4a4';
    ctx.fillRect(0, -4 * s, 9 * s, 7 * s);
    ctx.fillStyle = '#c4b090';
    ctx.fillRect(-4 * s, -2 * s, 6 * s, 5 * s);

    ctx.fillStyle = '#8b3a28';
    ctx.beginPath();
    ctx.moveTo(-10 * s, -6 * s);
    ctx.lineTo(-5 * s, -12 * s);
    ctx.lineTo(0, -6 * s);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-1 * s, -4 * s);
    ctx.lineTo(4.5 * s, -10 * s);
    ctx.lineTo(10 * s, -4 * s);
    ctx.fill();

    const bh = (city.capital ? 22 : 16) * s;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(11 * s + 1, -bh + 1, 4 * s, bh);
    ctx.fillStyle = selected ? '#c9a84c' : '#6a3d8a';
    ctx.fillRect(11 * s, -bh, 4 * s, bh);
    ctx.strokeStyle = 'rgba(255, 230, 160, 0.75)';
    ctx.lineWidth = Math.max(0.6, 0.8 * s);
    ctx.strokeRect(11 * s, -bh, 4 * s, bh);

    const label = (city.ru || city.name).toUpperCase();
    ctx.font = (city.capital ? 'bold ' : '') + Math.max(9, 10 * s) + "px 'Cinzel', Georgia, serif";
    ctx.textAlign = 'center';
    const tw = Math.max(ctx.measureText(label).width + 10 * s, 36 * s);
    const ly = 14 * s;
    ctx.fillStyle = selected ? 'rgba(90, 55, 20, 0.92)' : 'rgba(28, 18, 12, 0.88)';
    ctx.fillRect(-tw / 2, ly - 11 * s, tw, 14 * s);
    ctx.strokeStyle = selected ? '#e0c878' : 'rgba(201, 168, 76, 0.65)';
    ctx.strokeRect(-tw / 2, ly - 11 * s, tw, 14 * s);
    ctx.fillStyle = '#f4ead2';
    ctx.fillText(label, 0, ly);
    ctx.restore();
  }

  function drawView2Cities() {
    if (!VIEW2_CITIES.length) return;
    updateView2Cover();
    for (let i = 0; i < VIEW2_CITIES.length; i++) {
      const city = VIEW2_CITIES[i];
      const p = cityCanvasPos(city);
      drawRtwCity(p[0], p[1], city, selectedCityName === city.name);
    }
  }

  function findCityAt(cx, cy) {
    const hitR = cityIconScale() * 1.15;
    const hitR2 = hitR * hitR;
    let best = null;
    let bestD = hitR2;
    for (let i = 0; i < VIEW2_CITIES.length; i++) {
      const p = cityCanvasPos(VIEW2_CITIES[i]);
      const d = (p[0] - cx) * (p[0] - cx) + (p[1] - cy) * (p[1] - cy);
      if (d < bestD) {
        bestD = d;
        best = VIEW2_CITIES[i];
      }
    }
    return best;
  }

  function openCityConstruction(city) {
    selectedCityName = city.name;
    const idx = pixelRegions.findIndex((r) => r.id === city.region);
    if (idx >= 0) {
      pixelSelectedIndex = idx;
      state.selectedIndex = -1;
    }
    if (window.CampaignUI) {
      CampaignUI.openCity(city, {
        switchTab: window.switchTab,
        openPanel: openSidePanel,
        flyTo: function (c) {
          const rect = viewport.getBoundingClientRect();
          CampaignUI.flyToCity(c, {
            tx: state.tx,
            ty: state.ty,
            scale: state.scale,
            minScale: state.minScale,
            maxScale: state.maxScale,
            mapW: state.canvasW,
            mapH: state.canvasH,
            viewportRect: rect,
            cityPos: function (ci) {
              const p = cityCanvasPos(ci);
              return { x: p[0], y: p[1] };
            }
          }, function () { applyTransform(); render(); });
        }
      });
      if (sidePanelNote) {
        sidePanelNote.textContent = 'Строительство · очередь зданий внизу экрана.';
      }
      return;
    }
    if (sidePanelNote) {
      sidePanelNote.textContent = 'Поселение · откройте вкладку «Поселение» для строительства.';
    }
    openSidePanel(city.ru || city.name);
    if (typeof window.switchTab === 'function') window.switchTab('settlement');
    render();
  }

  function drawView1() {
    try {
      ctx.fillStyle = '#2a6e90';
      ctx.fillRect(0, 0, state.canvasW, state.canvasH);
      if (!state.features.length) {
        ctx.fillStyle = 'rgba(232, 210, 140, 0.9)';
        ctx.font = '22px Cinzel, serif';
        ctx.textAlign = 'center';
        ctx.fillText('Нет данных GeoJSON для вида 1', state.canvasW / 2, state.canvasH / 2);
        return;
      }
      const under = paintView1Underlay();
      ctx.drawImage(under, 0, 0);
      drawAllBorders(state.selectedIndex);
      drawCampaignOnMap();
    } catch (err) {
      console.warn('drawView1', err);
      drawView2GeoFallback();
    }
  }

  /** Запасной режим без картинки — старый GeoJSON-скетч. */
  function drawView2GeoFallback() {
    ctx.fillStyle = '#c5d9e8';
    ctx.fillRect(0, 0, state.canvasW, state.canvasH);
    for (let i = 0; i < state.features.length; i++) {
      fillFeature(state.features[i], '#e8dcc4');
    }
    drawAllBorders(-1);
  }

  function render() {
    try {
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
    } catch (_) {}
    ctx.clearRect(0, 0, state.canvasW, state.canvasH);
    if (state.view === 1) drawView1();
    else if (isPixelView(state.view)) drawView2();
    else drawView2GeoFallback();
    window.__campaignMapRender = render;
    try { updateMinimap(); } catch (_) {}
  }

  function updateMinimap() {
    if (!window.CampaignUI) return;
    const geo = minimapGeo || state.geojson;
    let viewQuad = null;
    let center = null;

    if (EXTRA_MAPS[state.view]) {
      if (extraCamera && extraCamera.viewQuad) viewQuad = extraCamera.viewQuad;
      if (extraCamera && extraCamera.center) center = extraCamera.center;
    } else {
      const rect = viewport.getBoundingClientRect();
      const corners = [
        [rect.left, rect.top],
        [rect.right, rect.top],
        [rect.right, rect.bottom],
        [rect.left, rect.bottom]
      ];
      viewQuad = corners.map(function (xy) {
        const p = canvasPointFromClient(xy[0], xy[1]);
        const ll = canvasToLonLat(p[0], p[1]);
        return { lon: ll[0], lat: ll[1] };
      });
      const mid = canvasPointFromClient(rect.left + rect.width / 2, rect.top + rect.height / 2);
      const cll = canvasToLonLat(mid[0], mid[1]);
      center = { lon: cll[0], lat: cll[1] };
    }

    let highlightRings = null;
    if (center) {
      const feat = findGeoFeatureAt(geo, center.lon, center.lat);
      if (feat) highlightRings = ringsFromFeature(feat);
    }

    CampaignUI.renderMinimap({
      geojson: geo,
      bbox: state.bbox,
      viewQuad: viewQuad,
      highlightRings: highlightRings,
      mapW: state.canvasW,
      mapH: state.canvasH
    });
  }

  function cameraMode() {
    return CAMERA_MODES[state.cameraMode] || CAMERA_MODES[0];
  }

  function updateCameraBtn() {
    if (!cameraBtn) return;
    cameraBtn.textContent = cameraMode().label;
    cameraBtn.classList.toggle('active', cameraMode().id !== 'top');
  }

  function cycleCameraMode() {
    state.cameraMode = (state.cameraMode + 1) % CAMERA_MODES.length;
    localStorage.setItem('campaignMapCameraV2', String(state.cameraMode));
    state.tiltExtra = 0;
    state.yawExtra = 0;
    updateCameraBtn();
    fitCanvasToViewport();
    render();
  }

  function applyTransform() {
    clampCamera();
    const cam = cameraMode();
    if (window.MapEngine && MapEngine.applyCssTransform) {
      MapEngine.applyCssTransform(stage, cam, state.tx, state.ty, state.scale, state.canvasH, state.tiltExtra, state.yawExtra);
    } else {
      const liftPx = Math.round(state.canvasH * (cam.lift || 0));
      const rx = Math.max(0, Math.min(75, (cam.rotateX || 0) + (state.tiltExtra || 0)));
      const rz = (cam.rotateZ || 0) + (state.yawExtra || 0);
      stage.style.transform =
        'translate3d(' + state.tx + 'px,' + state.ty + 'px,0) scale(' + state.scale + ') ' +
        'rotateX(' + rx + 'deg) rotateZ(' + rz + 'deg) ' +
        'matrix(' + cam.a + ',' + cam.b + ',' + cam.c + ',' + cam.d + ',0,' + liftPx + ')';
    }
    updateCameraScaleHud();
    try { updateMinimap(); } catch (_) {}
  }

  function wrapYaw(deg) {
    deg = deg % 360;
    if (deg < 0) deg += 360;
    return deg;
  }

  function effectiveRotateZ() {
    return (cameraMode().rotateZ || 0) + (state.yawExtra || 0);
  }

  function updateCameraScaleHud() {
    const zoomEl = document.getElementById('hudZoomPct');
    const tiltEl = document.getElementById('hudTiltPct');
    const yawEl = document.getElementById('hudYawPct');
    if (!zoomEl || !tiltEl) return;
    const minS = state.minScale || 0.5;
    zoomEl.textContent = Math.round((state.scale / minS) * 100) + '%';
    const cam = cameraMode();
    const rx = Math.max(0, Math.min(75, (cam.rotateX || 0) + (state.tiltExtra || 0)));
    tiltEl.textContent = Math.round((rx / 75) * 100) + '%';
    if (yawEl) yawEl.textContent = Math.round(wrapYaw(state.yawExtra || 0)) + '°';
    if (terrainCanvas && isPixelView(state.view) && state.view !== 4) {
      const z = state.scale / minS;
      terrainCanvas.style.opacity = String(Math.min(0.62, 0.28 + (z - 1) * 0.17));
    }
    if (state.view === 4 && window.View4Relief && View4Relief.renderTilt) {
      View4Relief.renderTilt(rx);
    }
  }

  /** Не даём утащить карту за край экрана (как в Total War). */
  const STAGE_ORIGIN_Y = 0.92;
  const PAN_EDGE = 14;

  function originOffsetY() {
    return (STAGE_ORIGIN_Y - 0.5) * state.canvasH;
  }

  function cameraYScale() {
    const cam = cameraMode();
    const rx = Math.max(0, Math.min(75, (cam.rotateX || 0) + (state.tiltExtra || 0)));
    const base = Math.max(0.35, cam.fitY || cam.d || 1);
    const k = Math.cos(rx * Math.PI / 180);
    return Math.max(0.3, base * (0.4 + 0.6 * k));
  }

  function clampCamera() {
    const rect = viewport.getBoundingClientRect();
    const vw = Math.max(1, rect.width);
    const vh = Math.max(1, rect.height);
    const minS = state.minScale || 0.5;
    const maxS = state.maxScale || 8;
    state.scale = Math.max(minS, Math.min(maxS, state.scale));
    const s = state.scale;
    const sw = state.canvasW * s;
    const visH = state.canvasH * s;
    const oy = STAGE_ORIGIN_Y;
    const offY = originOffsetY();
    const mx = Math.max(36, vw * 0.1);
    const my = Math.max(vh * 0.08, 40);

    let minTx;
    let maxTx;
    if (sw >= vw - 2 * mx) {
      maxTx = mx - vw / 2 + sw / 2;
      minTx = vw / 2 - mx - sw / 2;
    } else {
      minTx = 0;
      maxTx = 0;
    }

    const rx = Math.max(0, Math.min(75, (cameraMode().rotateX || 0) + (state.tiltExtra || 0)));
    let maxTy = vh / 2 - my - offY + oy * visH;
    let minTy = my - vh / 2 - offY - (1 - oy) * visH;
    maxTy += visH * (0.12 + 0.55 * (1 - rx / 75));
    minTy -= visH * 0.22;
    if (minTy > maxTy) {
      const pad = (minTy - maxTy) / 2 + 120;
      minTy -= pad;
      maxTy += pad;
    }

    state.tx = Math.max(minTx, Math.min(maxTx, state.tx));
    state.ty = Math.max(minTy, Math.min(maxTy, state.ty));
  }

  function fitCanvasToViewport() {
    const rect = viewport.getBoundingClientRect();
    const cssW = Math.max(400, Math.floor(rect.width));
    const cssH = Math.max(400, Math.floor(rect.height));

    if (isPixelView(state.view) && state.mapImage) {
      const iw = state.mapImage.naturalWidth || state.mapImage.width || 4086;
      const ih = state.mapImage.naturalHeight || state.mapImage.height || 3465;
      const k = Math.min(1, VIEW2_MAX_EDGE / Math.max(iw, ih));
      state.canvasW = Math.max(1, Math.round(iw * k));
      state.canvasH = Math.max(1, Math.round(ih * k));
      view1Affine = null;
      updateView2Cover();
    } else {
      view1Affine = null;
      view1Paint = null;
      view1PaintKey = '';
      const [minLon, minLat, maxLon, maxLat] = saneBbox(state.bbox);
      state.bbox = [minLon, minLat, maxLon, maxLat];
      const geoW = Math.max(0.001, maxLon - minLon);
      const geoH = Math.max(0.001, maxLat - minLat);
      const geoAspect = geoW / geoH;
      const base = 1600;
      if (geoAspect >= 1) {
        state.canvasW = base;
        state.canvasH = Math.max(640, Math.round(base / geoAspect));
      } else {
        state.canvasH = base;
        state.canvasW = Math.max(640, Math.round(base * geoAspect));
      }
    }

    canvas.width = state.canvasW;
    canvas.height = state.canvasH;
    stage.style.width = state.canvasW + 'px';
    stage.style.height = state.canvasH + 'px';
    stage.style.marginLeft = (-state.canvasW / 2) + 'px';
    stage.style.marginTop = (-state.canvasH / 2) + 'px';
    syncPixelUnderlay();
    rebuildTerrainLayer();
    rebuildView4Relief();

    const cam = cameraMode();
    const yFactor = Math.max(0.35, cam.fitY || cam.d || 1);
    const fitW = cssW / state.canvasW;
    const fitH = cssH / (state.canvasH * yFactor);
    const cover = Math.max(fitW, fitH) * 1.03;
    state.minScale = cover;
    state.maxScale = cover * 5;
    state.scale = cover;
    state.tx = 0;
    state.ty = originOffsetY() * (cover * yFactor - 1);
    applyTransform();
  }

  function findFeatureAtLonLat(lon, lat) {
    if (typeof turf === 'undefined') return null;
    const pt = turf.point([lon, lat]);
    for (let i = 0; i < state.features.length; i++) {
      const f = state.features[i];
      try {
        if (turf.booleanPointInPolygon(pt, f)) return { feature: f, index: i };
      } catch (_) { /* skip broken geom */ }
    }
    return null;
  }

  function openSidePanel(name, note) {
    sidePanelName.textContent = name || '—';
    if (note && sidePanelNote) sidePanelNote.textContent = note;
    sidePanel.classList.add('open');
  }

  function closeSidePanel() {
    sidePanel.classList.remove('open');
  }

  function selectFeature(index) {
    state.selectedIndex = index;
    pixelSelectedIndex = -1;
    if (index < 0) {
      closeSidePanel();
      render();
      return;
    }
    const f = state.features[index];
    const name = (f.properties && f.properties.reg_name) || 'Регион';
    if (sidePanelNote) {
      sidePanelNote.textContent =
        'Границы провинций по GeoJSON. Голубое свечение — как в Rome: Total War.';
    }
    openSidePanel(name);
    render();
  }

  function selectPixelRegion(index) {
    pixelSelectedIndex = index;
    state.selectedIndex = -1;
    if (index < 0) {
      closeSidePanel();
      render();
      return;
    }
    const r = pixelRegions[index];
    if (r && r.id) CS.revealRegion(r.id);
    if (sidePanelNote) {
      sidePanelNote.textContent =
        'Провинции по пиксельной маске подложки (берег = берег картинки). Не GeoJSON.';
    }
    openSidePanel(r ? r.name : 'Провинция');
    render();
  }

  function setView(view) {
    view = Number(view);
    if (view === 7) view = 3;
    if (!VALID_VIEWS.includes(view)) view = 4;

    if (isPixelView(state.view) && state.view !== view) stashPixelView(state.view);

    const prevView = state.view;
    state.view = view;
    localStorage.setItem('campaignMapVariant', String(view));
    try { localStorage.setItem('campaignMapPaintActiveView', String(view)); } catch (_) {}
    if (mapExtraFrame && mapExtraFrame.contentWindow) {
      try {
        mapExtraFrame.contentWindow.postMessage({ type: 'set-map-paint-view', view: view }, '*');
      } catch (_) {}
    }

    document.querySelectorAll('.map-variant-btn[data-view]').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.view) === view);
    });

    const isExtra = Boolean(EXTRA_MAPS[view]);
    if (mapArea) mapArea.classList.toggle('extra-mode', isExtra);
    if (cameraBtn) cameraBtn.style.display = isExtra ? 'none' : '';
    var frameEl = document.querySelector('.game-frame');
    if (frameEl) frameEl.classList.remove('tw-immersive');

    if (isExtra) {
      closeSidePanel();
      stage.classList.remove('is-pixel-view');
      if (mapExtraFrame) {
        mapExtraFrame.classList.add('visible');
        const nextSrc = EXTRA_MAPS[view];
        const abs = new URL(nextSrc, window.location.href).href;
        const switchEngine = ENGINE_VIEWS[view] && ENGINE_VIEWS[prevView]
          && mapExtraFrame.contentWindow
          && /\/maps\/view10\/map\.html/.test(mapExtraFrame.src);
        if (switchEngine) {
          mapExtraFrame.contentWindow.postMessage({ type: 'set-engine', engine: ENGINE_VIEWS[view] }, '*');
        } else if (mapExtraFrame.src !== abs) {
          mapExtraFrame.src = nextSrc;
        }
        extraCamera = null;
        setTimeout(function () {
          try {
            if (mapExtraFrame.contentWindow) {
              mapExtraFrame.contentWindow.postMessage({ type: 'camera-state-request' }, '*');
            }
          } catch (_) {}
        }, 400);
      }
      setPlaceholder('', false);
      if (window.CampaignUI) CampaignUI.syncToIframe(mapExtraFrame);
      updateMinimap();
      return;
    }

    if (mapExtraFrame) {
      mapExtraFrame.classList.remove('visible');
      mapExtraFrame.src = 'about:blank';
    }
    extraCamera = null;

    if (isPixelView(view)) {
      if (pixelCache[view] && pixelCache[view].mapImage) {
        applyPixelPack(view);
        setPlaceholder('', false);
        fitCanvasToViewport();
        render();
        return;
      }
      setPlaceholder('Загрузка подложки…', true);
      ensurePixelView(view).then(function (ok) {
        if (state.view !== view) return;
        if (!ok) {
          setPlaceholder('Не удалось загрузить подложку вида ' + view, true);
          return;
        }
        setPlaceholder('', false);
        fitCanvasToViewport();
        render();
      });
      return;
    }

    PIXEL_REF = pixelRefFor(2);
    setPlaceholder('', false);
    fitCanvasToViewport();
    render();
    requestAnimationFrame(function () {
      if (state.view !== view) return;
      fitCanvasToViewport();
      render();
    });
  }

  function panCanvasPointToCenter(mapX, mapY) {
    const cam = cameraMode();
    const s = state.scale || 1;
    let cx = mapX - state.canvasW / 2;
    let cy = mapY - state.canvasH / 2;
    let ux = cam.a * cx + cam.c * cy;
    let uy = cam.b * cx + cam.d * cy;
    const rz = (effectiveRotateZ() * Math.PI) / 180;
    const cz = Math.cos(rz);
    const sz = Math.sin(rz);
    let px = ux * cz - uy * sz;
    let py = ux * sz + uy * cz;
    const rx = Math.max(0, Math.min(75, (cam.rotateX || 0) + (state.tiltExtra || 0))) * Math.PI / 180;
    const cosX = Math.cos(rx);
    if (Math.abs(cosX) > 0.08) py *= cosX;
    state.tx = -px * s;
    state.ty = -py * s;
    applyTransform();
  }

  function panToLonLat(lon, lat) {
    if (EXTRA_MAPS[state.view]) {
      if (mapExtraFrame && mapExtraFrame.contentWindow) {
        try {
          mapExtraFrame.contentWindow.postMessage({ type: 'camera-goto', lon: lon, lat: lat }, '*');
        } catch (_) {}
      }
      return;
    }
    const p = lonLatToCanvas(lon, lat);
    panCanvasPointToCenter(p[0], p[1]);
  }

  function canvasPointFromClient(clientX, clientY) {
    const rect = viewport.getBoundingClientRect();
    const vx = clientX - rect.left - rect.width / 2;
    const vy = clientY - rect.top - rect.height / 2;
    const cam = cameraMode();
    const s = state.scale || 1;
    let px = (vx - state.tx) / s;
    let py = (vy - state.ty) / s;
    const rx = (cam.rotateX || 0) * Math.PI / 180;
    const cosX = Math.cos(rx);
    if (Math.abs(cosX) > 0.08) py = py / cosX;
    const rz = -(effectiveRotateZ() * Math.PI / 180);
    const cz = Math.cos(rz);
    const sz = Math.sin(rz);
    const ux = px * cz - py * sz;
    const uy = px * sz + py * cz;
    const det = cam.a * cam.d - cam.b * cam.c || 1;
    const cx = (cam.d * ux - cam.c * uy) / det;
    const cy = (-cam.b * ux + cam.a * uy) / det;
    return [cx + state.canvasW / 2, cy + state.canvasH / 2];
  }

  viewport.addEventListener('wheel', (e) => {
    if (EXTRA_MAPS[state.view]) {
      e.preventDefault();
      if (mapExtraFrame && mapExtraFrame.contentWindow) {
        mapExtraFrame.contentWindow.postMessage({
          type: 'camera-zoom',
          deltaY: e.deltaY
        }, '*');
      }
      return;
    }
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const next = Math.min(state.maxScale || 8, Math.max(state.minScale || 0.5, state.scale * factor));
    if (Math.abs(next - state.scale) < 1e-6) return;
    const rect = viewport.getBoundingClientRect();
    const k = next / state.scale;
    const cx = e.clientX - rect.left - rect.width / 2;
    const cy = e.clientY - rect.top - rect.height / 2;
    state.tx = cx - (cx - state.tx) * k;
    state.ty = cy - (cy - state.ty) * k;
    state.scale = next;
    applyTransform();
  }, { passive: false });

  viewport.addEventListener('mousedown', (e) => {
    if (EXTRA_MAPS[state.view]) return;
    if (e.button !== 0) return;
    state.dragging = true;
    state.moved = false;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    viewport.classList.add('is-dragging');
  });

  window.addEventListener('mousemove', (e) => {
    if (!state.dragging) return;
    const dx = e.clientX - state.lastX;
    const dy = e.clientY - state.lastY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) state.moved = true;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    state.tx += dx;
    state.ty += dy;
    applyTransform();
  });

  window.addEventListener('mouseup', (e) => {
    if (e.target && e.target.id === 'minimapCanvas') {
      state.dragging = false;
      viewport.classList.remove('is-dragging');
      return;
    }
    if (!state.dragging) return;
    const wasDrag = state.moved;
    state.dragging = false;
    viewport.classList.remove('is-dragging');
    if (wasDrag) return;
    if (EXTRA_MAPS[state.view]) return;

    const [cx, cy] = canvasPointFromClient(e.clientX, e.clientY);
    if (cx < 0 || cy < 0 || cx > state.canvasW || cy > state.canvasH) return;

    if (isPixelView(state.view) && state.mapImage) {
      updateView2Cover();
      const city = findCityAt(cx, cy);
      if (city) {
        openCityConstruction(city);
        return;
      }
      if (pixelRegions.length) {
        const hit = findPixelRegionAt(cx, cy);
        if (!hit) return;
        selectedCityName = '';
        selectPixelRegion(hit.index);
        return;
      }
    }

    const [lon, lat] = unproject(cx, cy);
    const hit = findFeatureAtLonLat(lon, lat);
    if (!hit) return;
    selectFeature(hit.index);
  });

  document.querySelectorAll('.map-variant-btn[data-view]').forEach((btn) => {
    btn.addEventListener('click', () => setView(btn.dataset.view));
  });
  if (cameraBtn) cameraBtn.addEventListener('click', cycleCameraMode);

  const minimapEl = document.getElementById('minimapCanvas');
  if (minimapEl) {
    minimapEl.addEventListener('mousedown', function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
    minimapEl.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (!window.MapEngine || !MapEngine.minimapToLonLat) return;
      const rect = minimapEl.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (minimapEl.width / Math.max(1, rect.width));
      const py = (e.clientY - rect.top) * (minimapEl.height / Math.max(1, rect.height));
      const ll = MapEngine.minimapToLonLat(px, py, {
        width: minimapEl.width,
        height: minimapEl.height,
        bbox: state.bbox
      });
      panToLonLat(ll.lon, ll.lat);
    });
  }

  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'camera-state') {
      extraCamera = e.data;
      updateMinimap();
      return;
    }
    if (e.data.type === 'army-select') {
      if (window.CampaignUI && CampaignUI.openFieldArmy) {
        CampaignUI.openFieldArmy(e.data.armyId || (CampaignState.state.fieldArmies[0] && CampaignState.state.fieldArmies[0].id));
      }
      if (typeof window.switchTab === 'function') window.switchTab('army');
      return;
    }
    if (e.data.type === 'battle-open-local') {
      if (window.BattleSystem && BattleSystem.openLocalBattleOverlay) {
        BattleSystem.openLocalBattleOverlay();
      } else {
        var ov = document.getElementById('battleLocalOverlay');
        if (!ov) {
          ov = document.createElement('iframe');
          ov.id = 'battleLocalOverlay';
          ov.title = 'Локальный бой';
          document.body.appendChild(ov);
        }
        ov.style.cssText =
          'display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;' +
          'border:0;z-index:5000;background:#0a1208;margin:0;padding:0';
        ov.classList.add('show', 'is-open');
        ov.src = '/pages/battleLocal.html?v=20260831soldiers';
      }
      return;
    }
    if (e.data.type === 'battle-local-done') {
      if (window.BattleSystem && BattleSystem.closeLocalBattleOverlay) {
        BattleSystem.closeLocalBattleOverlay();
      } else {
        var ov2 = document.getElementById('battleLocalOverlay');
        if (ov2) {
          ov2.classList.remove('show', 'is-open');
          ov2.style.display = 'none';
          ov2.src = 'about:blank';
        }
      }
      if (mapExtraFrame && mapExtraFrame.contentWindow) {
        try { mapExtraFrame.contentWindow.postMessage(e.data, '*'); } catch (_) {}
      }
      // потери в CampaignState; отступление — на карте (если есть pair), иначе здесь
      if (window.BattleSystem && BattleSystem.finishLocalBattle) BattleSystem.finishLocalBattle(e.data);
      return;
    }
    if (e.data.type === 'army-deselect') {
      if (window.CampaignUI && CampaignUI.clearCityPanels) {
        if (!CampaignState.state.selectedCity) CampaignUI.clearCityPanels();
      }
      return;
    }
    if (e.data.type === 'army-merged' && e.data.city) {
      if (window.CampaignUI && window.CampaignState) {
        var city = CampaignState.getCity(e.data.city);
        if (city) {
          CampaignUI.openCity(city, {
            tab: 'army',
            switchTab: window.switchTab
          });
        }
      }
      return;
    }
    if (e.data.type === 'city-select' && e.data.city) {
      if (window.CampaignUI && CampaignUI.clearGarrisonSelection) {
        CampaignUI.clearGarrisonSelection();
      }
      var city = e.data.city;
      var known = window.CampaignState && CampaignState.getCity(city.name);
      if (!known && window.CampaignState) {
        known = CampaignState.CITIES.find(function (c) {
          return c.ru === city.ru || Math.abs((c.lon || 0) - (city.lon || 0)) < 0.15;
        });
      }
      var target = known || {
        name: city.name,
        ru: city.ru || city.name,
        region: city.region,
        lon: city.lon,
        lat: city.lat,
        faction: city.faction || 'rome',
        capital: !!city.capital,
        x: 2100,
        y: 1680
      };
      var wantTab = e.data.tab === 'army' ? 'army' : 'settlement';
      if (window.CampaignUI) {
        CampaignUI.openCity(target, {
          tab: wantTab,
          switchTab: function (tab) {
            window.switchTab(wantTab === 'army' ? 'army' : (tab || 'settlement'));
          },
          openPanel: openSidePanel
        });
      } else if (typeof window.switchTab === 'function') {
        window.switchTab(wantTab);
      }
      if (typeof window.switchTab === 'function') {
        window.switchTab(wantTab);
      }
      selectedCityName = target.name;
      if (sidePanelNote) {
        sidePanelNote.textContent = wantTab === 'army'
          ? 'Армия города · вкладка «Поселение» или 🏗️ — строительство.'
          : 'Строительство · вкладка «Отряды» или ⚔️ — армия.';
      }
      // страницы строительство / армия (buildArmy.html)
      if (typeof window.openBuildArmy === 'function') {
        window.openBuildArmy(wantTab === 'army' ? 'recruit' : 'build');
      }
      return;
    }
    if (e.data.type === 'city-deselect') {
      if (window.CampaignUI && CampaignUI.deselectCity) {
        CampaignUI.deselectCity();
      } else if (window.CampaignState) {
        if (CampaignState.clearSelectedCity) CampaignState.clearSelectedCity();
        else CampaignState.state.selectedCity = null;
        if (window.CampaignUI && CampaignUI.clearCityPanels) CampaignUI.clearCityPanels();
      }
      return;
    }
  });

  window.addEventListener('keydown', (e) => {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'KeyQ' || e.code === 'KeyE') {
      e.preventDefault();
      const delta = e.code === 'KeyQ' ? -3 : 3;
      if (EXTRA_MAPS[state.view] && mapExtraFrame && mapExtraFrame.contentWindow) {
        mapExtraFrame.contentWindow.postMessage({ type: 'camera-tilt', delta: delta }, '*');
        return;
      }
      const cam = cameraMode();
      const next = Math.max(0, Math.min(75, (cam.rotateX || 0) + (state.tiltExtra || 0) + delta));
      state.tiltExtra = next - (cam.rotateX || 0);
      applyTransform();
      return;
    }
    if (e.code === 'KeyZ' || e.code === 'KeyC') {
      e.preventDefault();
      const delta = e.code === 'KeyZ' ? -6 : 6;
      if (EXTRA_MAPS[state.view] && mapExtraFrame && mapExtraFrame.contentWindow) {
        mapExtraFrame.contentWindow.postMessage({ type: 'camera-rotate', delta: delta }, '*');
        return;
      }
      state.yawExtra = wrapYaw((state.yawExtra || 0) + delta);
      applyTransform();
    }
  });

  const localBattleToolbarBtn = document.getElementById('localBattleToolbarBtn');
  if (localBattleToolbarBtn) {
    localBattleToolbarBtn.addEventListener('click', () => {
      try {
        const win = mapExtraFrame && mapExtraFrame.contentWindow;
        if (win && win.BattleMapHook && typeof win.BattleMapHook.showBattleDialog === 'function') {
          win.BattleMapHook.showBattleDialog();
          return;
        }
        if (win && win.BattleSystem && typeof win.BattleSystem.showBattleDialog === 'function') {
          win.BattleSystem.showBattleDialog();
          return;
        }
      } catch (_) {}
      if (window.BattleSystem && BattleSystem.openContact) {
        BattleSystem.openContact({});
      } else if (window.BattleSystem && BattleSystem.openLocalBattleOverlay) {
        BattleSystem.openLocalBattleOverlay();
      }
    });
  }
  document.getElementById('sidePanelClose').addEventListener('click', () => {
    state.selectedIndex = -1;
    pixelSelectedIndex = -1;
    closeSidePanel();
    render();
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (EXTRA_MAPS[state.view]) return;
      fitCanvasToViewport();
      render();
    }, 150);
  });

  window.switchTab = function (tab) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', (tab === 'army' && i === 0) || (tab === 'settlement' && i === 1));
    });
    const sg = document.getElementById('settlementGrid');
    const ag = document.getElementById('armyGrid');
    const ag2 = document.getElementById('armyGrid2');
    if (sg && ag && ag2) {
      const isSet = tab === 'settlement';
      sg.style.display = isSet ? 'grid' : 'none';
      ag.style.display = isSet ? 'none' : 'flex';
      ag2.style.display = isSet ? 'none' : 'flex';
      if (window.CampaignUI && window.CampaignState) {
        if (isSet) {
          CampaignUI.renderSettlementPanel(CampaignState.state.selectedCity);
        } else if (CampaignState.state.selectedFieldArmyId && CampaignUI.renderFieldArmyPanel) {
          CampaignUI.renderFieldArmyPanel(CampaignState.state.selectedFieldArmyId);
        } else {
          CampaignUI.renderArmyPanel(CampaignState.state.selectedCity);
        }
      }
    }
  };

  async function boot() {
    let saved = Number(localStorage.getItem('campaignMapVariant') || 1);
    if (saved === 7) saved = 3;
    if (saved === 14) saved = 10;
    if (saved === 11) saved = 10;
    if (!VALID_VIEWS.includes(saved)) saved = 4;
    state.cameraMode = 0;
    updateCameraBtn();

    setPlaceholder(EXTRA_MAPS[saved] ? '' : 'Загрузка регионов Италии…', !EXTRA_MAPS[saved]);

    if (typeof turf === 'undefined') {
      console.warn('Turf.js не загрузился — Вид 1 (GeoJSON) будет ограничен');
    }

    let geo = null;
    try {
      geo = await fetchFirstJson(GEOJSON_URLS);
    } catch (err) {
      console.error(err);
    }
    try {
      minimapGeo = await fetchFirstJson(MINIMAP_GEO_URLS);
    } catch (_) {
      minimapGeo = geo;
    }
    if (!minimapGeo) minimapGeo = geo;
    if (geo) geo = simplifyCollection(geo, 96);
    if (minimapGeo) minimapGeo = simplifyCollection(minimapGeo, 72);

    loadTerrainTiles();
    if (window.ItalyDEM) {
      ItalyDEM.load().then(function (ok) {
        if (!ok) return;
        view1Paint = null;
        view1PaintKey = '';
        if (state.view === 1) render();
      });
    }

    if (geo && geo.features && geo.features.length) {
      state.geojson = geo;
      state.features = geo.features.slice();
        try {
          state.bbox = saneBbox(turf.bbox(geo));
        } catch (_) {
          state.bbox = [6.5, 36.4, 18.6, 47.2];
        }
    } else {
      state.geojson = null;
      state.features = [];
    }

    window.__mapDebug = {
      getState: () => ({
        view: state.view,
        canvas: [state.canvasW, state.canvasH],
        affine: view1Affine,
        pixelRegions: pixelRegions.length,
        rome: project(12.5, 41.9),
        features: state.features.length
      }),
      project: project,
      setView: setView
    };

    if (window.CampaignUI) {
      CampaignUI.init({
        onEndTurn: function () {
          render();
          if (EXTRA_MAPS[state.view]) CampaignUI.syncToIframe(mapExtraFrame);
          var ys = document.getElementById('hudYearSide');
          var ts = document.getElementById('hudTreasurySide');
          if (ys) ys.textContent = document.getElementById('hudYear').textContent;
          if (ts) ts.textContent = document.getElementById('hudTreasury').textContent;
        },
        onFrame: function () {
          if (EXTRA_MAPS[state.view]) return;
          if (state.view === 1 || isPixelView(state.view)) render();
        }
      });
    }

    setPlaceholder('', false);
    setView(saved);
  }

  boot();
})();
    </script>

    <div id="modalBackdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:1000;"></div>
    <iframe id="modalContent" title="Панель" style="display:none; position:fixed; z-index:1001; border:none; background:#0a0502;" frameborder="0"></iframe>
    <iframe id="secondaryContent" title="Доп. панель" style="display:none; position:fixed; z-index:1002; border:none; background:#0a0502;" frameborder="0"></iframe>

    <script>
    (function () {
      'use strict';
      var PANEL_EDGE = 4;
      var PANEL_WIDTH = '40%';
      var FRAME_INSET = 24;
      var SIDE_PANEL_HEIGHT_SCALE = 1.2;
      var modalMode = 'right';

      function getSidePanelHeight() {
        var bottomPanel = document.querySelector('.bottom-panel');
        var bottomHeight = bottomPanel ? bottomPanel.getBoundingClientRect().height : 120;
        var baseHeight = window.innerHeight - bottomHeight - PANEL_EDGE;
        return Math.ceil(baseHeight * SIDE_PANEL_HEIGHT_SCALE) + 'px';
      }

      function applyPanelBorder(el, side) {
        el.style.border = 'none';
        el.style.borderTop = '2px solid #c9a84c';
        el.style.borderBottom = '2px solid #c9a84c';
        if (side === 'right') {
          el.style.borderLeft = '2px solid #c9a84c';
          el.style.borderRight = 'none';
        } else {
          el.style.borderRight = '2px solid #c9a84c';
          el.style.borderLeft = 'none';
        }
      }

      function layoutSidePanel(el, side) {
        el.style.position = 'fixed';
        el.style.top = PANEL_EDGE + 'px';
        el.style.width = PANEL_WIDTH;
        el.style.height = getSidePanelHeight();
        el.style.transform = 'none';
        el.style.pointerEvents = 'auto';
        el.style.background = '#0a0502';
        el.style.borderRadius = '0';
        if (side === 'right') {
          el.style.left = 'auto';
          el.style.right = PANEL_EDGE + 'px';
          el.style.boxShadow = '-10px 0 30px rgba(0,0,0,0.8)';
        } else {
          el.style.left = PANEL_EDGE + 'px';
          el.style.right = 'auto';
          el.style.boxShadow = '10px 0 30px rgba(0,0,0,0.8)';
        }
        applyPanelBorder(el, side);
      }

      function layoutTechPanel(el) {
        var margin = 0.05;
        el.style.position = 'fixed';
        el.style.top = Math.round(window.innerHeight * margin) + 'px';
        el.style.left = Math.round(window.innerWidth * margin) + 'px';
        el.style.right = 'auto';
        el.style.bottom = 'auto';
        el.style.width = Math.round(window.innerWidth * (1 - margin * 2)) + 'px';
        el.style.height = Math.round(window.innerHeight * (1 - margin * 2)) + 'px';
        el.style.transform = 'none';
        el.style.pointerEvents = 'auto';
        el.style.background = '#0a0502';
        el.style.border = '2px solid #c9a84c';
        el.style.borderRadius = '6px';
        el.style.boxShadow = '0 0 40px rgba(0,0,0,0.85)';
      }

      function layoutFramedPanel(el) {
        el.style.position = 'fixed';
        el.style.top = FRAME_INSET + 'px';
        el.style.left = FRAME_INSET + 'px';
        el.style.right = FRAME_INSET + 'px';
        el.style.bottom = FRAME_INSET + 'px';
        el.style.width = 'auto';
        el.style.height = 'auto';
        el.style.transform = 'none';
        el.style.pointerEvents = 'auto';
        el.style.background = '#0a0502';
        el.style.border = '2px solid #c9a84c';
        el.style.borderRadius = '6px';
        el.style.boxShadow = '0 0 40px rgba(0,0,0,0.85)';
      }

      function layoutCenterDetailPanel(el) {
        el.style.position = 'fixed';
        el.style.left = '50%';
        el.style.top = '50%';
        el.style.width = 'min(960px, 94vw)';
        el.style.height = 'min(90vh, 880px)';
        el.style.transform = 'translate(-50%, -50%)';
        el.style.pointerEvents = 'auto';
        el.style.background = '#0a0502';
        el.style.border = '2px solid #c9a84c';
        el.style.borderRadius = '6px';
        el.style.boxShadow = '0 0 40px rgba(0,0,0,0.85)';
      }

      function closeSecondaryModal() {
        var sec = document.getElementById('secondaryContent');
        if (sec) {
          sec.style.display = 'none';
          sec.src = 'about:blank';
        }
      }

      window.openSecondaryModal = function (url, opts) {
        opts = opts || {};
        var sec = document.getElementById('secondaryContent');
        if (!sec) return;
        var side = opts.position === 'right' ? 'right' : 'left';
        if (opts.position === 'center') {
          layoutCenterDetailPanel(sec);
        } else {
          layoutSidePanel(sec, side);
        }
        sec.style.display = 'block';
        sec.src = url;
      };

      window.closeSecondaryModal = closeSecondaryModal;

      window.openEntityDetailPage = function (entityId) {
        if (!entityId) return;
        window.openSecondaryModal(
          'pageOfDetailAboutUnitAndBuild.html?entity=' + encodeURIComponent(entityId),
          { position: 'left' }
        );
      };

      window.openBottomArmyDetail = function (entityId) {
        if (window.CampaignUI && CampaignUI.openFieldArmy && window.CampaignState) {
          var id = CampaignState.state.selectedFieldArmyId
            || (CampaignState.state.fieldArmies[0] && CampaignState.state.fieldArmies[0].id);
          if (id) CampaignUI.openFieldArmy(id);
        }
      };

      window.closeBottomArmyDetail = function () {
        if (window.CampaignUI && window.CampaignState) {
          var city = CampaignState.state.selectedCity;
          if (city) {
            CampaignUI.renderSettlementPanel(city);
            CampaignUI.renderArmyPanel(city);
          } else if (CampaignUI.clearCityPanels) {
            CampaignUI.clearCityPanels();
          }
        }
      };

      function getCampaignFaction() {
        var params = new URLSearchParams(window.location.search);
        return (params.get('faction') || 'rome').toLowerCase();
      }

      function setIconActive(which) {
        var army = document.getElementById('iconArmy');
        var build = document.getElementById('iconBuild');
        var tech = document.getElementById('iconTech');
        if (army) army.classList.toggle('active', which === 'army');
        if (build) build.classList.toggle('active', which === 'build');
        if (tech) tech.classList.toggle('active', which === 'tech');
      }

      window.closeModal = function () {
        closeSecondaryModal();
        var modal = document.getElementById('modalContent');
        var backdrop = document.getElementById('modalBackdrop');
        if (modal) {
          modal.style.display = 'none';
          modal.src = 'about:blank';
          modalMode = 'right';
        }
        if (backdrop) backdrop.style.display = 'none';
      };

      window.openModal = function (url, mode) {
        mode = mode || 'right';
        var modal = document.getElementById('modalContent');
        var backdrop = document.getElementById('modalBackdrop');
        if (!modal || !backdrop) return;
        modalMode = mode;
        if (mode === 'tech') {
          closeSecondaryModal();
          layoutTechPanel(modal);
        } else if (mode === 'framed') {
          closeSecondaryModal();
          layoutFramedPanel(modal);
        } else {
          layoutSidePanel(modal, 'right');
        }
        modal.style.display = 'block';
        backdrop.style.display = 'block';
        modal.src = url;
      };

      window.openBuildArmy = function (tab) {
        setIconActive(tab === 'build' ? 'build' : 'army');
        var city = (window.CampaignState && CampaignState.state.selectedCity) || '';
        window.openModal(
          'buildArmy.html?tab=' + encodeURIComponent(tab || 'recruit') +
          '&faction=' + encodeURIComponent(getCampaignFaction()) +
          '&city=' + encodeURIComponent(city),
          'right'
        );
      };

      window.openTech = function () {
        closeSecondaryModal();
        setIconActive('tech');
        window.openModal('tech.html', 'tech');
      };

      window.openFactionWindow = function () {
        closeSecondaryModal();
        setIconActive(null);
        window.openModal(
          'pageOfCountry.html?faction=' + encodeURIComponent(getCampaignFaction()),
          'tech'
        );
      };

      window.endTurn = function () {
        if (window.CampaignState) CampaignState.endTurn();
        if (window.CampaignUI) CampaignUI.updateHud();
      };

      var backdrop = document.getElementById('modalBackdrop');
      if (backdrop) {
        backdrop.style.pointerEvents = 'auto';
        backdrop.addEventListener('click', function () { window.closeModal(); });
      }

      window.addEventListener('message', function (event) {
        if (!event.data) return;
        if (event.data.type === 'close-modal' || event.data.type === 'closeFaction' || event.data.type === 'close') {
          window.closeModal();
        }
      });

      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          window.closeBottomArmyDetail && window.closeBottomArmyDetail();
          window.closeModal();
        }
      });

      window.addEventListener('resize', function () {
        var modal = document.getElementById('modalContent');
        var sec = document.getElementById('secondaryContent');
        if (modal && modal.style.display === 'block') {
          if (modalMode === 'tech') layoutTechPanel(modal);
          else if (modalMode === 'framed') layoutFramedPanel(modal);
          else layoutSidePanel(modal, 'right');
        }
        if (sec && sec.style.display === 'block') {
          if ((sec.style.transform || '').indexOf('translate') >= 0) layoutCenterDetailPanel(sec);
          else layoutSidePanel(sec, 'left');
        }
      });

      (function loadFactionIcon() {
        var faction = getCampaignFaction();
        var img = document.getElementById('factionIconImg');
        if (!img) return;
        var icons = { rome: '../images/icon_rome.png', carthage: '../images/icon_carthage.png' };
        if (window.GameContent) {
          var data = GameContent.getFaction(faction);
          if (data && data.icon) {
            img.src = data.icon;
            img.alt = data.name || faction;
            return;
          }
        }
        img.src = icons[faction] || icons.rome;
        img.alt = faction;
      })();
    })();
    </script>
