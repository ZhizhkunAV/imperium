<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор карты</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1014; color: #efe4d0;
      font-family: 'EB Garamond', Georgia, serif; }
    #wrap { display: flex; height: 100%; }
    #tools {
      width: 260px; flex-shrink: 0; padding: 14px 12px; box-sizing: border-box;
      background: rgba(10, 8, 5, 0.96); border-right: 1px solid rgba(201, 168, 76, 0.35);
      overflow-y: auto;
    }
    h1 { font-family: Cinzel, serif; font-size: 15px; letter-spacing: .08em; margin: 0 0 12px; }
    .tool {
      display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 8px 10px;
      font-family: Cinzel, serif; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
      color: #f5e6c8; background: rgba(28, 22, 14, 0.9); border: 1px solid rgba(201, 168, 76, 0.4);
      cursor: pointer;
    }
    .tool.active { background: rgba(201, 168, 76, 0.28); border-color: #e0c878; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; color: #c9b48a; }
    select, input[type=range] {
      width: 100%; box-sizing: border-box;
      background: rgba(28, 22, 14, 0.95); color: #f5e6c8;
      border: 1px solid rgba(201, 168, 76, 0.45); padding: 8px;
      font-family: 'EB Garamond', Georgia, serif; font-size: 14px;
    }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    .row button, .row a {
      flex: 1; text-align: center; padding: 8px 6px; text-decoration: none;
      font-family: Cinzel, serif; font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
      color: #f5e6c8; background: rgba(28, 22, 14, 0.9); border: 1px solid rgba(201, 168, 76, 0.4);
      cursor: pointer;
    }
    #hint { margin-top: 14px; font-size: 13px; line-height: 1.4; color: #b8a888; }
    #stage { flex: 1; position: relative; background: #163c4c; touch-action: none; }
    #view { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <aside id="tools">
      <h1>Редактор карты</h1>
      <label for="viewSelect">Карта / вид</label>
      <select id="viewSelect">
        <option value="4">Вид 4 (Three.js)</option>
        <option value="5">Вид 5 (Three.js)</option>
        <option value="10">Вид 10 (Three.js)</option>
        <option value="12" selected>Вид 12 (Phaser)</option>
        <option value="16">Вид 16 (Godot 4)</option>
      </select>
      <label>Кисть покрытия</label>
      <button type="button" class="tool active" data-cover="1">Вода</button>
      <button type="button" class="tool" data-cover="2">Пляж</button>
      <button type="button" class="tool" data-cover="3">Равнина</button>
      <button type="button" class="tool" data-cover="4">Лес</button>
      <button type="button" class="tool" data-cover="5">Холмы</button>
      <button type="button" class="tool" data-cover="6">Горы</button>
      <button type="button" class="tool" data-cover="7">Снег</button>
      <button type="button" class="tool" data-cover="8">Дорога</button>
      <button type="button" class="tool" data-cover="0">Ластик</button>
      <label>Размер кисти: <b id="brushVal">22</b></label>
      <input id="brush" type="range" min="4" max="64" value="22">
      <div class="row">
        <button type="button" id="saveBtn">Сохранить</button>
        <button type="button" id="clearBtn">Сброс</button>
      </div>
      <div class="row">
        <a id="openViewLink" href="frameForMap.html">Открыть кампанию</a>
      </div>
      <p id="hint">Выберите вид сверху, затем рисуйте ЛКМ по карте. Сохранение действует только для выбранного вида.</p>
    </aside>
    <div id="stage"><canvas id="view"></canvas></div>
  </div>
  <script src="/js/map-paint.js?v=20260831editor2"></script>
  <script src="/js/italy-dem.js?v=20260831paint"></script>
  <script>
(function () {
  var view = document.getElementById('view');
  var stage = document.getElementById('stage');
  var g = view.getContext('2d');
  var cover = 1;
  var radius = 22;
  var drawing = false;
  var base = null;
  var viewSelect = document.getElementById('viewSelect');
  var hint = document.getElementById('hint');

  document.querySelectorAll('.tool').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tool').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      cover = Number(btn.getAttribute('data-cover'));
      hint.textContent = 'Кисть: ' + btn.textContent + ' · вид ' + MapPaint.getView();
    });
  });
  document.getElementById('brush').addEventListener('input', function () {
    radius = Number(this.value);
    document.getElementById('brushVal').textContent = String(radius);
  });

  function canvasPos(e) {
    var rect = view.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (view.width / Math.max(1, rect.width)),
      y: (e.clientY - rect.top) * (view.height / Math.max(1, rect.height))
    };
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    view.width = Math.max(2, Math.floor(r.width));
    view.height = Math.max(2, Math.floor(r.height));
    redraw();
  }

  function overlayToPaint(mx, my) {
    var P = window.MapPaint;
    var sx = mx / view.width * P.W;
    var sy = my / view.height * P.H;
    var br = Math.max(1.5, radius * (P.W / Math.max(1, view.width)));
    P.paintBrush(sx, sy, br, cover, 1);
  }

  function redraw() {
    g.fillStyle = '#163c4c';
    g.fillRect(0, 0, view.width, view.height);
    if (base) g.drawImage(base, 0, 0, view.width, view.height);
    if (window.MapPaint && MapPaint.ready()) {
      g.globalAlpha = 0.82;
      g.drawImage(MapPaint.previewCanvas(), 0, 0, view.width, view.height);
      g.globalAlpha = 1;
    }
  }

  function rebuildBase() {
    if (!(window.ItalyDEM && ItalyDEM.ready())) return;
    MapPaint.setEnabled(false);
    base = ItalyDEM.paintGeo(1024, 1024, ItalyDEM.bbox, { style: 'rtw', sea: '#4a8fa0' });
    MapPaint.setEnabled(true);
    redraw();
  }

  view.addEventListener('pointerdown', function (e) {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    drawing = true;
    try { view.setPointerCapture(e.pointerId); } catch (_) {}
    var p = canvasPos(e);
    overlayToPaint(p.x, p.y);
    MapPaint.flush();
    redraw();
  });
  view.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    e.preventDefault();
    var p = canvasPos(e);
    overlayToPaint(p.x, p.y);
    MapPaint.flush();
    redraw();
  });
  function endDraw() {
    if (!drawing) return;
    drawing = false;
    MapPaint.save(MapPaint.getView());
  }
  view.addEventListener('pointerup', endDraw);
  view.addEventListener('pointercancel', endDraw);
  window.addEventListener('pointerup', endDraw);

  document.getElementById('saveBtn').addEventListener('click', function () {
    MapPaint.save(MapPaint.getView());
    hint.textContent = 'Сохранено для вида ' + MapPaint.getView() + '. Откройте этот вид в кампании.';
  });
  document.getElementById('clearBtn').addEventListener('click', function () {
    if (!confirm('Стереть правки для вида ' + MapPaint.getView() + '?')) return;
    MapPaint.clearAll(MapPaint.getView());
    redraw();
  });

  viewSelect.addEventListener('change', function () {
    var id = Number(viewSelect.value);
    MapPaint.save(MapPaint.getView());
    MapPaint.setView(id).then(function () {
      document.getElementById('openViewLink').href = 'frameForMap.html#view=' + id;
      try { localStorage.setItem('campaignMapVariant', String(id)); } catch (_) {}
      hint.textContent = 'Редактируете: ' + (MapPaint.VIEW_LABELS[id] || ('вид ' + id));
      rebuildBase();
    });
  });

  window.addEventListener('resize', resize);

  MapPaint.ensure();
  var startView = Number(viewSelect.value) || 12;
  try {
    var savedActive = Number(localStorage.getItem('campaignMapPaintActiveView'));
    if (savedActive) {
      startView = savedActive;
      viewSelect.value = String(startView);
    }
  } catch (_) {}

  MapPaint.setView(startView).then(function () {
    return ItalyDEM.load('/maps/rome/italy-height.png');
  }).then(function () {
    rebuildBase();
    resize();
    hint.textContent = 'Редактируете: ' + (MapPaint.VIEW_LABELS[MapPaint.getView()] || MapPaint.getView()) + ' · ЛКМ — рисовать';
  });
})();
  </script>
</body>
</html>
