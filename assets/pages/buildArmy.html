<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель армии</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --bronze: #6b5a3a;
            --text: #d4c5a9;
            --bg-panel: rgba(5, 3, 1, 0.95);
            --border-panel: rgba(180, 140, 60, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'EB Garamond', 'Georgia', serif;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            pointer-events: none;
        }

        .army-panel {
            width: 100%;
            max-width: none;
            height: 100%;
            background: var(--bg-panel);
            border: 2px solid var(--gold);
            border-right: none;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            margin: 0;
        }

        .army-panel-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-panel);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }

        .army-panel-title {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem; font-weight: 900;
            color: var(--gold-light);
            letter-spacing: 2px; text-transform: uppercase;
        }

        .army-panel-close {
            width: 30px; height: 30px;
            cursor: pointer;
            background: rgba(139,26,26,0.2);
            border: 1px solid rgba(200,80,80,0.4);
            color: #c08080; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
            font-family: 'Cinzel', serif;
        }
        .army-panel-close:hover { background: rgba(139,26,26,0.4); color: #ffaaaa; }

        .army-panel-content {
            flex: 1; padding: 10px 14px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
        }

        .army-section-title {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem; color: var(--gold);
            letter-spacing: 1.5px; text-transform: uppercase;
            border-bottom: 1px solid rgba(201,168,76,0.2);
            padding-bottom: 3px; margin-bottom: 0;
        }

        .army-general-section {
            display: flex; gap: 14px; align-items: center;
            min-height: 164px;
            padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(201,168,76,0.2);
        }

        .army-general-portrait {
            width: 128px; height: 152px;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(201,168,76,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; flex-shrink: 0;
            overflow: hidden;
        }

        .army-general-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .army-commander-block {
            flex-shrink: 0;
            margin-bottom: 4px;
        }

        .army-general-info { display: flex; flex-direction: column; gap: 6px; }

        .army-general-name {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem; font-weight: 700;
            color: var(--gold-light); letter-spacing: 1px;
        }

        .army-general-stats { font-size: 0.68rem; color: #8b7355; display: flex; gap: 12px; flex-wrap: wrap; }
        .army-general-stat { display: flex; align-items: center; gap: 2px; }

        /* Вкладки */
        .army-tabs { display: flex; gap: 3px; flex-shrink: 0; }

        .army-tab {
            font-family: 'Cinzel', serif;
            font-size: 0.55rem; letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; background: transparent;
            border: 1px solid rgba(201,168,76,0.25); color: #8b7355;
            transition: all 0.2s; padding: 6px 12px;
        }
        .army-tab:hover { color: var(--gold-light); border-color: rgba(201,168,76,0.5); }
        .army-tab.active {
            color: #fff; border-color: var(--gold);
            background: rgba(201,168,76,0.15);
            box-shadow: 0 0 8px rgba(201,168,76,0.2);
        }

        /* Сетка */
        .army-unit-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px; flex-shrink: 0;
        }

        .army-unit-card {
            aspect-ratio: 3/4;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(201,168,76,0.2);
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.55rem; position: relative;
        }
        .army-unit-card:hover { border-color: var(--gold); background: rgba(201,168,76,0.08); }

        /* Здание в очереди — скрыто из доступных */
        .army-unit-card.used {
            display: none;
            pointer-events: none;
        }

        /* Здание в сетке очереди */
        .army-unit-card.queue-filled {
            border-color: rgba(201,168,76,0.5);
            background: rgba(201,168,76,0.1);
        }
        .army-unit-card.queue-filled:hover {
            border-color: #c05050;
            background: rgba(200,80,80,0.15);
        }

        .army-unit-card .card-label {
            position: absolute; bottom: 2px;
            font-family: 'Cinzel', serif; font-size: 0.45rem;
            color: rgba(201,168,76,0.6); text-align: center;
            letter-spacing: 0.5px; text-transform: uppercase;
        }

        .hidden { display: none !important; }

        /* Полоса */
        .recruit-queue {
            flex-shrink: 0;
            border: 1px solid rgba(201,168,76,0.3);
            background: rgba(0,0,0,0.3);
            min-height: 24px; display: flex; align-items: center;
            padding: 2px 10px;
        }

        .recruit-queue-label {
            font-family: 'Cinzel', serif;
            font-size: 0.55rem; color: var(--gold);
            letter-spacing: 1px; margin-right: 10px; white-space: nowrap;
        }
    </style>
</head>
<body data-i18n-page-title="page.army">

<div class="army-panel">

    <div class="army-panel-header">
        <div class="army-panel-title" data-i18n="army.title">⚔️ Армия</div>
        <button class="army-panel-close" onclick="closePanel()">✕</button>
    </div>

    <div class="army-panel-content">

        <!-- Командующий -->
        <div class="army-commander-block">
            <div class="army-section-title" data-i18n="army.commander">👤 Командующий</div>
            <div class="army-general-section">
                <div class="army-general-portrait" id="commanderPortrait">🏛️</div>
                <div class="army-general-info">
                    <div class="army-general-name" id="commanderName" data-i18n="army.commanderName">Сципион Африканский</div>
                    <div class="army-general-stats">
                        <span class="army-general-stat">🛡️ 10</span>
                        <span class="army-general-stat">⚔️ 8</span>
                        <span class="army-general-stat">🏛️ 7</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Вкладки -->
        <div class="army-tabs">
            <button class="army-tab active" data-tab="recruit" onclick="switchTab('recruit')" data-i18n="army.tab.recruit">📋 Найм</button>
            <button class="army-tab" data-tab="build" onclick="switchTab('build')" data-i18n="army.tab.build">🏗️ Строительство</button>
            <button class="army-tab" data-tab="repair" onclick="switchTab('repair')" data-i18n="army.tab.repair">🔧 Ремонт</button>
            <button class="army-tab" data-tab="retrain" onclick="switchTab('retrain')" data-i18n="army.tab.retrain">🔄 Переобучение</button>
        </div>

        <!-- ====== НАЙМ ====== -->
        <div id="tab-recruit">
            <div class="army-section-title"><span data-i18n="army.roster">⚔️ Найм</span> · <span id="recruitCityLabel">город не выбран</span></div>
            <div class="army-unit-grid" id="recruitGrid"></div>
            <div class="recruit-queue"><span class="recruit-queue-label" data-i18n="army.queue.recruit">📋 Очередь найма:</span></div>
            <div class="army-unit-grid" id="queueGridRecruit">
                <div class="army-unit-card"></div><div class="army-unit-card"></div><div class="army-unit-card"></div>
                <div class="army-unit-card"></div><div class="army-unit-card"></div><div class="army-unit-card"></div>
                <div class="army-unit-card"></div><div class="army-unit-card"></div>
            </div>
        </div>

        <!-- ====== СТРОИТЕЛЬСТВО ====== -->
        <div id="tab-build" class="hidden">
            <div class="army-section-title" data-i18n="army.buildings">🏗️ Доступные постройки</div>
            <div id="buildCityHint" style="font-size:0.6rem;color:#8b7355;text-align:center;padding:8px 4px;"></div>
            <div class="army-unit-grid" id="buildGrid1"></div>
            <div class="army-unit-grid" id="buildGrid2"></div>

            <div class="recruit-queue"><span class="recruit-queue-label" data-i18n="army.queue.build">🏗️ Очередь строительства:</span></div>
            <div class="army-unit-grid" id="queueGridBuild">
                <div class="army-unit-card"></div><div class="army-unit-card"></div><div class="army-unit-card"></div>
                <div class="army-unit-card"></div><div class="army-unit-card"></div><div class="army-unit-card"></div>
                <div class="army-unit-card"></div><div class="army-unit-card"></div>
            </div>
        </div>

        <!-- ====== РЕМОНТ ====== -->
        <div id="tab-repair" class="hidden">
            <div class="army-section-title">🔧 Ремонт</div>
            <div style="font-size:0.6rem;color:#8b7355;text-align:center;padding:20px;" data-i18n="army.repair.empty">Ремонт доступен при наличии повреждённых зданий.</div>
        </div>

        <!-- ====== ПЕРЕОБУЧЕНИЕ ====== -->
        <div id="tab-retrain" class="hidden">
            <div class="army-section-title">🔄 Переобучение</div>
            <div style="font-size:0.6rem;color:#8b7355;text-align:center;padding:20px;" data-i18n="army.retrain.empty">Переобучение доступно при наличии отрядов с опытом.</div>
        </div>

    </div>
</div>

<script src="../js/i18n.js"></script>
<script src="../js/i18n-content.js"></script>
<script>
    var params = new URLSearchParams(window.location.search);
    var selectedCity = params.get('city') || '';
    var BUILD_IMGS = {
      barracks: '../images/building/casarmy.png',
      temple: '../images/building/temple.png',
      farm: null,
      walls: null,
      forum: null,
      aqueduct: null,
      roads: null
    };
    var UNIT_IMGS = {
      hastati: '../images/leg.png',
      principes: '../images/leg.png',
      velites: '../images/velit.png',
      equites: null
    };

    function getCS() {
      try { return window.parent && window.parent.CampaignState; } catch (_) { return null; }
    }
    function getCUI() {
      try { return window.parent && window.parent.CampaignUI; } catch (_) { return null; }
    }
    function refreshParentPanels() {
      var CS = getCS();
      var CUI = getCUI();
      if (!CS || !CUI || !selectedCity) return;
      if (CUI.renderSettlementPanel) CUI.renderSettlementPanel(selectedCity);
      if (CUI.renderArmyPanel) CUI.renderArmyPanel(selectedCity);
      if (CUI.updateHud) CUI.updateHud();
    }

    function loadCommander() {
        const faction = (params.get('faction') || 'rome').toLowerCase();
        if (!window.GameContent) return;
        const data = GameContent.getFaction(faction);
        if (!data) return;

        const portraitEl = document.getElementById('commanderPortrait');
        if (portraitEl && data.portrait) {
            portraitEl.innerHTML = `<img src="${data.portrait}" alt="">`;
        }

        const nameEl = document.getElementById('commanderName');
        if (nameEl && data.commander) {
            nameEl.removeAttribute('data-i18n');
            nameEl.textContent = data.commander;
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.army-tab').forEach(b => b.classList.remove('active'));
        var btn = document.querySelector(`[data-tab="${tab}"]`);
        if (btn) btn.classList.add('active');
        ['recruit', 'build', 'repair', 'retrain'].forEach(t => {
            var el = document.getElementById('tab-' + t);
            if (el) el.classList.add('hidden');
        });
        var show = document.getElementById('tab-' + tab);
        if (show) show.classList.remove('hidden');
    }

    function renderRecruitGrid() {
      var grid = document.getElementById('recruitGrid');
      var label = document.getElementById('recruitCityLabel');
      if (!grid) return;
      grid.innerHTML = '';
      var CS = getCS();
      var city = selectedCity && CS ? CS.getCity(selectedCity) : null;
      if (label) label.textContent = city ? (city.ru || city.name) : 'город не выбран';
      if (!selectedCity || !CS) {
        grid.innerHTML = '<div style="grid-column:1/-1;font-size:0.65rem;color:#8b7355;text-align:center;padding:18px;">Сначала выберите город на карте</div>';
        return;
      }
      var slots = CS.getRecruitSlots ? CS.getRecruitSlots(selectedCity) : [];
      if (!slots.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;font-size:0.65rem;color:#8b7355;text-align:center;padding:18px;">Нет доступных отрядов для найма</div>';
        return;
      }
      slots.forEach(function (slot) {
        var card = document.createElement('div');
        card.className = 'army-unit-card';
        card.title = slot.name + ' · ⓓ ' + slot.cost;
        var img = UNIT_IMGS[slot.id];
        if (img) {
          card.innerHTML = '<img src="' + img + '" alt="' + slot.name + '" style="width:100%;height:100%;object-fit:contain;"><span class="card-label">' + slot.name + '</span>';
        } else {
          card.innerHTML = '<span>' + slot.icon + '</span><span class="card-label">' + slot.name + '</span>';
        }
        card.onclick = function () {
          if (CS.recruitUnit(selectedCity, slot.id)) {
            refreshParentPanels();
            renderRecruitGrid();
            renderBuildQueueFromState();
          }
        };
        card.oncontextmenu = function (e) { openDetail(e, slot.id); };
        grid.appendChild(card);
      });
    }

    function renderBuildGrids() {
      var g1 = document.getElementById('buildGrid1');
      var g2 = document.getElementById('buildGrid2');
      var hint = document.getElementById('buildCityHint');
      if (!g1 || !g2) return;
      g1.innerHTML = '';
      g2.innerHTML = '';
      var CS = getCS();
      var city = selectedCity && CS ? CS.getCity(selectedCity) : null;
      if (hint) {
        hint.textContent = city
          ? ('Город: ' + (city.ru || city.name) + ' · уже построенное смотрите во вкладке «Поселение» внизу')
          : 'Сначала выберите город на карте';
      }
      if (!selectedCity || !CS || !CS.getBuildableSlots) return;
      var slots = CS.getBuildableSlots(selectedCity);
      slots.forEach(function (slot, i) {
        var card = document.createElement('div');
        card.className = 'army-unit-card';
        card.dataset.id = slot.id;
        card.title = slot.name + ' · ⓓ ' + slot.cost + ' · ' + slot.turns + ' ход.';
        var img = BUILD_IMGS[slot.id];
        if (img) {
          card.innerHTML = '<img src="' + img + '" alt="' + slot.name + '" style="width:100%;height:100%;object-fit:contain;"><span class="card-label">' + slot.name + '</span>';
          card.dataset.img = img;
          card.dataset.alt = slot.name;
        } else {
          card.innerHTML = '<span>' + slot.icon + '</span><span class="card-label">' + slot.name + '</span>';
        }
        card.onclick = function () { queueBuilding(slot); };
        card.oncontextmenu = function (e) { openDetail(e, slot.id); };
        (i < 8 ? g1 : g2).appendChild(card);
      });
      renderBuildQueueFromState();
    }

    function queueBuilding(slot) {
      var CS = getCS();
      if (!CS || !selectedCity) return;
      if (CS.queueBuilding(selectedCity, slot.id)) {
        refreshParentPanels();
        renderBuildGrids();
      }
    }

    function renderBuildQueueFromState() {
      var CS = getCS();
      var grid = document.getElementById('queueGridBuild');
      if (!grid) return;
      var cards = grid.querySelectorAll('.army-unit-card');
      var queue = [];
      if (CS && selectedCity) {
        var cs = CS.getCityState(selectedCity);
        queue = (cs && cs.queue) || [];
      }
      cards.forEach(function (card, i) {
        if (i < queue.length) {
          var q = queue[i];
          var b = CS && CS.BUILDINGS ? CS.BUILDINGS[q.id] : null;
          var img = BUILD_IMGS[q.id];
          if (img) {
            card.innerHTML = '<img src="' + img + '" alt="" style="width:90%;height:90%;object-fit:contain;">';
          } else {
            card.innerHTML = '<span>' + (b ? b.icon : '⏳') + '</span>';
          }
          card.title = (b ? b.name : q.id) + ' · осталось ' + q.turnsLeft;
          card.classList.add('queue-filled');
          card.onclick = null;
        } else {
          card.innerHTML = '';
          card.classList.remove('queue-filled');
          card.onclick = null;
          card.title = '';
        }
      });
    }

    function closePanel() {
        if (window.parent && window.parent.closeModal) {
            window.parent.closeModal();
        }
    }

    function openDetail(event, entity) {
        if (event) event.preventDefault();
        if (!entity) return;
        const url = `./pageOfDetailAboutUnitAndBuild.html?entity=${encodeURIComponent(entity)}`;
        if (window.parent && window.parent.openSecondaryModal) {
            window.parent.openSecondaryModal(url, { position: 'left' });
        }
    }

    window.addEventListener('load', function() {
        if (window.GameI18n) GameI18n.apply();
        loadCommander();
        if (!selectedCity) {
          try {
            var CS = getCS();
            if (CS && CS.state && CS.state.selectedCity) selectedCity = CS.state.selectedCity;
          } catch (_) {}
        }
        const tab = params.get('tab') || 'recruit';
        switchTab(tab);
        renderRecruitGrid();
        renderBuildGrids();
    });
</script>

</body>
</html>
