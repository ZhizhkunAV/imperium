<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Имперская кампания</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --bronze: #6b5a3a;
            --text: #d4c5a9;
            --bg-panel: rgba(5, 3, 1, 0.85);
            --border-panel: rgba(180, 140, 60, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            font-family: 'EB Garamond', 'Georgia', serif;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Фоновое изображение */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.4) saturate(0.8);
        }

        /* Затемнение */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
        }

        /* Контейнер формы */
        .login-container {
            position: relative;
            z-index: 5;
            width: 420px;
            max-width: 90vw;
            background: var(--bg-panel);
            border: 2px solid var(--border-panel);
            padding: 40px 35px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 100px rgba(139,105,20,0.1);
        }

        /* Декоративные уголки */
        .login-container::before,
        .login-container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--gold);
            border-style: solid;
        }

        .login-container::before {
            top: -2px;
            left: -2px;
            border-width: 2px 0 0 2px;
        }

        .login-container::after {
            bottom: -2px;
            right: -2px;
            border-width: 0 2px 2px 0;
        }

        /* Орёл */
        .login-eagle {
            text-align: center;
            font-size: 3rem;
            color: var(--gold);
            opacity: 0.6;
            margin-bottom: 5px;
        }

        /* Заголовок */
        .login-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-light);
            text-shadow: 0 0 15px rgba(201,168,76,0.3);
            margin-bottom: 5px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 0.7rem;
            color: #8b7355;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        /* Разделитель */
        .login-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
        }

        /* Поля ввода */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .input-field {
            font-family: 'EB Garamond', 'Georgia', serif;
            font-size: 0.9rem;
            padding: 10px 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(201,168,76,0.35);
            color: #f0e6d3;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .input-field::placeholder {
            color: rgba(201,168,76,0.25);
            font-style: italic;
        }

        .input-field:focus {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(201,168,76,0.2);
            background: rgba(0,0,0,0.7);
        }

        /* Кнопка Войти */
        .btn-login {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 12px;
            cursor: pointer;
            transition: all 0.35s;
            background: rgba(201,168,76,0.1);
            border: 2px solid var(--gold);
            color: var(--gold-light);
            text-align: center;
            margin-top: 5px;
        }

        .btn-login:hover {
            background: rgba(201,168,76,0.2);
            box-shadow: 0 0 25px rgba(201,168,76,0.4);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Забыл пароль */
        .forgot-link {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            letter-spacing: 1.5px;
            color: rgba(201,168,76,0.4);
            text-decoration: none;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .forgot-link:hover {
            color: var(--gold-light);
            text-shadow: 0 0 8px rgba(201,168,76,0.3);
        }

        /* Окно ошибки */
        .error-popup {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 26, 26, 0.9);
            border: 1px solid #cc4444;
            padding: 10px 20px;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            letter-spacing: 1px;
            color: #ffaaaa;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            white-space: nowrap;
        }

        .error-popup.visible {
            opacity: 1;
            top: -50px;
        }
    </style>
</head>
<body data-i18n-page-title="page.login">

    <!-- Фон -->
    <img class="bg-image" src="../images/startScreen/mapWorld.png" alt="Background">
    <div class="bg-overlay"></div>

    <!-- Форма входа -->
    <div class="login-container" id="loginContainer">

        <!-- Окно ошибки -->
        <div class="error-popup" id="errorPopup" data-i18n="login.error">Неверное имя или пароль</div>

        <!-- Орёл -->
        <div class="login-eagle">🦅</div>

        <!-- Заголовок -->
        <div class="login-title">IMPERIVM</div>
        <div class="login-subtitle" data-i18n="login.subtitle">Вход в кампанию</div>

        <div class="login-divider"></div>

        <!-- Логин -->
        <div class="input-group">
            <label class="input-label" for="login" data-i18n="login.commander">Имя полководца</label>
            <input class="input-field" type="text" id="login" data-i18n-placeholder="login.commanderPlaceholder" placeholder="Введите имя..." value="12345" autocomplete="off">
        </div>

        <!-- Пароль -->
        <div class="input-group">
            <label class="input-label" for="password" data-i18n="login.password">Пароль</label>
            <input class="input-field" type="password" id="password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="Введите пароль..." value="qwerty">
        </div>

        <!-- Кнопка -->
        <button class="btn-login" onclick="handleLogin()" data-i18n="login.submit">⚔️ Войти</button>

        <!-- Забыл пароль -->
        <a href="#" class="forgot-link" onclick="handleForgot()" data-i18n="login.forgot">Забыл пароль?</a>
    </div>

    <script src="../js/i18n.js"></script>
    <script>
        // Правильные логин и пароль
        const VALID_LOGIN = '12345';
        const VALID_PASSWORD = 'qwerty';

        let errorTimeout = null;

        function showError() {
            const popup = document.getElementById('errorPopup');
            popup.classList.add('visible');

            if (errorTimeout) clearTimeout(errorTimeout);
            errorTimeout = setTimeout(() => {
                popup.classList.remove('visible');
            }, 2000);
        }

        function handleLogin() {
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;

            if (login === VALID_LOGIN && password === VALID_PASSWORD) {
                const btn = document.querySelector('.btn-login');
                btn.textContent = GameI18n.t('login.success');
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.7';

                setTimeout(() => {
                    window.location.href = 'windowDownload.html';
                }, 600);
            } else {
                showError();
            }
        }

        function handleForgot() {
            const popup = document.getElementById('errorPopup');
            popup.textContent = GameI18n.t('login.forgotHint');
            popup.style.background = 'rgba(139, 105, 20, 0.9)';
            popup.style.borderColor = '#c9a84c';
            popup.style.color = '#ffd700';
            showError();

            setTimeout(() => {
                popup.textContent = GameI18n.t('login.error');
                popup.style.background = 'rgba(139, 26, 26, 0.9)';
                popup.style.borderColor = '#cc4444';
                popup.style.color = '#ffaaaa';
            }, 2500);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        window.addEventListener('load', () => {
            if (window.GameI18n) GameI18n.apply();
        });
    </script>

</body>
</html>
