<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вид 14 — Rome Remastered 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a4e60; }
    #c { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #c.dragging { cursor: grabbing; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 20; min-width: 188px;
      padding: 8px 12px; background: rgba(8, 6, 3, 0.7);
      border: 1px solid rgba(201, 168, 76, 0.4); color: #efe4d0;
      font-family: 'EB Garamond', Georgia, serif; font-size: 13px; pointer-events: none;
    }
    #hud strong { font-family: 'Cinzel', serif; color: #f5e6c8; letter-spacing: 0.06em; }
    #hud .row { display: flex; justify-content: space-between; gap: 14px; font-size: 11px; margin-top: 3px; }
    #hud span { color: #b7a078; text-transform: uppercase; letter-spacing: 0.08em; }
    #hud b { font-family: 'Cinzel', serif; color: #f5e6c8; }
    #status { margin-top: 6px; color: #b7c7d4; font-size: 12px; }
    #hint { margin-top: 4px; color: #8a7a58; font-size: 11px; }
    #battleModal {
      display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 80; width: min(92vw, 420px); padding: 22px 24px 18px;
      background: rgba(14, 10, 6, 0.94); border: 1px solid rgba(201, 168, 76, 0.55);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55); text-align: center;
      font-family: 'EB Garamond', Georgia, serif;
    }
    #battleModal.show { display: block; }
    #battleModal p { margin: 0 0 16px; font-size: 18px; line-height: 1.4; color: #f5ead0; }
    #battleModal button {
      font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #f5e6c8; background: rgba(30, 22, 12, 0.95); border: 1px solid rgba(201, 168, 76, 0.55);
      padding: 8px 16px; cursor: pointer;
    }
    #battleModal button:hover { border-color: #e0c878; color: #fff; }
  </style>
  <script src="/maps/rome/three.min.js"></script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hud">
  <strong>Вид 14 · Rome Remastered 3D</strong>
  <div id="status">Сборка 3D-карты…</div>
  <div id="hint">ЛКМ — выбрать армию/город · ПКМ — ход армии · Ctrl+отряды в городе + ПКМ по карте — вывести армию · Q/E — наклон</div>
  <div class="row"><span>Зум</span><b id="hudZoom">500%</b></div>
  <div class="row"><span>Наклон</span><b id="hudTilt">80%</b></div>
  <div class="row"><span>Поворот</span><b id="hudYaw">0°</b></div>
</div>
<div id="battleModal" role="dialog" aria-modal="true">
  <p>Начинается бой, ваши войска Рима атаковали армию Карфагена</p>
  <button type="button" id="battleModalClose">Закрыть</button>
</div>
<script src="/js/italy-dem.js"></script>
<script src="/js/walk-unit-three.js"></script>
<script src="/maps/view14/provinces.js"></script>
<script src="/js/campaign-map-bridge.js"></script>
<script>
(function () {
  'use strict';
  var PROVS = window.View14Provinces || [];
  var FACS = window.View14Factions || {};
  var ROADS = window.View14Roads || [];
  var canvas = document.getElementById('c');
  var statusEl = document.getElementById('status');
  var BOX = [6.4, 36.2, 18.9, 47.4];
  var CX = 12.48, CY = 41.89, SCALE = 33;
  var TILT_MIN = 0, TILT_MAX = 75, TILT_STEP = 3, YAW_STEP = 6;
  var MIN_ZOOM = 0.18, MAX_ZOOM = 3.4, BASE_DIST = 48;
  var camTilt = 60, camZoom = 1, camYaw = 0;
  var target = { x: 0, y: 2.2, z: 0 };
  var dragging = false, lastX = 0, lastY = 0, allowPan = true;
  var three = { renderer: null, scene: null, camera: null, raf: 0, walker: null, land: null, units: null, sea: null, seaUniforms: null };

  function setStatus(t) { statusEl.textContent = t; }
  var battleModal = document.getElementById('battleModal');
  var battleClose = document.getElementById('battleModalClose');
  function showBattleDialog() {
    if (battleModal) battleModal.classList.add('show');
    setStatus('Бой начался');
  }
  function hideBattleDialog() {
    if (battleModal) battleModal.classList.remove('show');
  }
  if (battleClose) battleClose.addEventListener('click', hideBattleDialog);
  function wrapYaw(d) { d %= 360; return d < 0 ? d + 360 : d; }
  function updateHud() {
    document.getElementById('hudZoom').textContent = Math.round(camZoom * 200) + '%';
    document.getElementById('hudTilt').textContent = Math.round((camTilt / TILT_MAX) * 100) + '%';
    document.getElementById('hudYaw').textContent = Math.round(wrapYaw(camYaw)) + '°';
  }
  function xz(lon, lat) { return { x: (lon - CX) * SCALE, z: (CY - lat) * SCALE }; }

  /**
   * Альпийские перевалы как в RTW: коридоры на север от Медиолана и Патавия,
   * плюс сжатие сплошной стены Альп в отдельные пики.
   */
  function alpinePassCarve(lon, lat, m) {
    if (!(m > 180) || lat < 44.85) return m;
    // коридор N от Mediolanum — широкий проход
    if (lat >= 45.4 && lat <= 47.15 && Math.abs(lon - 9.05) < 0.62) {
      var t1 = 1 - Math.min(1, absPass(lon, 9.05, 0.52));
      t1 *= Math.min(1, (lat - 45.4) / 0.18);
      t1 *= Math.min(1, (47.15 - lat) / 0.4);
      t1 = t1 * t1;
      m = Math.min(m, 140 + (1 - t1) * 380);
    }
    // коридор N от Patavium
    if (lat >= 45.35 && lat <= 47.2 && Math.abs(lon - 11.75) < 0.65) {
      var t2 = 1 - Math.min(1, absPass(lon, 11.75, 0.55));
      t2 *= Math.min(1, (lat - 45.35) / 0.18);
      t2 *= Math.min(1, (47.2 - lat) / 0.45);
      t2 = t2 * t2;
      m = Math.min(m, 130 + (1 - t2) * 360);
    }
    // плато → отдельные пики, но пики выше
    if (lat > 45.15 && m > 650) {
      var peak =
        Math.sin(lon * 3.1) * Math.cos(lat * 2.7) * 0.5 +
        Math.sin(lon * 7.3 + lat * 4.1) * 0.5;
      var keep = Math.max(0, Math.min(1, peak * 0.85 + 0.15));
      var base = 380 + (m - 650) * 0.28;
      var spike = 480 + (m - 650) * (0.75 + keep * 1.05);
      m = base * (1 - keep) + spike * keep;
    }
    return m;
  }
  function absPass(lon, center, half) {
    return Math.abs(lon - center) / half;
  }

  function worldH(lon, lat) {
    var m = window.ItalyDEM && ItalyDEM.ready() ? ItalyDEM.meters(lon, lat) : 120;
    if (!(m > 8)) return 0.04;
    m = alpinePassCarve(lon, lat, m);
    return 0.28 + m / 2950 * 26;
  }
  function distProv(lon, lat, p) {
    var dlon = (lon - p.lon) * 0.72, dlat = lat - p.lat;
    return dlon * dlon + dlat * dlat;
  }
  function twoNearest(lon, lat) {
    var a = -1, b = -1, da = 1e9, db = 1e9, i, d;
    for (i = 0; i < PROVS.length; i++) {
      d = distProv(lon, lat, PROVS[i]);
      if (d < da) { db = da; b = a; da = d; a = i; }
      else if (d < db) { db = d; b = i; }
    }
    return { a: a, b: b, da: Math.sqrt(da), db: Math.sqrt(db) };
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerp3(c0, c1, t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return [lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t)];
  }
  function terrainRGB(m) {
    if (!(m > 4)) return [24, 72, 92];
    if (m < 40) return lerp3([150, 142, 104], [124, 122, 78], m / 40);
    if (m < 160) return lerp3([124, 122, 78], [98, 112, 68], (m - 40) / 120);
    if (m < 380) return lerp3([98, 112, 68], [86, 104, 62], (m - 160) / 220);
    if (m < 750) return lerp3([86, 104, 62], [94, 100, 66], (m - 380) / 370);
    if (m < 1200) return lerp3([94, 100, 66], [118, 112, 90], (m - 750) / 450);
    if (m < 1750) return lerp3([118, 112, 90], [138, 132, 116], (m - 1200) / 550);
    if (m < 2300) return lerp3([138, 132, 116], [188, 190, 184], (m - 1750) / 550);
    return lerp3([188, 190, 184], [228, 230, 226], Math.min(1, (m - 2300) / 800));
  }
  function paintTexture(tw, th) {
    var c = document.createElement('canvas');
    c.width = tw; c.height = th;
    var g = c.getContext('2d');
    var img = g.createImageData(tw, th);
    var px = img.data;
    var x, y, lon, lat, m, i4, nn, fac, col, tcol, wash, shade, mx, my, nx, ny, nlen, edge, k;
    var dlon = (BOX[2] - BOX[0]) / tw, dlat = (BOX[3] - BOX[1]) / th;
    var hasDem = window.ItalyDEM && ItalyDEM.ready();
    var elev = hasDem ? new Float32Array(tw * th) : null;
    for (y = 0; y < th; y++) {
      lat = BOX[3] - y / Math.max(1, th - 1) * (BOX[3] - BOX[1]);
      for (x = 0; x < tw; x++) {
        lon = BOX[0] + x / Math.max(1, tw - 1) * (BOX[2] - BOX[0]);
        i4 = (y * tw + x) * 4;
        m = hasDem ? ItalyDEM.meters(lon, lat) : 120;
        if (m > 8) m = alpinePassCarve(lon, lat, m);
        if (elev) elev[y * tw + x] = m || 0;
        if (!(m > 6)) {
          col = lerp3([48, 98, 112], [16, 46, 62], Math.max(0, Math.min(1, (8 - m) / 50)));
          px[i4] = col[0]; px[i4 + 1] = col[1]; px[i4 + 2] = col[2]; px[i4 + 3] = 255;
          continue;
        }
        tcol = terrainRGB(m);
        shade = 1;
        if (hasDem) {
          mx = ItalyDEM.meters(lon + dlon, lat) || m;
          my = ItalyDEM.meters(lon, lat - dlat) || m;
          nx = m - mx; ny = m - my;
          nlen = Math.sqrt(nx * nx + ny * ny + 140 * 140) || 1;
          shade = Math.max(0.78, Math.min(1.22, (nx * 0.35 + 140) / nlen * 1.35));
        }
        col = [tcol[0] * shade, tcol[1] * shade, tcol[2] * shade];
        if (m < 1450) {
          nn = twoNearest(lon, lat);
          if (nn.a >= 0) {
            fac = FACS[PROVS[nn.a].faction] || FACS.rebels;
            wash = m < 700 ? 0.12 : 0.06;
            col[0] = col[0] * (1 - wash) + fac.fill[0] * wash;
            col[1] = col[1] * (1 - wash) + fac.fill[1] * wash;
            col[2] = col[2] * (1 - wash) + fac.fill[2] * wash;
            if (nn.b >= 0 && m < 1250) {
              edge = 1 - Math.min(1, Math.abs(nn.db - nn.da) / 0.085);
              if (edge > 0.35) {
                k = (edge - 0.35) / 0.65 * 0.14;
                col[0] = col[0] * (1 - k) + 36 * k;
                col[1] = col[1] * (1 - k) + 28 * k;
                col[2] = col[2] * (1 - k) + 20 * k;
              }
            }
          }
        }
        px[i4] = col[0] < 0 ? 0 : col[0] > 255 ? 255 : col[0];
        px[i4 + 1] = col[1] < 0 ? 0 : col[1] > 255 ? 255 : col[1];
        px[i4 + 2] = col[2] < 0 ? 0 : col[2] > 255 ? 255 : col[2];
        px[i4 + 3] = 255;
      }
    }
    if (elev) {
      var ix, iy, seaN, landN, tt;
      function el(x0, y0) {
        if (x0 < 0 || y0 < 0 || x0 >= tw || y0 >= th) return 0;
        return elev[y0 * tw + x0];
      }
      for (iy = 0; iy < th; iy++) {
        for (ix = 0; ix < tw; ix++) {
          m = elev[iy * tw + ix];
          seaN = (el(ix - 1, iy) <= 6 ? 1 : 0) + (el(ix + 1, iy) <= 6 ? 1 : 0)
            + (el(ix, iy - 1) <= 6 ? 1 : 0) + (el(ix, iy + 1) <= 6 ? 1 : 0);
          landN = 4 - seaN;
          i4 = (iy * tw + ix) * 4;
          if (m > 6 && seaN > 0) {
            tt = seaN >= 2 ? 0.7 : 0.4;
            px[i4] = px[i4] * (1 - tt) + 186 * tt;
            px[i4 + 1] = px[i4 + 1] * (1 - tt) + 168 * tt;
            px[i4 + 2] = px[i4 + 2] * (1 - tt) + 118 * tt;
            if (seaN >= 2) {
              px[i4] = px[i4] * 0.72 + 52 * 0.28;
              px[i4 + 1] = px[i4 + 1] * 0.72 + 48 * 0.28;
              px[i4 + 2] = px[i4 + 2] * 0.72 + 38 * 0.28;
            }
          } else if (!(m > 6) && landN > 0) {
            tt = landN >= 2 ? 0.5 : 0.26;
            px[i4] = px[i4] * (1 - tt) + 72 * tt;
            px[i4 + 1] = px[i4 + 1] * (1 - tt) + 128 * tt;
            px[i4 + 2] = px[i4 + 2] * (1 - tt) + 138 * tt;
          }
        }
      }
    }
    g.putImageData(img, 0, 0);
    return c;
  }
  function hexColor(hex, fallback) {
    if (!hex || typeof hex !== 'string') return fallback || 0x888888;
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return isNaN(n) ? (fallback || 0x888888) : n;
  }

  function factionBorderColor(factionId) {
    var fac = FACS[factionId] || FACS.rebels;
    return hexColor(fac.border || fac.banner, 0x888888);
  }

  /** Границы провинций как в RTW: плавные линии; на стыке разных фракций — две параллельные вплотную. */
  function addProvinceBorders(scene) {
    var seeds = [];
    PROVS.forEach(function (pr, i) {
      if (pr.hidden || !pr.city) return;
      seeds.push({ i: i, pr: pr, lon: pr.lon, lat: pr.lat });
    });
    if (seeds.length < 2) return;

    function nearestTwo(lon, lat) {
      var a = -1, b = -1, da = 1e9, db = 1e9, s, d, dlon, dlat;
      for (s = 0; s < seeds.length; s++) {
        dlon = (lon - seeds[s].lon) * 0.72;
        dlat = lat - seeds[s].lat;
        d = dlon * dlon + dlat * dlat;
        if (d < da) { db = da; b = a; da = d; a = s; }
        else if (d < db) { db = d; b = s; }
      }
      return { a: a, b: b, da: Math.sqrt(da), db: Math.sqrt(db) };
    }

    function isLand(lon, lat) {
      var m = window.ItalyDEM && ItalyDEM.ready() ? ItalyDEM.meters(lon, lat) : 80;
      return m > 14 && m < 1350;
    }

    function lonLatToWorld(lon0, lat0, lift) {
      var pp = xz(lon0, lat0);
      return new THREE.Vector3(pp.x, worldH(lon0, lat0) + (lift == null ? 0.18 : lift), pp.z);
    }

    /** Chaikin corner-cutting → плавная кривая. */
    function chaikin(pts, iterations) {
      var cur = pts, it, next, i, a, b;
      for (it = 0; it < iterations; it++) {
        if (cur.length < 2) break;
        next = [cur[0]];
        for (i = 0; i < cur.length - 1; i++) {
          a = cur[i]; b = cur[i + 1];
          next.push({
            lon: a.lon * 0.75 + b.lon * 0.25,
            lat: a.lat * 0.75 + b.lat * 0.25
          });
          next.push({
            lon: a.lon * 0.25 + b.lon * 0.75,
            lat: a.lat * 0.25 + b.lat * 0.75
          });
        }
        next.push(cur[cur.length - 1]);
        cur = next;
      }
      return cur;
    }

    /** Срединный перпендикуляр пары городов → упорядоченные точки границы (без зигзага сетки). */
    function sampleBisectorEdge(sa, sb) {
      var A = seeds[sa], B = seeds[sb];
      var midLon = (A.lon + B.lon) * 0.5;
      var midLat = (A.lat + B.lat) * 0.5;
      var dx = (B.lon - A.lon) * 0.72;
      var dy = B.lat - A.lat;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      // единичный перпендикуляр в lon/lat
      var px = (-dy / len) / 0.72;
      var py = dx / len;
      var maxT = Math.max(2.2, len * 2.8);
      var dt = 0.04;
      var raw = [];
      var t, lon, lat, nn, lo, hi;
      for (t = -maxT; t <= maxT; t += dt) {
        lon = midLon + px * t;
        lat = midLat + py * t;
        if (lon < BOX[0] - 0.2 || lon > BOX[2] + 0.2 || lat < BOX[1] - 0.2 || lat > BOX[3] + 0.2) continue;
        if (!isLand(lon, lat)) {
          if (raw.length && raw[raw.length - 1] !== null) raw.push(null);
          continue;
        }
        nn = nearestTwo(lon, lat);
        lo = Math.min(nn.a, nn.b);
        hi = Math.max(nn.a, nn.b);
        if (lo !== Math.min(sa, sb) || hi !== Math.max(sa, sb)) {
          if (raw.length && raw[raw.length - 1] !== null) raw.push(null);
          continue;
        }
        // чуть уже полоса вдоль биссектрисы
        if (Math.abs(nn.db - nn.da) > 0.12) {
          if (raw.length && raw[raw.length - 1] !== null) raw.push(null);
          continue;
        }
        raw.push({ lon: lon, lat: lat, t: t });
      }
      // разрезать на непрерывные сегменты
      var segs = [];
      var cur = [];
      raw.forEach(function (p) {
        if (!p) {
          if (cur.length >= 4) segs.push(cur);
          cur = [];
        } else cur.push(p);
      });
      if (cur.length >= 4) segs.push(cur);
      return segs;
    }

    /** Проредить точки по минимальному шагу, затем сгладить. */
    function refineSegment(seg) {
      if (seg.length < 3) return [];
      var thinned = [seg[0]];
      var i, prev = seg[0], dlon, dlat, d;
      for (i = 1; i < seg.length; i++) {
        dlon = (seg[i].lon - prev.lon) * 0.72;
        dlat = seg[i].lat - prev.lat;
        d = Math.sqrt(dlon * dlon + dlat * dlat);
        if (d >= 0.09 || i === seg.length - 1) {
          thinned.push(seg[i]);
          prev = seg[i];
        }
      }
      if (thinned.length < 3) return [];
      var smooth = chaikin(thinned, 4);
      // равномерная выборка вдоль сглаженной линии в мире
      var world = [];
      for (i = 0; i < smooth.length; i++) {
        if (!isLand(smooth[i].lon, smooth[i].lat)) continue;
        world.push({
          lon: smooth[i].lon,
          lat: smooth[i].lat,
          v: lonLatToWorld(smooth[i].lon, smooth[i].lat)
        });
      }
      if (world.length < 3) return [];
      return resampleAlong(world, 0.7);
    }

    function resampleAlong(worldChain, spacing) {
      var i, d, total = 0, seg = [], acc = [0];
      for (i = 1; i < worldChain.length; i++) {
        d = worldChain[i].v.distanceTo(worldChain[i - 1].v);
        total += d;
        acc.push(total);
        seg.push(d);
      }
      if (total < spacing * 2) return worldChain;
      var n = Math.max(4, Math.round(total / spacing));
      var out = [], t, s, a, b, u, lonI, latI;
      for (i = 0; i <= n; i++) {
        t = (i / n) * total;
        s = 0;
        while (s < seg.length - 1 && acc[s + 1] < t) s++;
        a = worldChain[s];
        b = worldChain[Math.min(s + 1, worldChain.length - 1)];
        u = seg[s] > 1e-6 ? (t - acc[s]) / seg[s] : 0;
        lonI = a.lon + (b.lon - a.lon) * u;
        latI = a.lat + (b.lat - a.lat) * u;
        if (!isLand(lonI, latI)) continue;
        out.push({ lon: lonI, lat: latI, v: lonLatToWorld(lonI, latI) });
      }
      return out.length >= 3 ? out : worldChain;
    }

    function parallelOffsets(worldChain, halfSep, sideALon, sideALat) {
      var left = [], right = [];
      var i, prev, next, tx, tz, len, px, pz, cx, cz, mid, cross, sign, ox, oz;
      // сгладить касательные скользящим окном, чтобы параллели не «ломались»
      var tangents = [];
      for (i = 0; i < worldChain.length; i++) {
        prev = worldChain[Math.max(0, i - 1)];
        next = worldChain[Math.min(worldChain.length - 1, i + 1)];
        tx = next.v.x - prev.v.x;
        tz = next.v.z - prev.v.z;
        len = Math.sqrt(tx * tx + tz * tz) || 1;
        tangents.push({ x: tx / len, z: tz / len });
      }
      for (i = 1; i < tangents.length - 1; i++) {
        tx = tangents[i - 1].x + tangents[i].x + tangents[i + 1].x;
        tz = tangents[i - 1].z + tangents[i].z + tangents[i + 1].z;
        len = Math.sqrt(tx * tx + tz * tz) || 1;
        tangents[i] = { x: tx / len, z: tz / len };
      }
      for (i = 0; i < worldChain.length; i++) {
        mid = worldChain[i];
        px = -tangents[i].z;
        pz = tangents[i].x;
        cx = (sideALon - CX) * SCALE - mid.v.x;
        cz = (CY - sideALat) * SCALE - mid.v.z;
        cross = cx * px + cz * pz;
        sign = cross >= 0 ? 1 : -1;
        ox = px * halfSep * sign;
        oz = pz * halfSep * sign;
        left.push(new THREE.Vector3(mid.v.x + ox, mid.v.y, mid.v.z + oz));
        right.push(new THREE.Vector3(mid.v.x - ox, mid.v.y, mid.v.z - oz));
      }
      return { a: left, b: right };
    }

    function addBorderTube(pts, color, radius) {
      if (!pts || pts.length < 3) return;
      var curve = new THREE.CatmullRomCurve3(pts);
      curve.tension = 0.35;
      var segs = Math.max(24, Math.min(160, pts.length * 4));
      var tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, segs, radius, 8, false),
        new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.94 })
      );
      tube.renderOrder = 2;
      scene.add(tube);
    }

    var RADIUS_SAME = 0.22;
    var RADIUS_DUAL = 0.19;
    var HALF_SEP = RADIUS_DUAL;

    // только пары, у которых реально есть общая граница
    var pairDone = {};
    var i, j, key, segs, si, refined, pa, pb, same, colA, colB, pair;
    for (i = 0; i < seeds.length; i++) {
      for (j = i + 1; j < seeds.length; j++) {
        key = i + '_' + j;
        if (pairDone[key]) continue;
        pairDone[key] = true;
        segs = sampleBisectorEdge(i, j);
        if (!segs.length) continue;
        pa = seeds[i].pr;
        pb = seeds[j].pr;
        same = pa.faction === pb.faction;
        colA = factionBorderColor(pa.faction);
        colB = factionBorderColor(pb.faction);
        for (si = 0; si < segs.length; si++) {
          refined = refineSegment(segs[si]);
          if (refined.length < 3) continue;
          if (same) {
            addBorderTube(refined.map(function (p) { return p.v.clone(); }), colA, RADIUS_SAME);
          } else {
            pair = parallelOffsets(refined, HALF_SEP, pa.lon, pa.lat);
            addBorderTube(pair.a, colA, RADIUS_DUAL);
            addBorderTube(pair.b, colB, RADIUS_DUAL);
          }
        }
      }
    }
  }

  function applyCam() {
    if (!three.camera) return;
    var dist = BASE_DIST / camZoom;
    var a = camTilt * Math.PI / 180;
    var yaw = camYaw * Math.PI / 180;
    three.camera.position.set(
      target.x + Math.sin(yaw) * dist * Math.cos(a),
      target.y + Math.max(5, dist * Math.sin(a)),
      target.z + Math.cos(yaw) * dist * Math.cos(a)
    );
    three.camera.lookAt(target.x, target.y, target.z);
    updateHud();
  }

  function flagSymbolCanvas(factionId, banner) {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 80;
    var g = c.getContext('2d');
    g.fillStyle = banner || '#6a3d8a';
    g.fillRect(0, 0, 64, 80);
    g.strokeStyle = 'rgba(245,230,200,0.55)';
    g.lineWidth = 2;
    g.strokeRect(1, 1, 62, 78);
    g.fillStyle = '#f5ead0';
    g.strokeStyle = '#f5ead0';
    g.lineWidth = 1.5;
    var roman = factionId === 'spqr' || factionId === 'julii' || factionId === 'brutii' || factionId === 'scipii';
    if (roman) {
      g.beginPath();
      g.moveTo(32, 14); g.lineTo(38, 26); g.lineTo(50, 28); g.lineTo(40, 36);
      g.lineTo(44, 48); g.lineTo(32, 40); g.lineTo(20, 48); g.lineTo(24, 36);
      g.lineTo(14, 28); g.lineTo(26, 26); g.closePath();
      g.fill();
      g.fillRect(30, 40, 4, 22);
      g.beginPath();
      g.moveTo(32, 18); g.quadraticCurveTo(22, 28, 24, 42);
      g.moveTo(32, 18); g.quadraticCurveTo(42, 28, 40, 42);
      g.stroke();
    } else if (factionId === 'greek') {
      g.beginPath(); g.arc(32, 36, 14, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(32, 36, 5, 0, Math.PI * 2); g.fill();
    } else if (factionId === 'carthage') {
      g.beginPath();
      g.arc(34, 36, 14, 0.35, Math.PI * 2 - 0.35);
      g.arc(40, 36, 10, Math.PI * 2 - 0.5, 0.5, true);
      g.fill();
    } else if (factionId === 'gaul') {
      g.beginPath();
      g.moveTo(32, 16); g.lineTo(44, 52); g.lineTo(20, 52); g.closePath();
      g.fill();
    } else {
      g.font = 'bold 28px Cinzel, serif';
      g.textAlign = 'center';

  /** Маска берега для лёгкой пены у кромки воды. */
  function makeCoastFoamTexture(res) {
    res = res || 256;
    var c = document.createElement('canvas');
    c.width = res;
    c.height = res;
    var g = c.getContext('2d');
    var img = g.createImageData(res, res);
    var px = img.data;
    var hasDem = window.ItalyDEM && ItalyDEM.ready();
    function metersAt(wx, wz) {
      if (!hasDem) return 0;
      var lon = wx / SCALE + CX;
      var lat = CY - wz / SCALE;
      var m = ItalyDEM.meters(lon, lat);
      return m == null ? 0 : m;
    }
    function nearLand(wx, wz, rad) {
      var a, m;
      for (a = 0; a < 8; a++) {
        m = metersAt(wx + Math.cos(a * 0.7854) * rad, wz + Math.sin(a * 0.7854) * rad);
        if (m > 10) return true;
      }
      return false;
    }
    var x, y, u, v, wx, wz, m, foam, i4;
    for (y = 0; y < res; y++) {
      for (x = 0; x < res; x++) {
        u = x / (res - 1);
        v = y / (res - 1);
        wx = (u - 0.5) * 900;
        wz = (0.5 - v) * 900;
        m = metersAt(wx, wz);
        foam = 0;
        if (!(m > 6)) {
          // узкая кромка — без широкого «наводнения»
          if (nearLand(wx, wz, 1.6)) foam = 0.55;
          else if (nearLand(wx, wz, 3.2)) foam = 0.22;
          else foam = 0.02;
        }
        i4 = (y * res + x) * 4;
        px[i4] = Math.round(foam * 255);
        px[i4 + 1] = px[i4];
        px[i4 + 2] = px[i4];
        px[i4 + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    var tex = new THREE.Texture(c);
    tex.needsUpdate = true;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    return tex;
  }

  function createAnimatedSea() {
    var shoreTex = makeCoastFoamTexture(256);
    var uniforms = {
      uTime: { value: 0 },
      uShore: { value: shoreTex },
      uDeep: { value: new THREE.Color(0x123e4c) },
      uMid: { value: new THREE.Color(0x1a5c6a) },
      uCrest: { value: new THREE.Color(0x3a7a86) },
      uShallow: { value: new THREE.Color(0x4a888c) },
      uFoam: { value: new THREE.Color(0xd0ddd8) }
    };
    var mat = new THREE.ShaderMaterial({
      uniforms: uniforms,
      transparent: true,
      depthWrite: false,
      lights: false,
      vertexShader: [
        'uniform float uTime;',
        'varying vec2 vUv;',
        'varying float vElev;',
        'varying vec3 vWorld;',
        'varying vec3 vNormalW;',
        // Направленные волны (не сетка sin*sin)
        'float dirWave(vec2 p, vec2 dir, float freq, float speed, float amp, float t) {',
        '  float d = dot(p, normalize(dir));',
        '  return sin(d * freq + t * speed) * amp;',
        '}',
        'float heightAt(vec2 p, float t) {',
        '  float h = 0.0;',
        '  h += dirWave(p, vec2(1.0, 0.18), 0.055, 0.42, 0.07, t);',
        '  h += dirWave(p, vec2(0.35, 1.0), 0.042, 0.32, 0.05, t);',
        '  h += dirWave(p, vec2(-0.7, 0.65), 0.07, 0.55, 0.035, t);',
        '  h += dirWave(p, vec2(0.9, -0.55), 0.11, 0.7, 0.02, t);',
        '  h += dirWave(p, vec2(-0.25, 0.95), 0.028, 0.22, 0.04, t);',
        '  return h;',
        '}',
        'void main() {',
        '  vUv = uv;',
        '  vec3 pos = position;',
        '  float t = uTime;',
        '  float h = heightAt(pos.xy, t);',
        '  float e = 0.6;',
        '  float hx = heightAt(pos.xy + vec2(e, 0.0), t) - heightAt(pos.xy - vec2(e, 0.0), t);',
        '  float hy = heightAt(pos.xy + vec2(0.0, e), t) - heightAt(pos.xy - vec2(0.0, e), t);',
        '  vec3 nLocal = normalize(vec3(-hx, -hy, 2.0 * e));',
        '  pos.z += h;',
        '  vElev = h;',
        '  vec4 wp = modelMatrix * vec4(pos, 1.0);',
        '  vWorld = wp.xyz;',
        '  vNormalW = normalize(mat3(modelMatrix) * nLocal);',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform float uTime;',
        'uniform sampler2D uShore;',
        'uniform vec3 uDeep;',
        'uniform vec3 uMid;',
        'uniform vec3 uCrest;',
        'uniform vec3 uShallow;',
        'uniform vec3 uFoam;',
        'varying vec2 vUv;',
        'varying float vElev;',
        'varying vec3 vWorld;',
        'varying vec3 vNormalW;',
        'void main() {',
        '  float shore = texture2D(uShore, vUv).r;',
        '  float crest = smoothstep(-0.02, 0.08, vElev);',
        '  float trough = smoothstep(0.02, -0.07, vElev);',
        '  vec3 col = mix(uDeep, uMid, 0.35 + crest * 0.3);',
        '  col = mix(col, uCrest, crest * 0.28);',
        '  col = mix(col, uDeep * 0.9, trough * 0.25);',
        '  col = mix(col, uShallow, shore * 0.18);',
        '  float shoreBand = sin(vWorld.x * 0.14 + vWorld.z * 0.09 - uTime * 0.45);',
        '  float foam = shore * shore * (0.12 + 0.2 * (shoreBand * 0.5 + 0.5));',
        '  foam *= smoothstep(0.35, 0.85, shore);',
        '  col = mix(col, uFoam, foam * 0.22);',
        '  vec3 L = normalize(vec3(0.35, 0.85, 0.25));',
        '  float ndl = max(dot(normalize(vNormalW), L), 0.0);',
        '  col += vec3(0.05, 0.07, 0.08) * pow(ndl, 14.0);',
        '  float alpha = 0.92 + shore * 0.02;',
        '  gl_FragColor = vec4(col, alpha);',
        '}'
      ].join('\n')
    });
    var geo = new THREE.PlaneGeometry(900, 900, 180, 180);
    var sea = new THREE.Mesh(geo, mat);
    sea.rotation.x = -Math.PI / 2;
    sea.position.y = -0.28;
    sea.renderOrder = -1;
    sea.name = 'animatedSea';
    return { mesh: sea, uniforms: uniforms };
  }

  function addCity(scene, prov) {
    if (prov.hidden || !prov.city) return null;
    var p = xz(prov.lon, prov.lat);
    var y = worldH(prov.lon, prov.lat);
    var s = (prov.capital ? 1.25 : 1) * 1.85;
    var fac = FACS[prov.faction] || FACS.rebels;
    var root = new THREE.Group();
    root.position.set(p.x, y, p.z);
    root.userData.isCity = true;
    root.userData.prov = prov;

    var stone = new THREE.MeshPhongMaterial({ color: 0xd8cbb0, shininess: 8 });
    var darkStone = new THREE.MeshPhongMaterial({ color: 0xb8aa90, shininess: 6 });
    var roof = new THREE.MeshPhongMaterial({ color: 0xa84828, shininess: 14 });
    var wood = new THREE.MeshPhongMaterial({ color: 0x6a4a28, shininess: 4 });

    var wallH = 0.55 * s, wallT = 0.16 * s, half = 1.15 * s;
    function wallSeg(dx, dz, sx, sz) {
      var m = new THREE.Mesh(new THREE.BoxGeometry(sx, wallH, sz), stone);
      m.position.set(dx, wallH / 2, dz);
      m.castShadow = true;
      m.receiveShadow = true;
      root.add(m);
      return m;
    }
    wallSeg(0, -half, half * 2 + wallT, wallT);
    wallSeg(0, half, half * 2 + wallT, wallT);
    wallSeg(-half, 0, wallT, half * 2 - wallT);
    wallSeg(half, 0, wallT, half * 2 - wallT);

    var gate = new THREE.Mesh(new THREE.BoxGeometry(0.55 * s, 0.48 * s, wallT * 1.2), wood);
    gate.position.set(0, 0.24 * s, half);
    root.add(gate);

    function tower(tx, tz) {
      var tw = 0.38 * s;
      var th = 0.95 * s;
      var t = new THREE.Mesh(new THREE.BoxGeometry(tw, th, tw), darkStone);
      t.position.set(tx, th / 2, tz);
      t.castShadow = true;
      root.add(t);
      var cap = new THREE.Mesh(new THREE.ConeGeometry(tw * 0.72, 0.32 * s, 4), roof);
      cap.rotation.y = Math.PI / 4;
      cap.position.set(tx, th + 0.12 * s, tz);
      cap.castShadow = true;
      root.add(cap);
    }
    tower(-half, -half);
    tower(half, -half);
    tower(-half, half);
    tower(half, half);

    function house(hx, hz, hw, hd, hh) {
      var body = new THREE.Mesh(new THREE.BoxGeometry(hw, hh, hd), stone);
      body.position.set(hx, hh / 2 + 0.02, hz);
      body.castShadow = true;
      root.add(body);
      var rf = new THREE.Mesh(new THREE.ConeGeometry(Math.max(hw, hd) * 0.72, 0.28 * s, 4), roof);
      rf.rotation.y = Math.PI / 4;
      rf.position.set(hx, hh + 0.12 * s, hz);
      root.add(rf);
    }
    house(-0.25 * s, -0.15 * s, 0.7 * s, 0.55 * s, 0.42 * s);
    house(0.35 * s, 0.2 * s, 0.5 * s, 0.45 * s, 0.34 * s);
    if (prov.capital) {
      house(0.05 * s, -0.45 * s, 0.42 * s, 0.42 * s, 0.55 * s);
    }

    var ring = new THREE.Mesh(
      new THREE.RingGeometry(half + 0.08 * s, half + 0.28 * s, 48),
      new THREE.MeshBasicMaterial({
        color: 0x3dcf5a, transparent: true, opacity: 0.92,
        side: THREE.DoubleSide, depthWrite: false
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.04;
    ring.visible = false;
    root.add(ring);

    var glow = new THREE.Mesh(
      new THREE.BoxGeometry(half * 2 + 0.12 * s, 0.06 * s, half * 2 + 0.12 * s),
      new THREE.MeshBasicMaterial({ color: 0x2ecc55, transparent: true, opacity: 0.35, depthWrite: false })
    );
    glow.position.y = 0.03;
    glow.visible = false;
    root.add(glow);

    var poleH = (prov.capital ? 3.6 : 3.0) * s;
    var pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04 * s, 0.05 * s, poleH, 6),
      new THREE.MeshPhongMaterial({ color: 0xc9b070 })
    );
    pole.position.set(half + 0.28 * s, poleH / 2, 0);
    root.add(pole);

    var flagCanvas = flagSymbolCanvas(prov.faction, fac.banner);
    var flagTex = new THREE.Texture(flagCanvas);
    flagTex.needsUpdate = true;
    var flagW = 1.1 * s, flagH = 1.4 * s;
    var flag = new THREE.Mesh(
      new THREE.PlaneGeometry(flagW, flagH),
      new THREE.MeshBasicMaterial({ map: flagTex, transparent: true, side: THREE.DoubleSide })
    );
    flag.position.set(half + 0.28 * s + flagW / 2 + 0.02, poleH - flagH / 2 - 0.06 * s, 0);
    root.add(flag);
    var flagBack = flag.clone();
    flagBack.rotation.y = Math.PI;
    root.add(flagBack);

    var hit = new THREE.Mesh(
      new THREE.CylinderGeometry(half + 0.45 * s, half + 0.45 * s, 1.6 * s, 12),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hit.position.y = 0.7 * s;
    hit.userData.isCityHit = true;
    root.add(hit);

    scene.add(root);

    var lc = document.createElement('canvas');
    lc.width = 256; lc.height = 64;
    var lg = lc.getContext('2d');
    lg.fillStyle = fac.banner;
    lg.fillRect(0, 10, 256, 44);
    lg.strokeStyle = 'rgba(255,230,160,0.7)';
    lg.strokeRect(1, 11, 254, 42);
    lg.fillStyle = '#fff8ec';
    lg.font = 'bold 26px Cinzel, Georgia, serif';
    lg.textAlign = 'center';
    lg.textBaseline = 'middle';
    lg.fillText((prov.cityRu || prov.city).toUpperCase(), 128, 32);
    var tex = new THREE.Texture(lc);
    tex.needsUpdate = true;
    var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    spr.scale.set(prov.capital ? 11 : 8.6, prov.capital ? 2.7 : 2.2, 1);
    spr.position.set(p.x, y + (prov.capital ? 5.8 : 4.4), p.z);
    scene.add(spr);

    var mark = {
      id: prov.id,
      prov: prov,
      root: root,
      ring: ring,
      glow: glow,
      hit: hit,
      label: spr,
      campaignName: CITY_CAMPAIGN[prov.city] || prov.city
    };
    cityMarks.push(mark);
    return mark;
  }

  function setCitySelected(mark) {
    selectedCityId = mark ? mark.id : null;
    cityMarks.forEach(function (m) {
      var on = mark && m.id === mark.id;
      m.ring.visible = !!on;
      m.glow.visible = !!on;
    });
  }

  function pickCity(e) {
    if (!three.camera || !cityMarks.length) return null;
    var rect = canvas.getBoundingClientRect();
    cityNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    cityNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    cityRay.setFromCamera(cityNdc, three.camera);
    var hits = [];
    cityMarks.forEach(function (m) {
      var h = cityRay.intersectObject(m.hit, false);
      if (h && h.length) hits.push({ mark: m, dist: h[0].distance });
    });
    if (!hits.length) return null;
    hits.sort(function (a, b) { return a.dist - b.dist; });
    return hits[0].mark;
  }

  function openCityPanel(mark) {
    if (!mark) return;
    setCitySelected(mark);
    var prov = mark.prov;
    setStatus('Город: ' + (prov.cityRu || prov.city));
    try {
      window.parent.postMessage({
        type: 'city-select',
        city: {
          name: mark.campaignName,
          ru: prov.cityRu || prov.city,
          region: prov.id,
          lon: prov.lon,

    var meshData = (window.ItalyDEM && ItalyDEM.ready() && ItalyDEM.buildHeightMesh)
      ? ItalyDEM.buildHeightMesh({
        box: BOX,
        cols: 440,
        rows: 500,
        sea: 8,
        coastY: 0.05,
        toXZ: xz,
        height: function (lon, lat, m) {
          m = alpinePassCarve(lon, lat, m);
          return 0.28 + m / 2950 * 26;
        }
      })
      : { positions: [0, 0, 0, 1, 0, 0, 0, 0, 1], uvs: [0, 0, 1, 0, 0, 1], indices: [0, 2, 1] };
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(meshData.positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(meshData.uvs, 2));
    geo.setIndex(meshData.indices);
    geo.computeVertexNormals();
    var tex = new THREE.Texture(paintTexture(2048, 2048));
    tex.needsUpdate = true;
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter || THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    var land = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      map: tex, shininess: 4, specular: 0x11110c
    }));
    land.receiveShadow = true;
    land.castShadow = true;
    land.name = 'italyLand';
    scene.add(land);

    var treeMat = new THREE.MeshLambertMaterial({ color: 0x1d3820 });
    var trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a3420 });
    var coneGeo = new THREE.ConeGeometry(0.5, 1.2, 6);
    var trunkGeo = new THREE.CylinderGeometry(0.08, 0.11, 0.28, 5);
    var planted = 0, tries = 0, lon, lat, p;
    while (planted < 280 && tries < 7000) {
      tries++;
      lon = BOX[0] + Math.random() * (BOX[2] - BOX[0]);
      lat = BOX[1] + Math.random() * (BOX[3] - BOX[1]);
      var tm = window.ItalyDEM && ItalyDEM.ready() ? ItalyDEM.meters(lon, lat) : 0;
      if (tm < 80 || tm > 900) continue;
      // меньше деревьев в Альпах — перевалы читаются
      if (lat > 45.35 && tm > 450) continue;
      var tg = new THREE.Group();
      var trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 0.1;
      tg.add(trunk);
      var crown = new THREE.Mesh(coneGeo, treeMat);
      crown.position.y = 0.52;
      crown.castShadow = true;
      tg.add(crown);
      p = xz(lon, lat);
      tg.position.set(p.x, worldH(lon, lat), p.z);
      tg.scale.setScalar(1.4 + Math.random() * 1.1);
      scene.add(tg);
      planted++;
    }

    function demM(lon, lat) {
      if (!(window.ItalyDEM && ItalyDEM.ready())) return 120;
      var m = ItalyDEM.meters(lon, lat);
      return m == null ? 0 : m;
    }

    /** Стоимость клетки дороги: долины и невысокие холмы дешевле, море/горы — дороже. */
    function roadCellCost(lon, lat, prevLon, prevLat) {
      var m = demM(lon, lat);
      if (!(m > 14)) return 8000;
      if (m > 1700) return 5000;
      var cost = 1;
      if (m < 180) cost += 0.15;
      else if (m < 420) cost += 0.7;
      else if (m < 750) cost += 2.2;
      else if (m < 1100) cost += 4.5;
      else cost += 8 + (m - 1100) / 70;
      if (prevLon != null) {
        var m0 = demM(prevLon, prevLat);
        cost += Math.abs(m - m0) / 35;
        var dlon = (lon - prevLon) * 0.72, dlat = lat - prevLat;
        cost += Math.sqrt(dlon * dlon + dlat * dlat) * 0.4;
      }
      return cost;
    }

    function chaikinRoad(pts, iterations) {
      var cur = pts, it, next, i, a, b;
      for (it = 0; it < iterations; it++) {
        if (cur.length < 2) break;
        next = [cur[0]];
        for (i = 0; i < cur.length - 1; i++) {
          a = cur[i]; b = cur[i + 1];
          next.push({ lon: a.lon * 0.75 + b.lon * 0.25, lat: a.lat * 0.75 + b.lat * 0.25 });
          next.push({ lon: a.lon * 0.25 + b.lon * 0.75, lat: a.lat * 0.25 + b.lat * 0.75 });
        }
        next.push(cur[cur.length - 1]);
        cur = next;
      }
      return cur;
    }

    /** Извилистая дорога по долинам между двумя городами. */
    function buildValleyRoad(a, b) {
      var steps = 32;
      var pts = [{ lon: a.lon, lat: a.lat }];
      var dx = b.lon - a.lon, dy = b.lat - a.lat;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var px = -dy / len, py = dx / len;
      var i, t, lon0, lat0, maxOff, k, off, lon, lat, c, best, prevLatOff = 0;
      for (i = 1; i < steps; i++) {
        t = i / steps;
        lon0 = a.lon + dx * t;
        lat0 = a.lat + dy * t;
        maxOff = (0.25 + len * 0.22) * Math.sin(Math.PI * t);
        if (maxOff < 0.08) maxOff = 0.08;
        best = { lon: lon0, lat: lat0, cost: 1e12, latOff: 0 };
        for (k = -10; k <= 10; k++) {
          off = (k / 10) * maxOff;
          lon = lon0 + px * off;
          lat = lat0 + py * off;
          c = roadCellCost(lon, lat, pts[pts.length - 1].lon, pts[pts.length - 1].lat);
          c += Math.abs(off - prevLatOff) * 2.2;
          c += Math.abs(k) * 0.04;
          if (c < best.cost) best = { lon: lon, lat: lat, cost: c, latOff: off };
        }
        pts.push({ lon: best.lon, lat: best.lat });
        prevLatOff = best.latOff;
      }
      pts.push({ lon: b.lon, lat: b.lat });
      // Второй проход: локально сдвинуть к более низкой точке
      for (i = 2; i < pts.length - 2; i++) {
        best = pts[i];
        var bestC = roadCellCost(best.lon, best.lat, pts[i - 1].lon, pts[i - 1].lat);
        for (k = -4; k <= 4; k++) {
          if (k === 0) continue;
          lon = pts[i].lon + px * (k * 0.04);
          lat = pts[i].lat + py * (k * 0.04);
          c = roadCellCost(lon, lat, pts[i - 1].lon, pts[i - 1].lat);
          c += roadCellCost(pts[i + 1].lon, pts[i + 1].lat, lon, lat) * 0.5;
          if (c < bestC) {
            bestC = c;
            best = { lon: lon, lat: lat };
          }
        }
        pts[i] = best;
      }
      return chaikinRoad(pts, 3);
    }

    function addRoadMesh(lonLatPts) {
      var world = [];
      var i, p, pp, h, lon, lat;
      for (i = 0; i < lonLatPts.length; i++) {
        lon = lonLatPts[i].lon;
        lat = lonLatPts[i].lat;
        h = demM(lon, lat);
        if (!(h > 10)) continue;
        pp = xz(lon, lat);
        world.push(new THREE.Vector3(pp.x, worldH(lon, lat) + 0.1, pp.z));
      }
      if (world.length < 2) return;
      var curve = new THREE.CatmullRomCurve3(world);
      curve.tension = 0.4;
      var segs = Math.max(24, Math.min(96, world.length * 3));
      var tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, segs, 0.15, 5, false),
        new THREE.MeshPhongMaterial({ color: 0xc4a56a, shininess: 6 })
      );
      scene.add(tube);
    }

    var byCity = {};
    PROVS.forEach(function (pr) { if (pr.city) byCity[pr.city] = pr; });
    ROADS.forEach(function (pair) {
      var a = byCity[pair[0]], b = byCity[pair[1]];
      if (!a || !b) return;
      addRoadMesh(buildValleyRoad(a, b));
    });
    addProvinceBorders(scene);
    PROVS.forEach(function (pr) { addCity(scene, pr); });
    if (window.CampaignMapBridge && CampaignMapBridge.addResourceMeshesThree) {
      CampaignMapBridge.addResourceMeshesThree(
        THREE, scene, CampaignMapBridge.getResources(),
        function (lon, lat) { return xz(lon, lat); },
        function (lon, lat) { return worldH(lon, lat); },
        1.6
      );
    }

    three.renderer = renderer;
    three.scene = scene;
    three.camera = camera;
    three.land = land;
    function handleCityClick(e) {
      var mark = pickCity(e);
      if (!mark) {
        closeCityPanel();
        return false;
      }
      openCityPanel(mark);
      return true;
    }
    var fieldArmyId = 'field_near_rome';
    try {
      var CS0 = window.parent && window.parent.CampaignState;
      if (CS0 && CS0.state.fieldArmies && CS0.state.fieldArmies[0]) {
        fieldArmyId = CS0.state.fieldArmies[0].id;
      }
    } catch (_) {}

    function worldToLonLat(x, z) {
      return { lon: x / SCALE + CX, lat: CY - z / SCALE };
    }

    function pickLonLatFromEvent(e) {
      if (!three.camera || !three.land) return null;
      var rect = canvas.getBoundingClientRect();
      var ndc = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      var ray = new THREE.Raycaster();
      ray.setFromCamera(ndc, three.camera);
      var hits = ray.intersectObject(three.land, false);
      if (!hits || !hits.length) return null;
      return worldToLonLat(hits[0].point.x, hits[0].point.z);
    }

    function hidePlayerArmy() {
      if (!three.units || !three.units.player) return;
      three.units.player.setSelected(false);
      three.units.player.root.visible = false;
    }

    function showPlayerArmyAt(lon, lat, armyId) {
      if (!three.units || !three.units.player) return;
      var p = xz(lon, lat);
      three.units.player.root.visible = true;
      three.units.player.root.position.set(p.x, worldH(lon, lat) + 0.08, p.z);
      if (three.units.player.setArmyId) three.units.player.setArmyId(armyId);
      three.units.player.setSelected(true);
    }

    if (window.WalkUnitThree && WalkUnitThree.mountPair) {
      var armyStart = xz(12.35, 41.78);
      try {
        var CS1 = window.parent && window.parent.CampaignState;
        var fa = CS1 && CS1.getFieldArmy && CS1.getFieldArmy(fieldArmyId);
        if (fa) armyStart = xz(fa.lon, fa.lat);
      } catch (_) {}
      three.units = WalkUnitThree.mountPair({
        THREE: THREE,
        scene: scene,
        camera: camera,
        canvas: canvas,
        land: land,
        hover: 0.08,
        scale: 2.1,
        speed: 9,
        combatStop: 1.8,
        armyId: fieldArmyId,
        playerStart: armyStart,
        npcStart: xz(14.08, 41.18),
        getHeight: function (x, z) {
          return worldH(x / SCALE + CX, CY - z / SCALE);
        },
        canWalk: function (x, z) {
          var lon = x / SCALE + CX;
          var lat = CY - z / SCALE;
          var raw = (window.ItalyDEM && ItalyDEM.ready()) ? ItalyDEM.meters(lon, lat) : 80;
          if (raw == null || !(raw > 12)) return 'Сюда нельзя: море';
          var m = alpinePassCarve(lon, lat, raw);
          // перевалы проходимы; сплошные высокие пики — нет
          if (m > 1100) return 'Сюда нельзя: высокие горы';
          return true;
        },
        setPanEnabled: function (on) { allowPan = on; },
        onMapClick: handleCityClick,
        beforeRmbMove: function (e) {
          try {
            var CUI = window.parent && window.parent.CampaignUI;
            if (!CUI || !CUI.getSelectedGarrisonIds || !CUI.getSelectedGarrisonIds().length) return false;
            var ll = pickLonLatFromEvent(e);
            if (!ll) return false;
            var dep = CUI.tryDeployGarrison(ll.lon, ll.lat);
            if (!dep || !dep.army) return false;
            fieldArmyId = dep.army.id;
            showPlayerArmyAt(dep.army.lon, dep.army.lat, dep.army.id);
            three.units.player.setSelected(true);
            try {
              window.parent.postMessage({ type: 'army-select', armyId: dep.army.id }, '*');
            } catch (_) {}
            setStatus('Армия вышла · ЛКМ — выбрать · ПКМ — идти');
            return true;
          } catch (_) { return false; }
        },
        resolveEnterCity: function (e) {
          var mark = pickCity(e);
          if (!mark || !mark.campaignName) return null;
          return mark.campaignName;
        },
        onSelect: function (on) {
          try {
            if (on) {
              var aid = three.units.player.getArmyId && three.units.player.getArmyId();
              if (!aid) {
                var CS = window.parent && window.parent.CampaignState;
                if (CS && CS.state.selectedFieldArmyId) aid = CS.state.selectedFieldArmyId;
                else if (CS && CS.state.fieldArmies && CS.state.fieldArmies.length) {
                  aid = CS.state.fieldArmies[CS.state.fieldArmies.length - 1].id;
                } else aid = fieldArmyId;
              }
              if (aid) window.parent.postMessage({ type: 'army-select', armyId: aid }, '*');
            }
          } catch (_) {}
        },
        onArrive: function (meta, player) {
          if (meta && meta.combat) return;
          try {
            var CS = window.parent && window.parent.CampaignState;
            if (!CS || !player) return;
            var ll = worldToLonLat(player.root.position.x, player.root.position.z);
            var aid = (player.getArmyId && player.getArmyId()) || fieldArmyId;
            // Вход в город только если шли именно на город (ПКМ по городу)
            if (meta && meta.enterCity && CS.mergeFieldArmyIntoCity(aid, meta.enterCity)) {
              fieldArmyId = null;
              hidePlayerArmy();
              if (player.setArmyId) player.setArmyId(null);
              var city = CS.getCity(meta.enterCity);
              window.parent.postMessage({
                type: 'army-merged',
                city: meta.enterCity,
                cityRu: city ? city.ru : meta.enterCity
              }, '*');
              setStatus('Армия вошла в ' + (city ? (city.ru || city.name) : meta.enterCity));
              return;
            }
            if (CS.updateFieldArmyPosition) {
              CS.updateFieldArmyPosition(aid, ll.lon, ll.lat);
            }
            // Армия остаётся видимой на месте
            if (player.root) player.root.visible = true;
          } catch (_) {}
        },
        follow: function (x, y, z) {
          target.x += (x - target.x) * 0.07;
          target.y += (y - target.y) * 0.07;
          target.z += (z - target.z) * 0.07;
        },
        onBattle: showBattleDialog,
        onStatus: setStatus
      });
      three.walker = three.units.player;
    }
    applyCam();
  }
  function loop() {
    if (!three.renderer) return;
    var now = performance.now();
    var dt = Math.min(0.05, (now - (loop.last || now)) / 1000);
    loop.last = now;
    if (three.units) three.units.tick(dt);
    else if (three.walker) three.walker.tick(dt);
    if (three.seaUniforms) three.seaUniforms.uTime.value = now * 0.001;
    cityMarks.forEach(function (m) {
      if (m.ring.visible) m.ring.rotation.z += dt * 0.7;
    });
    applyCam();
    three.renderer.render(three.scene, three.camera);
    three.raf = requestAnimationFrame(loop);
  }
  function onResize() {
    if (!three.renderer || !three.camera) return;
    var w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    three.camera.aspect = w / h;
    three.camera.updateProjectionMatrix();
    three.renderer.setSize(w, h, false);
  }
  function reportCamera() {
    try {
      window.parent.postMessage({
        type: 'camera-state',
        center: { lon: CX - target.x / SCALE, lat: CY - target.z / SCALE },
        viewQuad: [
          { lon: BOX[0], lat: BOX[3] }, { lon: BOX[2], lat: BOX[3] },
          { lon: BOX[2], lat: BOX[1] }, { lon: BOX[0], lat: BOX[1] }
        ]
      }, '*');
    } catch (_) {}
  }

  var cityClick = { x: 0, y: 0, moved: false, onCity: false, pending: false };
  canvas.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    cityClick.x = e.clientX;
    cityClick.y = e.clientY;
    cityClick.moved = false;
    cityClick.pending = true;
    cityClick.onCity = !!pickCity(e);
    if (cityClick.onCity) {
      allowPan = false;
      return;
    }
    if (!allowPan) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', function (e) {
    if (cityClick.pending) {
      var cdx = e.clientX - cityClick.x, cdy = e.clientY - cityClick.y;
      if (cdx * cdx + cdy * cdy > 36) cityClick.moved = true;
    }
    if (!dragging || !allowPan) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    var yaw = camYaw * Math.PI / 180;
    var k = 0.045 / camZoom;
    target.x -= (Math.cos(yaw) * dx + Math.sin(yaw) * dy) * k;
    target.z -= (-Math.sin(yaw) * dx + Math.cos(yaw) * dy) * k;
  });
  window.addEventListener('mouseup', function (e) {
    dragging = false;
    canvas.classList.remove('dragging');
    if (cityClick.pending && !cityClick.moved) {
      var mark = pickCity(e);
      if (mark) openCityPanel(mark);
      else closeCityPanel();
    }
    cityClick.onCity = false;
    cityClick.pending = false;
    allowPan = true;
  });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    camZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camZoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    applyCam();
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'KeyQ') { e.preventDefault(); camTilt = Math.max(TILT_MIN, camTilt - TILT_STEP); }
    else if (e.code === 'KeyE') { e.preventDefault(); camTilt = Math.min(TILT_MAX, camTilt + TILT_STEP); }
    else if (e.code === 'KeyZ') { e.preventDefault(); camYaw = wrapYaw(camYaw - YAW_STEP); }
    else if (e.code === 'KeyC') { e.preventDefault(); camYaw = wrapYaw(camYaw + YAW_STEP); }
  });
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'camera-tilt') {
      if (typeof e.data.delta === 'number') camTilt = Math.max(TILT_MIN, Math.min(TILT_MAX, camTilt + e.data.delta));
    }
    if (e.data.type === 'camera-rotate') {
      if (typeof e.data.delta === 'number') camYaw = wrapYaw(camYaw + e.data.delta);
    }
    if (e.data.type === 'camera-state-request') reportCamera();
  });
  window.addEventListener('resize', onResize);

  if (typeof THREE === 'undefined') {
    setStatus('Three.js не загрузился');
    return;
  }
  var demP = window.ItalyDEM ? ItalyDEM.load() : Promise.resolve(false);
  demP.then(function () {
    if (window.ItalyDEM && ItalyDEM.ready()) BOX = ItalyDEM.bbox.slice();
    buildScene();
    loop();
    setStatus('Клик по городу · солдат · карта');
    reportCamera();
  });
})();
</script>
</body>
