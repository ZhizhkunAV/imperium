<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>View 16 - Godot 4</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<button type="button" id="localBattleBtn" style="
			position:fixed;top:12px;right:12px;z-index:50;
			font-family:Cinzel,serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
			color:#f5e6c8;background:rgba(16,12,8,.9);border:1px solid rgba(201,168,76,.55);
			padding:10px 14px;cursor:pointer;">Локальный бой</button>

		<div id="camPad" style="
			position:fixed;left:12px;bottom:12px;z-index:50;display:flex;flex-direction:column;gap:6px;
			font-family:Cinzel,serif;">
			<div style="display:flex;gap:6px;">
				<button type="button" data-cam="tilt-3" style="width:44px;height:36px;cursor:pointer;color:#f5e6c8;background:rgba(16,12,8,.9);border:1px solid rgba(201,168,76,.55);">Q</button>
				<button type="button" data-cam="tilt+3" style="width:44px;height:36px;cursor:pointer;color:#f5e6c8;background:rgba(16,12,8,.9);border:1px solid rgba(201,168,76,.55);">E</button>
			</div>
			<div style="display:flex;gap:6px;">
				<button type="button" data-cam="yaw-6" style="width:44px;height:36px;cursor:pointer;color:#f5e6c8;background:rgba(16,12,8,.9);border:1px solid rgba(201,168,76,.55);">Z</button>
				<button type="button" data-cam="yaw+6" style="width:44px;height:36px;cursor:pointer;color:#f5e6c8;background:rgba(16,12,8,.9);border:1px solid rgba(201,168,76,.55);">C</button>
			</div>
		</div>

		<script>
		// Очередь камеры до старта Godot (parent postMessage + кнопки)
		(function () {
			window.__godotMsgQueue = window.__godotMsgQueue || [];
			if (!window.__godotView16Bridge) {
				window.__godotView16Bridge = true;
				window.addEventListener('message', function (e) {
					if (!e.data || typeof e.data !== 'object') return;
					var t = e.data.type;
					if (t === 'campaign-sync' || t === 'camera-tilt' || t === 'camera-rotate' || t === 'camera-goto') {
						window.__godotMsgQueue.push(e.data);
					}
				});
			}
			document.getElementById('camPad').addEventListener('click', function (e) {
				var btn = e.target.closest('[data-cam]');
				if (!btn) return;
				var a = btn.getAttribute('data-cam');
				if (a === 'tilt-3') window.__godotMsgQueue.push({ type: 'camera-tilt', delta: -3 });
				else if (a === 'tilt+3') window.__godotMsgQueue.push({ type: 'camera-tilt', delta: 3 });
				else if (a === 'yaw-6') window.__godotMsgQueue.push({ type: 'camera-rotate', delta: -6 });
				else if (a === 'yaw+6') window.__godotMsgQueue.push({ type: 'camera-rotate', delta: 6 });
			});
		})();
		</script>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2285856,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
		<script src="/js/battle-system.js"></script>
		<script src="/js/battle-map-hook.js"></script>
		<script>
		(function () {
			var btn = document.getElementById('localBattleBtn');
			if (!btn) return;
			btn.addEventListener('click', function () {
				if (window.BattleMapHook) BattleMapHook.showBattleDialog();
				else if (window.BattleSystem) BattleSystem.showBattleDialog();
				else {
					try { window.parent.postMessage({ type: 'battle-open-local' }, '*'); } catch (_) {}
				}
			});
		})();
		</script>
	</body>
</html>
