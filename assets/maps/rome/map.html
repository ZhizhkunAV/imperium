<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rome Map — Вид 4 / Вид 5</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04080c; font-family: 'EB Garamond', Georgia, serif; color: #efe4d0; }
    #view4, #view5 { position: absolute; inset: 0; width: 100%; height: 100%; }
    #view4 { z-index: 1; cursor: grab; display: block; }
    #view4.dragging { cursor: grabbing; }
    #view5 { z-index: 1; display: none; cursor: grab; }
    #view5 canvas { display: block; width: 100% !important; height: 100% !important; }
    #hud {
      position: fixed; top: 12px; right: 12px; z-index: 30; padding: 10px 12px;
      background: rgba(12, 8, 4, 0.72); border: 1px solid rgba(201, 168, 76, 0.45);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); min-width: 180px;
    }
    #hud.embedded { display: none; }
    #hud button {
      width: 100%; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; color: #f5e6c8; background: rgba(30, 22, 12, 0.9);
      border: 1px solid rgba(201, 168, 76, 0.55); padding: 8px 10px; cursor: pointer;
    }
    #hud button:hover { border-color: #e0c878; color: #fff; }
    #hud .hint { margin-top: 7px; font-size: 12px; color: #b7a078; line-height: 1.35; }
    #camHud {
      position: fixed; top: 12px; left: 12px; z-index: 30; min-width: 118px;
      padding: 8px 10px; background: rgba(16, 12, 8, 0.88);
      border: 1px solid rgba(201, 168, 76, 0.45); pointer-events: none;
    }
    #camHud .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
    #camHud .row + .row { margin-top: 3px; }
    #camHud span { color: #b7a078; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
    #camHud b { font-family: 'Cinzel', serif; color: #f5e6c8; }
    #status {
      position: fixed; left: 12px; bottom: 12px; z-index: 30; font-size: 13px; color: #c9b48a;
      background: rgba(8, 6, 3, 0.55); padding: 6px 10px; border: 1px solid rgba(201, 168, 76, 0.25);
      pointer-events: none;
    }
    #battleModal {
      display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 80; width: min(92vw, 420px); padding: 22px 24px 18px;
      background: rgba(14, 10, 6, 0.94); border: 1px solid rgba(201, 168, 76, 0.55);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55); text-align: center;
    }
    #battleModal.show { display: block; }
    #battleModal p {
      margin: 0 0 16px; font-size: 18px; line-height: 1.4; color: #f5ead0;
    }
    #battleModal button {
      font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #f5e6c8; background: rgba(30, 22, 12, 0.95); border: 1px solid rgba(201, 168, 76, 0.55);
      padding: 8px 16px; cursor: pointer;
    }
    #battleModal button:hover { border-color: #e0c878; color: #fff; }
  </style>
</head>
<body>
  <canvas id="view4" tabindex="0"></canvas>
  <div id="view5"></div>
  <div id="hud">
    <button type="button" id="swapBtn">Сменить вид карты</button>
    <div class="hint" id="hudHint">Сейчас: Вид 4 (Canvas)</div>
  </div>
  <div id="camHud">
    <div class="row"><span>Зум</span><b id="hudZoom">100%</b></div>
    <div class="row"><span>Наклон</span><b id="hudTilt">80%</b></div>
    <div class="row"><span>Поворот</span><b id="hudYaw">0°</b></div>
  </div>
  <div id="status">Загрузка карты Италии…</div>
  <div id="battleModal" role="dialog" aria-modal="true">
    <p id="battleModalText">Начинается бой, ваши войска Рима атаковали армию Карфагена</p>
    <button type="button" id="battleModalClose">Закрыть</button>
  </div>

  <script src="three.min.js"></script>
  <script src="/maps/rome/three.min.js"></script>
  <script src="/js/map-paint.js?v=20260831editor2"></script>
  <script src="/js/italy-dem.js?v=20260831paint"></script>
  <script src="/js/walk-unit-three.js"></script>
<script src="/js/battle-system.js"></script>
  <script src="/js/battle-map-hook.js"></script>
  <script src="/js/italy-provinces.js"></script>
  <script src="/js/campaign-map-bridge.js"></script>
  <script>
(function () {
  'use strict';

  var GEO_URLS = [
    '/maps/view1/regions.geojson',
    '/maps/view3/italy.geojson',
    '../view3/italy.geojson',
    'https://cdn.jsdelivr.net/gh/holtzy/D3-graph-gallery@master/DATA/world.geojson',
    'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson'
  ];
  var PROV_COLORS = [0xc4b47a, 0xa8b86c, 0xd2c49a, 0x9cba8c, 0xc9b896, 0xb8c48a, 0xdbc8a0, 0xb0a878, 0x8eaa72, 0xccb888, 0xa3b67e, 0xd8c8a8, 0x97ad70, 0xc2b080, 0xb5c090, 0xe0d0b0, 0x8fa86a, 0xcdb892, 0xaab484, 0xd4bc94];
  var NAME_RU = {
    Piemonte: 'Пьемонт', Lombardia: 'Ломбардия', Veneto: 'Венето', Liguria: 'Лигурия',
    'Emilia-Romagna': 'Эмилия', Toscana: 'Тоскана', Umbria: 'Умбрия', Marche: 'Марке',
    Lazio: 'Лацио', Abruzzo: 'Абруццо', Molise: 'Молизе', Campania: 'Кампания',
    Puglia: 'Апулия', Basilicata: 'Базиликата', Calabria: 'Калабрия', Sicilia: 'Сицилия',
    Sardegna: 'Сардиния', 'Friuli-Venezia Giulia': 'Фриули', 'Trentino-Alto Adige': 'Трентино',
    'Valle d\'Aosta': 'Валле-д’Аоста', "Valle d'Aosta": 'Валле-д’Аоста'
  };
  var FALLBACK_RINGS = [
    [[7.5,43.75],[8.15,44.35],[8.75,44.85],[9.2,45.55],[10.55,45.75],[11.05,46.52],[12.35,46.52],[13.72,45.65],[13.48,43.62],[13.95,42.38],[14.95,41.92],[16.05,41.92],[17.25,40.82],[18.37,40.38],[17.15,40.52],[16.55,39.52],[17.15,39.52],[16.48,38.86],[15.63,38.12],[15.78,39.52],[16.18,41.55],[14.78,40.72],[14.15,40.92],[13.52,41.22],[12.18,41.68],[11.12,42.38],[10.48,42.85],[10.28,43.52],[9.82,44.12],[8.48,44.28],[7.55,43.78]],
    [[12.42,38.18],[13.28,38.28],[15.08,38.28],[15.63,38.08],[15.28,36.68],[14.28,37.02],[12.52,37.52],[12.42,38.18]],
    [[8.13,41.25],[9.63,41.22],[9.78,39.12],[8.38,38.86],[8.13,41.25]]
  ];
  var TILT_MIN = 0, TILT_MAX = 75, TILT_DEFAULT = 60, TILT_STEP = 3;
  var YAW_STEP = 6, YAW_BASE = -8;
  var MIN_ZOOM = 1, MAX_ZOOM = 5;

  var params = {};
  try {
    window.location.search.slice(1).split('&').forEach(function (pair) {
      var p = pair.split('=');
      if (p[0]) params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
  } catch (_) {}

  var embedded = window.parent !== window;
  var mode = params.view === '5' ? 5 : 4;
  var canvas = document.getElementById('view4');
  var ctx = canvas.getContext('2d');
  var view5 = document.getElementById('view5');
  var statusEl = document.getElementById('status');
  var hud = document.getElementById('hud');
  var hudHint = document.getElementById('hudHint');
  if (embedded) hud.classList.add('embedded');

  var italyRings = [];
  var drawRings = [];
  var provinceFeatures = [];
  var landMask = null;
  var meshMask = null;
  var coastFadeMask = null;
  var meshBBox = [6.6, 36.5, 18.6, 47.1];
  var maskW = 480;
  var maskH = 560;
  var bbox = [6.6, 36.5, 18.6, 47.1];
  var ready = false;
  var W = 0, H = 0, time = 0;
  var zoom = 1.15, panX = 0, panY = 0, tiltDeg = TILT_DEFAULT, yawDeg = 0;
  var dragging = false, lastX = 0, lastY = 0;
  var allowPan = true;

  var three = { renderer: null, scene: null, camera: null, armies: [], raf: 0, built: false, scale: 6, cx: 12.5, cy: 42, land: null, walker: null, npc: null, units: null };
  var cityMarks = [];
  var cityRay = null;
  var cityNdc = null;

  function setStatus(t) { statusEl.textContent = t; }
  var battleModal = document.getElementById('battleModal');
  var battleClose = document.getElementById('battleModalClose');
  var __battleBind = null;
  function battleMapCtx() {
    return {
      getPair: function () {
        if (typeof three !== 'undefined' && three && three.units) return three.units;
        return null;
      },
      xz: typeof xz === 'function' ? xz : null,
      worldH: typeof worldH === 'function' ? worldH : null,
      SCALE: typeof SCALE !== 'undefined' ? SCALE : null,
      CX: typeof CX !== 'undefined' ? CX : null,
      CY: typeof CY !== 'undefined' ? CY : null,
      hover: 0.08,
      onStatus: typeof setStatus === 'function' ? setStatus : function () {}
    };
  }
  function showBattleDialog() {
    if (window.BattleSystem) {
      __battleBind = BattleSystem.bindMap(battleMapCtx());
      BattleSystem.openContact(battleMapCtx());
      return;
    }
    if (battleModal) battleModal.classList.add('show');
  }
  function hideBattleDialog() {
    if (battleModal) battleModal.classList.remove('show');
  }
  if (battleClose) battleClose.addEventListener('click', hideBattleDialog);
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'battle-local-done' && window.BattleSystem) {
      BattleSystem.bindMap(battleMapCtx());
      BattleSystem.finishLocalBattle(e.data);
    }
  });
  function yScale() { return Math.max(0.22, Math.cos(tiltDeg * Math.PI / 180)); }
  function wrapYaw(deg) {
    deg = deg % 360;
    if (deg < 0) deg += 360;
    return deg;
  }
  function yawRad() { return (YAW_BASE + yawDeg) * Math.PI / 180; }
  function updateHud() {
    document.getElementById('hudZoom').textContent = Math.round(zoom * 100) + '%';
    document.getElementById('hudTilt').textContent = Math.round((tiltDeg / TILT_MAX) * 100) + '%';
    var yawEl = document.getElementById('hudYaw');
    if (yawEl) yawEl.textContent = Math.round(wrapYaw(yawDeg)) + '°';
  }
  function nudgeTilt(d) {
    tiltDeg = Math.max(TILT_MIN, Math.min(TILT_MAX, tiltDeg + d));
    updateHud();
    if (three.built) applyThreeCamera();
  }
  function nudgeYaw(d) {
    yawDeg = wrapYaw(yawDeg + d);
    updateHud();
    if (three.built) applyThreeCamera();
  }
  function setZoom(next, clientX, clientY) {
    next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, next));
    if (Math.abs(next - zoom) < 1e-6) return;
    var k = next / zoom;
    if (!three.built) {
      var cx = clientX - W / 2;
      var cy = clientY - H / 2;
      panX = cx - (cx - panX) * k;
      panY = cy - (cy - panY) * k;
    }
    zoom = next;
    updateHud();
    if (three.built) applyThreeCamera();
  }

  function showLayers() {
    var use3d = three.built;
    canvas.style.display = use3d ? 'none' : 'block';
    view5.style.display = use3d ? 'block' : 'none';
  }

  function applyViewTint() {
    if (!three.renderer) return;
    if (mode === 4) {
      three.renderer.setClearColor(0x2a4850, 1);
      if (three.scene && three.scene.fog) three.scene.fog.color.setHex(0x6a8890);
    } else {
      three.renderer.setClearColor(0x1a3848, 1);
      if (three.scene && three.scene.fog) three.scene.fog.color.setHex(0x4a6a78);
    }
  }

  function applyMode() {
    var is5 = mode === 5;
    hudHint.textContent = is5 ? 'Сейчас: Вид 5 (3D)' : 'Сейчас: Вид 4 (3D)';
    setStatus((is5 ? 'Вид 5' : 'Вид 4') + ' · колесо — зум · Q / E — наклон · Z / C — поворот');
    startThree();
    if (three.built) {
      geo2d = null;
      refreshThreeTexture();
      applyViewTint();
    }
    showLayers();
    updateHud();
  }

  document.getElementById('swapBtn').addEventListener('click', function () {
    mode = mode === 4 ? 5 : 4;
    applyMode();
  });

  function fetchFirst(urls) {
    var i = 0;
    function next() {
      if (i >= urls.length) return Promise.reject(new Error('GeoJSON недоступен'));
      var url = urls[i++];
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error('HTTP');
        return r.json();
      }).catch(function () { return next(); });
    }
    return next();
  }

  function simplifyRing(ring, maxPts) {
    if (ring.length <= maxPts) return ring.slice();
    var step = Math.ceil(ring.length / maxPts);
    var out = [];
    for (var i = 0; i < ring.length; i += step) out.push(ring[i]);
    var last = ring[ring.length - 1];
    var prev = out[out.length - 1];
    if (!prev || prev[0] !== last[0] || prev[1] !== last[1]) out.push(last);
    return out;
  }

  function extractItaly(geojson) {
    var list = geojson.features || [];
    var feature = null;
    for (var i = 0; i < list.length; i++) {
      var p = list[i].properties || {};
      var name = (p.name || p.NAME || p.ADMIN || '').toString();
      if (name === 'Italy' || p.ISO_A3 === 'ITA' || p.iso_a3 === 'ITA') { feature = list[i]; break; }
    }
    if (!feature && geojson.type === 'Feature') feature = geojson;
    var rings = [];
    var minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
    function absorb(ring) {
      if (!ring || ring.length < 3) return;
      var pts = simplifyRing(ring, 220);
      for (var i = 0; i < pts.length; i++) {
        var lon = pts[i][0], lat = pts[i][1];
        if (lon < minLon) minLon = lon;
        if (lat < minLat) minLat = lat;
        if (lon > maxLon) maxLon = lon;
        if (lat > maxLat) maxLat = lat;
      }
      if (pts.length >= 3) rings.push(pts);
    }
    function absorbFeature(f) {
      if (!f || !f.geometry) return;
      var g = f.geometry;
      if (g.type === 'Polygon') absorb(g.coordinates[0]);
      else if (g.type === 'MultiPolygon') {
        for (var pi = 0; pi < g.coordinates.length; pi++) absorb(g.coordinates[pi][0]);
      }
    }
    if (feature) absorbFeature(feature);
    else for (var fi = 0; fi < list.length; fi++) absorbFeature(list[fi]);
    if (!rings.length) throw new Error('Italy not found');
    setRings(rings, minLon, minLat, maxLon, maxLat);
    extractProvinces(list, feature);
  }

  function extractProvinces(list, countryFeature) {
    provinceFeatures = [];
    var regionLike = !countryFeature && list.length >= 4 && list.some(function (f) {
      var p = (f && f.properties) || {};
      return p.reg_name || p.name || p.NAME;
    });
    if (!regionLike) return;
    for (var ri = 0; ri < list.length; ri++) {
      var f = list[ri];
      if (!f || !f.geometry) continue;
      var prings = [];
      function take(ring) {
        var pts = simplifyRing(ring, 160);
        if (pts.length >= 3) prings.push(pts);
      }
      var gg = f.geometry;
      if (gg.type === 'Polygon') take(gg.coordinates[0]);
      else if (gg.type === 'MultiPolygon') {
        for (var pj = 0; pj < gg.coordinates.length; pj++) take(gg.coordinates[pj][0]);
      }
      if (!prings.length) continue;
      var pp = f.properties || {};
      var raw = (pp.reg_name || pp.name || pp.NAME || ('Регион ' + (ri + 1))).toString();
      provinceFeatures.push({
        name: NAME_RU[raw] || raw,
        rings: prings,
        color: PROV_COLORS[ri % PROV_COLORS.length]
      });
    }
  }

  function setRings(rings, minLon, minLat, maxLon, maxLat) {
    italyRings = rings;
    drawRings = rings.map(function (r) { return simplifyRing(r, 140); });
    var padLon = (maxLon - minLon) * 0.06;
    var padLat = (maxLat - minLat) * 0.06;
    bbox = [minLon - padLon, minLat - padLat, maxLon + padLon, maxLat + padLat];
    buildLandMask();
    meshBBox = bbox.slice();
    meshMask = landMask ? new Uint8Array(landMask) : null;
  }

  function useFallbackOutline() {
    var minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
    FALLBACK_RINGS.forEach(function (ring) {
      ring.forEach(function (pt) {
        if (pt[0] < minLon) minLon = pt[0];
        if (pt[1] < minLat) minLat = pt[1];
        if (pt[0] > maxLon) maxLon = pt[0];
        if (pt[1] > maxLat) maxLat = pt[1];
      });
    });
    setRings(FALLBACK_RINGS, minLon, minLat, maxLon, maxLat);
  }

  function buildLandMask() {
    var oc = document.createElement('canvas');
    oc.width = maskW;
    oc.height = maskH;
    var octx = oc.getContext('2d');
    octx.clearRect(0, 0, maskW, maskH);
    octx.beginPath();
    for (var r = 0; r < italyRings.length; r++) {
      var ring = italyRings[r];
      octx.moveTo(lonToMaskX(ring[0][0]), latToMaskY(ring[0][1]));
      for (var i = 1; i < ring.length; i++) octx.lineTo(lonToMaskX(ring[i][0]), latToMaskY(ring[i][1]));
      octx.closePath();
    }
    octx.fillStyle = '#fff';
    octx.fill('nonzero');
    var data = octx.getImageData(0, 0, maskW, maskH).data;
    landMask = new Uint8Array(maskW * maskH);
    for (var p = 0; p < landMask.length; p++) landMask[p] = data[p * 4] > 8 ? 1 : 0;
    buildCoastFade();
  }
  function buildCoastFade() {
    if (!landMask) { coastFadeMask = null; return; }
    var fade = new Float32Array(maskW * maskH);
    var r = 7, x, y, i, j, xx, yy, land, tot, f;
    function on(px, py) {
      if (px < 0 || py < 0 || px >= maskW || py >= maskH) return 0;
      return landMask[py * maskW + px];
    }
    for (y = 0; y < maskH; y++) {
      for (x = 0; x < maskW; x++) {
        if (!on(x, y)) { fade[y * maskW + x] = 0; continue; }
        if (on(x - r, y) && on(x + r, y) && on(x, y - r) && on(x, y + r)
          && on(x - r, y - r) && on(x + r, y + r) && on(x - r, y + r) && on(x + r, y - r)) {
          fade[y * maskW + x] = 1;
          continue;
        }
        land = 0;
        tot = 0;
        for (j = -r; j <= r; j++) {
          for (i = -r; i <= r; i++) {
            xx = x + i;
            yy = y + j;
            if (xx < 0 || yy < 0 || xx >= maskW || yy >= maskH) continue;
            tot++;
            if (landMask[yy * maskW + xx]) land++;
          }
        }
        f = tot ? land / tot : 1;
        if (f > 0.93) fade[y * maskW + x] = 1;
        else if (f < 0.52) fade[y * maskW + x] = 0.07;
        else fade[y * maskW + x] = 0.07 + (f - 0.52) / 0.41 * 0.93;
      }
    }
    coastFadeMask = fade;
  }
  function lonToMaskX(lon) { return (lon - bbox[0]) / (bbox[2] - bbox[0]) * (maskW - 1); }
  function latToMaskY(lat) { return (bbox[3] - lat) / (bbox[3] - bbox[1]) * (maskH - 1); }

  function pointInMesh(lon, lat) {
    var box = meshBBox;
    var mask = meshMask || landMask;
    if (!mask) return false;
    var x = Math.round((lon - box[0]) / (box[2] - box[0]) * (maskW - 1));
    var y = Math.round((box[3] - lat) / (box[3] - box[1]) * (maskH - 1));
    if (x < 0 || y < 0 || x >= maskW || y >= maskH) return false;
    return mask[y * maskW + x] === 1;
  }
  var HEIGHT_SCALE = 1.05;
  var DEM = null;
  var DEM_BBOX = [6.4, 36.2, 18.9, 47.4];
  var DEM_OFFSET = 500;

  function loadDemImage() {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement('canvas');
          c.width = img.width;
          c.height = img.height;
          var g = c.getContext('2d');
          g.drawImage(img, 0, 0);
          var px = g.getImageData(0, 0, img.width, img.height).data;
          var data = new Float32Array(img.width * img.height);
          for (var i = 0; i < data.length; i++) {
            data[i] = px[i * 4] * 256 + px[i * 4 + 1] - DEM_OFFSET;
          }
          DEM = { w: img.width, h: img.height, data: data };
          resolve(true);
        } catch (err) { resolve(false); }
      };
      img.onerror = function () { resolve(false); };
      img.src = '/maps/rome/italy-height.png';
    });
  }

  function demMeters(lon, lat) {
    if (!DEM) return null;
    var u = (lon - DEM_BBOX[0]) / (DEM_BBOX[2] - DEM_BBOX[0]);
    var v = (DEM_BBOX[3] - lat) / (DEM_BBOX[3] - DEM_BBOX[1]);
    if (u < 0 || v < 0 || u > 1 || v > 1) return 0;
    var x = u * (DEM.w - 1);
    var y = v * (DEM.h - 1);
    var x0 = Math.floor(x), y0 = Math.floor(y);
    var x1 = Math.min(DEM.w - 1, x0 + 1);
    var y1 = Math.min(DEM.h - 1, y0 + 1);

        if (!coast) continue;
        pxls[ei] = pxls[ei] * 0.48 + 168 * 0.52;
        pxls[ei + 1] = pxls[ei + 1] * 0.48 + 152 * 0.52;
        pxls[ei + 2] = pxls[ei + 2] * 0.48 + 112 * 0.52;
      }
    }
    g.putImageData(img, 0, 0);
    g.restore();

    var rnd = seededRand(120);
    var i, j, p, hv, sz;

    for (i = 0; i < 70; i++) {
      p = toXY(box[0] + rnd() * (box[2] - box[0]), box[1] + rnd() * (box[3] - box[1]));
      if (p.x < 8 || p.y < 8 || p.x > tw - 8 || p.y > th - 8) continue;
      var lonH = box[0] + p.x / tw * (box[2] - box[0]);
      var latH = box[3] - p.y / th * (box[3] - box[1]);
      if (DEM ? !(demMeters(lonH, latH) > 10) : !pointInMesh(lonH, latH)) continue;
      hv = heightAt(lonH, latH);
      if (hv < 1.1 || hv > 3.4) continue;
      g.save();
      g.translate(p.x, p.y);
      g.rotate(rnd() * Math.PI);
      g.beginPath();
      g.ellipse(0, 0, 14 + rnd() * 18, 8 + rnd() * 10, 0, 0, Math.PI * 2);
      g.fillStyle = earth ? 'rgba(70, 120, 48, 0.24)' : 'rgba(90, 110, 55, 0.22)';
      g.fill();
      g.restore();
    }

    var farmBands = [
      [8.2, 44.85, 12.6, 45.35],
      [12.1, 41.55, 13.1, 42.15],
      [14.0, 40.7, 15.1, 41.3]
    ];
    for (i = 0; i < farmBands.length; i++) {
      var fb = farmBands[i];
      for (j = 0; j < 18; j++) {
        var fx = fb[0] + rnd() * (fb[2] - fb[0]);
        var fy = fb[1] + rnd() * (fb[3] - fb[1]);
        if (!pointInMesh(fx, fy) || heightAt(fx, fy) > 1.6) continue;
        p = toXY(fx, fy);
        g.save();
        g.translate(p.x, p.y);
        g.rotate((rnd() - 0.5) * 0.8);
        g.strokeStyle = earth ? 'rgba(140, 170, 60, 0.42)' : 'rgba(160, 140, 70, 0.38)';
        g.lineWidth = 1;
        var fw = 18 + rnd() * 22, fh = 10 + rnd() * 12;
        for (var row = 0; row < 4; row++) {
          g.beginPath();
          g.moveTo(-fw / 2, -fh / 2 + (fh / 4) * row);
          g.lineTo(fw / 2, -fh / 2 + (fh / 4) * row);
          g.stroke();
        }
        g.restore();
      }
    }

    var forestSeeds = [
      [8.7, 44.28], [8.95, 44.12], [9.35, 45.55], [9.55, 45.35],
      [10.1, 44.2], [10.4, 43.95], [11.25, 43.62], [11.55, 43.35],
      [12.45, 42.25], [12.7, 42.0], [13.9, 41.05], [14.2, 40.75],
      [15.9, 39.35], [16.15, 40.55], [16.4, 39.7], [15.4, 40.2],
      [9.25, 40.15], [9.45, 39.55], [9.1, 40.55], [14.15, 37.55],
      [13.4, 37.85], [14.6, 37.4], [8.5, 44.55], [12.15, 43.1]
    ];
    for (i = 0; i < forestSeeds.length; i++) {
      p = toXY(forestSeeds[i][0], forestSeeds[i][1]);
      var trees = 22 + ((rnd() * 16) | 0);
      for (j = 0; j < trees; j++) {
        var tx = p.x + (rnd() - 0.5) * 70;
        var ty = p.y + (rnd() - 0.5) * 54;
        var tr = 3.6 + rnd() * 5.2;
        g.fillStyle = '#3a2a1c';
        g.fillRect(tx - 0.7, ty - 2, 1.4, 4);
        g.beginPath();
        g.ellipse(tx, ty - 4, tr * 0.85, tr * 1.15, 0, 0, Math.PI * 2);
        g.fillStyle = j % 2 ? '#2a4328' : '#1f3520';
        g.fill();
      }
    }

    if (!DEM) {
    var ridgePeaks = [
      [7.6, 45.9], [8.5, 46.1], [9.5, 46.15], [10.6, 46.25], [11.7, 46.4], [12.8, 46.5],
      [10.0, 44.1], [11.1, 43.5], [12.2, 42.6], [13.3, 41.7], [14.4, 40.9], [15.5, 40.1],
      [16.1, 39.2], [16.2, 38.3], [15.0, 37.75], [9.32, 40.0]
    ];
    for (i = 0; i < ridgePeaks.length; i++) {
      if (ridgePeaks[i][1] > 45.2) continue;
      if (!pointInMesh(ridgePeaks[i][0], ridgePeaks[i][1])) continue;
      p = toXY(ridgePeaks[i][0], ridgePeaks[i][1]);
      hv = heightAt(ridgePeaks[i][0], ridgePeaks[i][1]);
      sz = 10 + Math.min(26, hv * 3.2);
      g.save();
      g.translate(p.x, p.y);
      g.beginPath();
      g.moveTo(0, -sz);
      g.lineTo(-sz * 0.5, sz * 0.28);
      g.lineTo(sz * 0.48, sz * 0.22);
      g.closePath();
      var rg = g.createLinearGradient(0, -sz, 0, sz * 0.25);
      rg.addColorStop(0, hv > 5 ? '#eceae4' : '#c4c0b6');
      rg.addColorStop(0.4, '#7a746c');
      rg.addColorStop(1, '#4a463e');
      g.fillStyle = rg;
      g.fill();
      if (hv > 4.8) {
        g.beginPath();
        g.moveTo(0, -sz);
        g.lineTo(-sz * 0.16, -sz * 0.52);
        g.lineTo(sz * 0.14, -sz * 0.48);
        g.closePath();
        g.fillStyle = 'rgba(248, 247, 242, 0.9)';
        g.fill();
      }
      g.restore();
    }

    for (i = 0; i < 90; i++) {
      var mlon = box[0] + rnd() * (box[2] - box[0]);
      var mlat = box[1] + rnd() * (box[3] - box[1]);
      if (!pointInMesh(mlon, mlat)) continue;
      hv = heightAt(mlon, mlat);
      if (hv < 3.15) continue;
      p = toXY(mlon, mlat);
      sz = 7 + Math.min(22, (hv - 3.1) * 6) + rnd() * 6;
      g.save();
      g.translate(p.x, p.y);
      g.rotate((rnd() - 0.5) * 0.45);
      g.beginPath();
      g.moveTo(0, -sz);
      g.lineTo(-sz * 0.48, sz * 0.28);
      g.lineTo(sz * 0.46, sz * 0.22);
      g.closePath();
      var mg = g.createLinearGradient(0, -sz, 0, sz * 0.25);
      mg.addColorStop(0, hv > 5.2 ? '#eceae4' : '#c8c4bc');
      mg.addColorStop(0.35, '#8a847c');
      mg.addColorStop(1, '#4e4a42');
      g.fillStyle = mg;
      g.fill();
      if (hv > 5.0) {
        g.beginPath();
        g.moveTo(0, -sz);
        g.lineTo(-sz * 0.16, -sz * 0.55);
        g.lineTo(sz * 0.14, -sz * 0.5);
        g.closePath();
        g.fillStyle = 'rgba(248, 247, 242, 0.9)';
        g.fill();
      }
      g.restore();
    }
    }

    g.restore();

    g.save();
    landPath();
    g.clip();
    g.lineCap = 'round';
    g.lineJoin = 'round';
    for (i = 0; i < RTW_RIVERS.length; i++) {
      var river = RTW_RIVERS[i];
      g.beginPath();
      p = toXY(river[0][0], river[0][1]);
      g.moveTo(p.x, p.y);
      for (j = 1; j < river.length; j++) {
        p = toXY(river[j][0], river[j][1]);
        g.lineTo(p.x, p.y);
      }
      g.strokeStyle = 'rgba(70, 140, 175, 0.55)';
      g.lineWidth = 3.6;
      g.stroke();
      g.strokeStyle = 'rgba(170, 220, 235, 0.42)';
      g.lineWidth = 1.5;
      g.stroke();
    }

    function strokeRoad(a, b, seed) {
      var pa = toXY(a.lon, a.lat), pb = toXY(b.lon, b.lat);
      var dx = pb.x - pa.x, dy = pb.y - pa.y;
      var dist = Math.hypot(dx, dy) || 1;
      var nx = -dy / dist, ny = dx / dist;
      var n = Math.max(4, Math.round(dist / 48));
      g.beginPath();
      g.moveTo(pa.x, pa.y);
      for (j = 1; j < n; j++) {
        var t = j / n;
        var bend = Math.sin(t * Math.PI * 2.4 + seed) * Math.min(18, dist * 0.08);
        g.lineTo(pa.x + dx * t + nx * bend, pa.y + dy * t + ny * bend);
      }
      g.lineTo(pb.x, pb.y);
    }
    for (i = 0; i < RTW_ROADS.length; i++) {
      var ca = cityByName(RTW_ROADS[i][0]);
      var cb = cityByName(RTW_ROADS[i][1]);
      if (!ca || !cb) continue;
      strokeRoad(ca, cb, i * 1.37);
      g.strokeStyle = 'rgba(70, 58, 40, 0.42)';
      g.lineWidth = 2.4;
      g.stroke();
      g.strokeStyle = 'rgba(168, 148, 108, 0.28)';
      g.lineWidth = 1;
      g.stroke();
    }
    g.restore();

    return c;
  }

  function placeArmy(a, u) {
    var lon = a.from.lon + (a.to.lon - a.from.lon) * u;
    var lat = a.from.lat + (a.to.lat - a.from.lat) * u;
    a.mesh.position.set((lon - three.cx) * three.scale, worldH(lon, lat) + 1.15, -(lat - three.cy) * three.scale);
  }

  function loopThree() {
    if (!three.built) { three.raf = 0; return; }
    var now = performance.now();
    var dt = Math.min(0.05, (now - (loopThree.last || now)) / 1000);
    loopThree.last = now;
    var t = (now * 0.00018) % 2;
    var u = t < 1 ? t : 2 - t;
    if (three.armies[0]) { placeArmy(three.armies[0], u); placeArmy(three.armies[1], u); }
    if (three.units && three.units.tick) three.units.tick(dt);
    else {
      if (three.walker) three.walker.tick(dt);
      if (three.npc) three.npc.tick(dt);
    }
    three.renderer.render(three.scene, three.camera);
    three.raf = requestAnimationFrame(loopThree);
  }

  canvas.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  });
  view5.addEventListener('mousedown', function (e) {
    if (!three.built || e.button !== 0) return;
    if (!allowPan) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    if (three.built && !allowPan) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (!three.built) { panX += dx; panY += dy; }
    else panThreeByMouse(dx, dy);
  });
  window.addEventListener('mouseup', function () {
    dragging = false;
    canvas.classList.remove('dragging');
  });
  function onWheel(e) {
    e.preventDefault();
    var f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    setZoom(zoom * f, e.clientX, e.clientY);
  }
  canvas.addEventListener('wheel', onWheel, { passive: false });
  view5.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'KeyQ') { e.preventDefault(); nudgeTilt(-TILT_STEP); }
    else if (e.code === 'KeyE') { e.preventDefault(); nudgeTilt(TILT_STEP); }
    else if (e.code === 'KeyZ') { e.preventDefault(); nudgeYaw(-YAW_STEP); }
    else if (e.code === 'KeyC') { e.preventDefault(); nudgeYaw(YAW_STEP); }
  });
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'camera-tilt') {
      if (typeof e.data.delta === 'number') nudgeTilt(e.data.delta);
      else if (typeof e.data.deg === 'number') { tiltDeg = e.data.deg; nudgeTilt(0); }
    }
    if (e.data.type === 'camera-rotate') {
      if (typeof e.data.delta === 'number') nudgeYaw(e.data.delta);
      else if (typeof e.data.deg === 'number') { yawDeg = wrapYaw(e.data.deg); nudgeYaw(0); }
    }
    if (e.data.type === 'camera-state-request') {
      try {
        window.parent.postMessage({
          type: 'camera-state',
          center: { lon: 12.5, lat: 42.0 },
          viewQuad: [
            { lon: bbox[0], lat: bbox[3] }, { lon: bbox[2], lat: bbox[3] },
            { lon: bbox[2], lat: bbox[1] }, { lon: bbox[0], lat: bbox[1] }
          ]
        }, '*');
      } catch (_) {}
    }
  });
  window.addEventListener('resize', function () {
    resizeCanvas();
    if (three.renderer) {
      var w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
      three.renderer.setSize(w, h, false);
      three.camera.aspect = w / h;
      three.camera.updateProjectionMatrix();
      applyThreeCamera();
    }
  });

  function resetThree() {
    if (three.raf) cancelAnimationFrame(three.raf);
    three.raf = 0;
    if (three.units && three.units.dispose) three.units.dispose();
    else {
      if (three.walker && three.walker.dispose) three.walker.dispose();
      if (three.npc && three.npc.dispose) three.npc.dispose();
    }
    three.units = null;
    three.walker = null;
    three.npc = null;
    cityMarks = [];
    cityRay = null;
    cityNdc = null;
    if (three.renderer) {
      try { three.renderer.dispose(); } catch (_) {}
      three.renderer = null;
    }
    three.land = null;
    three.scene = null;
    three.camera = null;
    three.landMat = null;
    three.armies = [];
    three.built = false;
    allowPan = true;
    hideBattleDialog();
    view5.innerHTML = '';
  }

  function markReady(note) {
    ready = true;
    if (!three.built) startThree();
    else showLayers();
    setStatus(note || ((mode === 5 ? 'Вид 5' : 'Вид 4') + ' · колесо — зум · Q / E — наклон'));
  }

  resizeCanvas();
  updateHud();
  useFallbackOutline();
  loopCanvas();

  function resolvePaintView() {
    try {
      var v = Number(localStorage.getItem('campaignMapVariant'));
      if (v === 4 || v === 5) return v;
    } catch (_) {}
    return mode === 5 ? 5 : 4;
  }

  var paintBoot = (window.MapPaint && MapPaint.setView)
    ? MapPaint.setView(resolvePaintView())
    : Promise.resolve(false);

  paintBoot.then(function () {
    return Promise.all([
    loadDemImage(),
    window.ItalyDEM ? ItalyDEM.load() : Promise.resolve(false),
    fetchFirst(GEO_URLS).then(function (geo) {
      extractItaly(geo);
      return true;
    }).catch(function () { return false; })
  ]);
  }).then(function (parts) {
    if (parts[0] && DEM) bbox = DEM_BBOX.slice();
    applyMode();
    var note = (mode === 5 ? 'Вид 5' : 'Вид 4');
    if (parts[0]) note += ' · рельеф SRTM';
    markReady(note + ' · колесо — зум · Q / E — наклон');
  });
})();
  </script>
</body>
</html>
