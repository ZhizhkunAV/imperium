<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вид 2 — 3D провинции</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1e3a28; }
    #c { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #c.dragging { cursor: grabbing; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 20; min-width: 168px;
      padding: 8px 12px; background: rgba(12, 10, 6, 0.78);
      border: 1px solid rgba(201, 168, 76, 0.5); color: #efe4d0;
      font-family: 'EB Garamond', Georgia, serif; font-size: 13px; pointer-events: none;
    }
    #hud strong { font-family: 'Cinzel', serif; color: #f0d78a; letter-spacing: 0.06em; }
    #hud .row { display: flex; justify-content: space-between; gap: 14px; font-size: 11px; margin-top: 3px; }
    #hud span { color: #a89068; text-transform: uppercase; letter-spacing: 0.08em; }
    #hud b { font-family: 'Cinzel', serif; color: #f5ead0; }
    #status { margin-top: 6px; color: #c8b890; font-size: 12px; }
    #hint { margin-top: 4px; color: #8a7858; font-size: 11px; }
  </style>
  <script src="/maps/rome/three.min.js"></script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hud">
  <strong>Вид 2 · 3D провинции</strong>
  <div id="status">Сборка 3D-карты…</div>
  <div id="hint">ЛКМ — пан / город · ПКМ — ход · Q/E наклон · Z/C поворот · колесо зум</div>
  <div class="row"><span>Зум</span><b id="hudZoom">200%</b></div>
  <div class="row"><span>Наклон</span><b id="hudTilt">80%</b></div>
  <div class="row"><span>Поворот</span><b id="hudYaw">0°</b></div>
</div>
<script src="/js/italy-dem.js"></script>
<script src="/js/walk-unit-three.js"></script>
<script src="/maps/view14/provinces.js"></script>
<script src="/js/campaign-map-bridge.js"></script>
<script>
(function () {
  'use strict';
  var PROVS = window.View14Provinces || [];
  var ROADS = window.View14Roads || [];
  var Bridge = window.CampaignMapBridge || null;
  var canvas = document.getElementById('c');
  var statusEl = document.getElementById('status');
  var BOX = [6.4, 36.2, 18.9, 47.4];
  var CX = 12.48, CY = 41.89, SCALE = 33;
  var TILT_MIN = 0, TILT_MAX = 75, TILT_STEP = 3, YAW_STEP = 6;
  var MIN_ZOOM = 0.18, MAX_ZOOM = 3.4, BASE_DIST = 48;
  var camTilt = 62, camZoom = 1.05, camYaw = 0;
  var target = { x: 0, y: 2.2, z: 0 };
  var dragging = false, lastX = 0, lastY = 0, allowPan = true;
  var campaignSync = null;
  var geoFeatures = null;
  var three = { renderer: null, scene: null, camera: null, raf: 0, walker: null, units: null, land: null };
  var cityMarks = [];
  var selectedCityId = null;
  var cityRay = new THREE.Raycaster();
  var cityNdc = new THREE.Vector2();

  function setStatus(t) { statusEl.textContent = t; }
  function wrapYaw(d) { d %= 360; return d < 0 ? d + 360 : d; }
  function updateHud() {
    document.getElementById('hudZoom').textContent = Math.round(camZoom * 200) + '%';
    document.getElementById('hudTilt').textContent = Math.round((camTilt / TILT_MAX) * 100) + '%';
    document.getElementById('hudYaw').textContent = Math.round(wrapYaw(camYaw)) + '°';
  }
  function xz(lon, lat) { return { x: (lon - CX) * SCALE, z: (CY - lat) * SCALE }; }
  function worldH(lon, lat) {
    var m = window.ItalyDEM && ItalyDEM.ready() ? ItalyDEM.meters(lon, lat) : 120;
    if (!(m > 8)) return 0.04;
    // сильнее рельеф, чтобы карта не выглядела плоскостью
    return 0.22 + m / 3000 * 22;
  }
  function demM(lon, lat) {
    if (!(window.ItalyDEM && ItalyDEM.ready())) return 120;
    var m = ItalyDEM.meters(lon, lat);
    return m == null ? 0 : m;
  }
  function isLand(lon, lat) { return demM(lon, lat) > 8; }
  function worldToLonLat(x, z) { return { lon: x / SCALE + CX, lat: CY - z / SCALE }; }
  function lonLatToWorld(lon, lat, lift) {
    var p = xz(lon, lat);
    return new THREE.Vector3(p.x, worldH(lon, lat) + (lift == null ? 0.12 : lift), p.z);
  }

  function applyCam() {
    if (!three.camera) return;
    var dist = BASE_DIST / camZoom;
    var a = camTilt * Math.PI / 180;
    var yaw = camYaw * Math.PI / 180;
    three.camera.position.set(
      target.x + Math.sin(yaw) * dist * Math.cos(a),
      target.y + Math.max(5, dist * Math.sin(a)),
      target.z + Math.cos(yaw) * dist * Math.cos(a)
    );
    three.camera.lookAt(target.x, target.y, target.z);
    updateHud();
  }

  function reportCamera() {
    try {
      window.parent.postMessage({
        type: 'camera-state',
        center: { lon: target.x / SCALE + CX, lat: CY - target.z / SCALE },
        viewQuad: [
          { lon: BOX[0], lat: BOX[3] }, { lon: BOX[2], lat: BOX[3] },
          { lon: BOX[2], lat: BOX[1] }, { lon: BOX[0], lat: BOX[1] }
        ]
      }, '*');
    } catch (_) {}
  }

  function fetchFirst(urls) {
    var i = 0;
    function next() {
      if (i >= urls.length) return Promise.resolve(null);
      var url = urls[i++];
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error('HTTP');
        return r.json();
      }).catch(function () { return next(); });
    }
    return next();
  }

  /** Подвыборка кольца GeoJSON → сегменты поверх DEM (без моря). */
  function ringToLandSegments(ring, maxPts) {
    if (!ring || ring.length < 2) return [];
    maxPts = maxPts || 220;
    var step = Math.max(1, Math.floor(ring.length / maxPts));
    var segs = [], cur = [], i, lon, lat, pt;
    for (i = 0; i < ring.length; i += step) {
      pt = ring[i];
      lon = pt[0]; lat = pt[1];
      if (!isLand(lon, lat)) {
        if (cur.length >= 2) segs.push(cur);
        cur = [];
        continue;
      }
      cur.push(lonLatToWorld(lon, lat, 0.12));
    }
    // замкнуть кольцо, если оба конца на суше
    if (cur.length >= 2 && ring.length > 2) {
      pt = ring[0];
      if (isLand(pt[0], pt[1])) cur.push(lonLatToWorld(pt[0], pt[1], 0.12));
    }
    if (cur.length >= 2) segs.push(cur);
    return segs;
  }

  function addLineStrip(scene, pts, color, opacity, linewidth) {
    if (!pts || pts.length < 2) return;
    var geo = new THREE.BufferGeometry().setFromPoints(pts);
    var mat = new THREE.LineBasicMaterial({
      color: color, transparent: true, opacity: opacity,
      depthWrite: false, linewidth: linewidth || 1
    });
    var line = new THREE.Line(geo, mat);
    line.renderOrder = 3;
    scene.add(line);
  }

  function addTubeStrip(scene, pts, color, radius, opacity) {
    if (!pts || pts.length < 2) return;
    var curve = new THREE.CatmullRomCurve3(pts);
    curve.tension = 0.25;
    var segs = Math.max(8, Math.min(120, pts.length * 2));
    var mesh = new THREE.Mesh(
      new THREE.TubeGeometry(curve, segs, radius, 5, false),
      new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacity == null ? 0.9 : opacity })
    );
    mesh.renderOrder = 2;
    scene.add(mesh);
  }

  /** Границы регионов View1 — cyan/teal glow поверх террейна (трубы, не Line — linewidth в WebGL часто игнор). */
  function addGeojsonBorders(scene, fc) {
    if (!fc || !fc.features) return 0;
    var n = 0;
    var maxPts = (fc.features.length > 30) ? 100 : 160;
    fc.features.forEach(function (f) {
      var g = f.geometry;
      if (!g) return;
      var polys = g.type === 'Polygon' ? [g.coordinates]
        : (g.type === 'MultiPolygon' ? g.coordinates : null);
      if (!polys) return;
      polys.forEach(function (poly) {
        if (!poly || !poly[0]) return;
        var segs = ringToLandSegments(poly[0], maxPts);
        segs.forEach(function (pts) {
          if (pts.length < 2) return;
          addTubeStrip(scene, pts, 0x3aa0ff, 0.11, 0.45);
          addTubeStrip(scene, pts, 0x9ae0ff, 0.05, 0.95);
          n++;
        });
      });
    });
    return n;
  }

  /** Границы провинций кампании (View14) — на том же xz/worldH, что и меш. */
  function addCampaignBorders(scene) {
    var FACS = window.View14Factions || {};
    var seeds = [];
    PROVS.forEach(function (pr, i) {
      if (pr.hidden || !pr.city) return;
      seeds.push({ i: i, pr: pr, lon: pr.lon, lat: pr.lat, faction: pr.faction });
    });
    if (seeds.length < 2) return;

    function nearestTwo(lon, lat) {
      var a = -1, b = -1, da = 1e9, db = 1e9, s, d, dlon, dlat;
      for (s = 0; s < seeds.length; s++) {
        dlon = (lon - seeds[s].lon) * 0.72;
        dlat = lat - seeds[s].lat;
        d = dlon * dlon + dlat * dlat;
        if (d < da) { db = da; b = a; da = d; a = s; }
        else if (d < db) { db = d; b = s; }
      }
      return { a: a, b: b, da: Math.sqrt(da), db: Math.sqrt(db) };
    }

    function chaikin(pts, iterations) {
      var cur = pts, it, next, i, a, b;
      for (it = 0; it < iterations; it++) {
        if (cur.length < 2) break;
        next = [cur[0]];
        for (i = 0; i < cur.length - 1; i++) {
          a = cur[i]; b = cur[i + 1];
          next.push({ lon: a.lon * 0.75 + b.lon * 0.25, lat: a.lat * 0.75 + b.lat * 0.25 });
          next.push({ lon: a.lon * 0.25 + b.lon * 0.75, lat: a.lat * 0.25 + b.lat * 0.75 });
        }
        next.push(cur[cur.length - 1]);
        cur = next;
      }
      return cur;
    }

    function sampleBisector(sa, sb) {
      var A = seeds[sa], B = seeds[sb];
      var midLon = (A.lon + B.lon) * 0.5, midLat = (A.lat + B.lat) * 0.5;
      var dx = (B.lon - A.lon) * 0.72, dy = B.lat - A.lat;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var px = (-dy / len) / 0.72, py = dx / len;
      var maxT = Math.max(2.0, len * 2.6), dt = 0.045;
      var raw = [], t, lon, lat, nn, lo, hi;
      for (t = -maxT; t <= maxT; t += dt) {
        lon = midLon + px * t;
        lat = midLat + py * t;
        if (lon < BOX[0] - 0.15 || lon > BOX[2] + 0.15 || lat < BOX[1] - 0.15 || lat > BOX[3] + 0.15) continue;
        if (!isLand(lon, lat) || demM(lon, lat) > 1350) {
          if (raw.length && raw[raw.length - 1] !== null) raw.push(null);
          continue;
        }
        nn = nearestTwo(lon, lat);
        lo = Math.min(nn.a, nn.b); hi = Math.max(nn.a, nn.b);
        if (lo !== Math.min(sa, sb) || hi !== Math.max(sa, sb) || Math.abs(nn.db - nn.da) > 0.12) {
          if (raw.length && raw[raw.length - 1] !== null) raw.push(null);
          continue;
        }
        raw.push({ lon: lon, lat: lat });
      }
      var segs = [], cur = [];
      raw.forEach(function (p) {
        if (!p) { if (cur.length >= 4) segs.push(cur); cur = []; }
        else cur.push(p);
      });
      if (cur.length >= 4) segs.push(cur);
      return segs;
    }

    function refine(seg) {
      if (seg.length < 3) return [];
      var thinned = [seg[0]], i, prev = seg[0], dlon, dlat, d;
      for (i = 1; i < seg.length; i++) {
        dlon = (seg[i].lon - prev.lon) * 0.72;
        dlat = seg[i].lat - prev.lat;
        d = Math.sqrt(dlon * dlon + dlat * dlat);
        if (d >= 0.08 || i === seg.length - 1) {
          thinned.push(seg[i]);
          prev = seg[i];
        }
      }
      if (thinned.length < 3) return [];
      var smooth = chaikin(thinned, 3);
      var world = [];
      for (i = 0; i < smooth.length; i++) {
        if (!isLand(smooth[i].lon, smooth[i].lat)) continue;
        world.push({ lon: smooth[i].lon, lat: smooth[i].lat });
      }
      if (world.length < 3) return [];
      // уплотнить и каждый шаг взять высоту с DEM — труба не «режет» горы по воздуху
      var dense = [], j, t, lon, lat;
      for (i = 0; i < world.length - 1; i++) {
        dense.push(lonLatToWorld(world[i].lon, world[i].lat, 0.18));
        for (j = 1; j <= 3; j++) {
          t = j / 4;
          lon = world[i].lon + (world[i + 1].lon - world[i].lon) * t;
          lat = world[i].lat + (world[i + 1].lat - world[i].lat) * t;
          if (!isLand(lon, lat)) continue;
          dense.push(lonLatToWorld(lon, lat, 0.18));
        }
      }
      dense.push(lonLatToWorld(world[world.length - 1].lon, world[world.length - 1].lat, 0.18));
      return dense.length >= 3 ? dense : [];
    }

    function factionHex(fid) {
      var f = FACS[fid];
      if (f && f.border) return new THREE.Color(f.border).getHex();
      if (fid === 'carthage') return 0xf2efe6;
      if (fid === 'greek') return 0xd4a830;
      return 0xc42828;
    }

    var i, j, segs, si, pts, same, colA, colB;
    for (i = 0; i < seeds.length; i++) {
      for (j = i + 1; j < seeds.length; j++) {
        segs = sampleBisector(i, j);
        same = seeds[i].faction === seeds[j].faction;
        colA = factionHex(seeds[i].faction);
        colB = factionHex(seeds[j].faction);
        for (si = 0; si < segs.length; si++) {
          pts = refine(segs[si]);
          if (pts.length < 3) continue;
          if (same) {
            addTubeStrip(scene, pts, colA, 0.2, 0.95);
          } else {
            // двойная линия на границе фракций
            addTubeStrip(scene, pts, colA, 0.16, 0.92);
            addTubeStrip(scene, pts.map(function (v, idx) {
              var n = pts[Math.min(pts.length - 1, idx + 1)] || v;
              var dx = n.x - v.x, dz = n.z - v.z;
              var len = Math.sqrt(dx * dx + dz * dz) || 1;
              return new THREE.Vector3(v.x - dz / len * 0.28, v.y, v.z + dx / len * 0.28);
            }), colB, 0.16, 0.92);
          }
        }
      }
    }
  }

  function addStraightRoad(scene, a, b) {
    var steps = 18, pts = [], i, t, lon, lat, pp;
    for (i = 0; i <= steps; i++) {
      t = i / steps;
      lon = a.lon + (b.lon - a.lon) * t;
      lat = a.lat + (b.lat - a.lat) * t;
      if (!(demM(lon, lat) > 10)) continue;
      pp = xz(lon, lat);
      pts.push(new THREE.Vector3(pp.x, worldH(lon, lat) + 0.1, pp.z));
    }
    if (pts.length < 2) return;
    addTubeStrip(scene, pts, 0xc4a56a, 0.14, 0.95);
  }

  function addCity(scene, city) {
    if (!city || city.lon == null) return null;
    var p = xz(city.lon, city.lat);
    var y = worldH(city.lon, city.lat);
    var s = (city.capital ? 1.2 : 1) * 1.7;
    var root = new THREE.Group();
    root.position.set(p.x, y, p.z);

    var wall = new THREE.MeshPhongMaterial({ color: 0xd8cbb0, shininess: 8 });
    var roof = new THREE.MeshPhongMaterial({ color: 0xa84828, shininess: 12 });
    var b1 = new THREE.Mesh(new THREE.BoxGeometry(0.7 * s, 0.45 * s, 0.55 * s), wall);
    b1.position.set(-0.2 * s, 0.22 * s, 0);
    b1.castShadow = true;
    root.add(b1);
    var r1 = new THREE.Mesh(new THREE.ConeGeometry(0.5 * s, 0.28 * s, 4), roof);
    r1.rotation.y = Math.PI / 4;
    r1.position.set(-0.2 * s, 0.55 * s, 0);
    root.add(r1);
    var b2 = new THREE.Mesh(new THREE.BoxGeometry(0.5 * s, 0.35 * s, 0.45 * s), wall);
    b2.position.set(0.35 * s, 0.18 * s, 0.1 * s);
    root.add(b2);

    var banner = city.faction === 'greek' ? 0x6a3d8a
      : (city.faction === 'carthage' ? 0x9a3a32 : 0xa03030);
    var pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03 * s, 0.04 * s, 1.4 * s, 5),
      new THREE.MeshPhongMaterial({ color: 0xc9b070 })
    );
    pole.position.set(0.75 * s, 0.7 * s, 0);
    root.add(pole);
    var flag = new THREE.Mesh(
      new THREE.BoxGeometry(0.45 * s, 0.55 * s, 0.03 * s),
      new THREE.MeshPhongMaterial({ color: banner })
    );
    flag.position.set(0.98 * s, 1.15 * s, 0);
    root.add(flag);

    var ring = new THREE.Mesh(
      new THREE.RingGeometry(0.9 * s, 1.1 * s, 32),
      new THREE.MeshBasicMaterial({
        color: 0x3aa0ff, transparent: true, opacity: 0.9,
        side: THREE.DoubleSide, depthWrite: false
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.04;
    ring.visible = false;
    root.add(ring);

    var hit = new THREE.Mesh(
      new THREE.CylinderGeometry(1.1 * s, 1.1 * s, 1.8 * s, 10),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hit.position.y = 0.7 * s;
    hit.userData.isCityHit = true;
    root.add(hit);
    scene.add(root);

    var lc = document.createElement('canvas');
    lc.width = 256; lc.height = 48;
    var lg = lc.getContext('2d');
    lg.fillStyle = city.faction === 'greek' ? '#6a3d8a' : (city.faction === 'carthage' ? '#9a3a32' : '#a03030');
    lg.fillRect(0, 4, 256, 40);
    lg.strokeStyle = 'rgba(122, 212, 255, 0.65)';
    lg.strokeRect(1, 5, 254, 38);
    lg.fillStyle = '#f4fbff';
    lg.font = 'bold 26px Cinzel, Georgia, serif';
    lg.textAlign = 'center';
    lg.textBaseline = 'middle';
    lg.fillText((city.ru || city.name || '').toUpperCase(), 128, 24);
    var tex = new THREE.Texture(lc);
    tex.needsUpdate = true;
    var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    spr.scale.set(city.capital ? 8.5 : 6.8, city.capital ? 1.6 : 1.25, 1);
    spr.position.set(p.x, y + (city.capital ? 3.4 : 2.6), p.z);
    scene.add(spr);

    var cName = (Bridge && Bridge.campaignName) ? Bridge.campaignName(city.name) : city.name;
    var mark = {
      id: city.name,
      city: city,
      root: root,
      ring: ring,
      hit: hit,
      label: spr,
      campaignName: cName
    };
    cityMarks.push(mark);
    return mark;
  }

  function setCitySelected(mark) {
    selectedCityId = mark ? mark.id : null;
    cityMarks.forEach(function (m) { m.ring.visible = !!(mark && m.id === mark.id); });
  }

  function pickCity(e) {
    if (!three.camera || !cityMarks.length) return null;
    var rect = canvas.getBoundingClientRect();
    cityNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    cityNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    cityRay.setFromCamera(cityNdc, three.camera);
    var hits = [];
    cityMarks.forEach(function (m) {
      var h = cityRay.intersectObject(m.hit, false);
      if (h && h.length) hits.push({ mark: m, dist: h[0].distance });
    });
    if (!hits.length) return null;
    hits.sort(function (a, b) { return a.dist - b.dist; });
    return hits[0].mark;
  }

  function openCityPanel(mark) {
    if (!mark) return;
    setCitySelected(mark);
    setStatus('Город: ' + (mark.city.ru || mark.city.name));
    if (Bridge) Bridge.postCitySelect(Bridge.selectCityPayload(mark.city));
  }

  function closeCityPanel() {
    setCitySelected(null);
    if (Bridge) Bridge.postCityDeselect();
  }

  function buildScene() {
    cityMarks = [];
    var w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(w, h, false);
    renderer.setClearColor(0x1e3a28, 1);
    renderer.shadowMap.enabled = true;

    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x6a8a58, 140, 480);
    var camera = new THREE.PerspectiveCamera(42, w / h, 0.3, 1600);
    scene.add(new THREE.HemisphereLight(0xe8f0c8, 0x3a4030, 0.55));
    var sun = new THREE.DirectionalLight(0xfff0d0, 1.15);
    sun.position.set(-36, 48, 28);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1536, 1536);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x6a7858, 0.34));

    var sea = new THREE.Mesh(
      new THREE.PlaneGeometry(900, 900),
      new THREE.MeshPhongMaterial({ color: 0x245a48, shininess: 18, transparent: true, opacity: 0.94 })
    );
    sea.rotation.x = -Math.PI / 2;
    sea.position.y = -0.2;
    sea.receiveShadow = true;
    scene.add(sea);

    var meshData = (window.ItalyDEM && ItalyDEM.ready() && ItalyDEM.buildHeightMesh)
      ? ItalyDEM.buildHeightMesh({
        box: BOX,
        cols: 400,
        rows: 460,
        sea: 8,
        coastY: 0.05,
        toXZ: xz,
        height: function (lon, lat, m) { return 0.22 + m / 3000 * 22; }
      })
      : { positions: [0, 0, 0, 1, 0, 0, 0, 0, 1], uvs: [0, 0, 1, 0, 0, 1], indices: [0, 2, 1] };

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(meshData.positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(meshData.uvs, 2));
    geo.setIndex(meshData.indices);
    geo.computeVertexNormals();

    var paintCanvas = (window.ItalyDEM && ItalyDEM.paintGeo)
      ? ItalyDEM.paintGeo(1536, 1536, BOX, { sea: '#245a48' })
      : (function () {
        var c = document.createElement('canvas');
        c.width = 8; c.height = 8;
        var g = c.getContext('2d');
        g.fillStyle = '#6a7a50';
        g.fillRect(0, 0, 8, 8);
        return c;
      })();
    var tex = new THREE.Texture(paintCanvas);
    tex.needsUpdate = true;
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter || THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

    var land = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      map: tex, shininess: 4, specular: 0x11110c
    }));
    land.receiveShadow = true;
    land.castShadow = true;
    land.name = 'italyLand';
    scene.add(land);

    // провинции кампании — те же координаты, что рельеф (без съехавшего GeoJSON)
    addCampaignBorders(scene);
    setStatus('Готово · границы провинций на рельефе');

    var cities = (Bridge && Bridge.getCities)
      ? Bridge.getCities(campaignSync)
      : [];
    if (!cities.length) {
      PROVS.forEach(function (pr) {
        if (pr.hidden || !pr.city) return;
        cities.push({
          name: (Bridge && Bridge.campaignName) ? Bridge.campaignName(pr.city) : pr.city,
          ru: pr.cityRu || pr.city,
          lon: pr.lon, lat: pr.lat,
          faction: (Bridge && Bridge.factionToCampaign) ? Bridge.factionToCampaign(pr.faction) : 'rome',
          capital: !!pr.capital
        });
      });
    }
    cities.forEach(function (c) { addCity(scene, c); });

    var byName = {};
    cities.forEach(function (c) {
      byName[c.name] = c;
      if (c.ru) byName[c.ru] = c;
    });
    PROVS.forEach(function (pr) {
      if (pr.city) {
        var cn = (Bridge && Bridge.campaignName) ? Bridge.campaignName(pr.city) : pr.city;
        if (!byName[pr.city] && byName[cn]) byName[pr.city] = byName[cn];
        if (!byName[cn] && byName[pr.city]) byName[cn] = byName[pr.city];
      }
    });

    var roadLinks = (Bridge && Bridge.getRoads) ? Bridge.getRoads(campaignSync) : ROADS;
    (roadLinks || []).forEach(function (pair) {
      var aName = pair[0], bName = pair[1];
      var a = byName[aName], b = byName[bName];
      if (!a || !b) return;
      addStraightRoad(scene, a, b);
    });

    if (Bridge && Bridge.addResourceMeshesThree) {
      Bridge.addResourceMeshesThree(
        THREE, scene, Bridge.getResources(campaignSync),
        xz, worldH, 1.5
      );
    }

    three.renderer = renderer;
    three.scene = scene;
    three.camera = camera;
    three.land = land;

    function handleCityClick(e) {
      var mark = pickCity(e);
      if (!mark) { closeCityPanel(); return false; }
      openCityPanel(mark);
      return true;
    }

    function pickLonLatFromEvent(e) {
      if (!three.camera || !three.land) return null;
      var rect = canvas.getBoundingClientRect();
      var ndc = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      var ray = new THREE.Raycaster();
      ray.setFromCamera(ndc, three.camera);
      var hits = ray.intersectObject(three.land, false);
      if (!hits || !hits.length) return null;
      return worldToLonLat(hits[0].point.x, hits[0].point.z);
    }

    function hidePlayerArmy() {
      if (!three.units || !three.units.player) return;
      three.units.player.setSelected(false);
      three.units.player.root.visible = false;
    }
    function showPlayerArmyAt(lon, lat, armyId) {
      if (!three.units || !three.units.player) return;
      var p = xz(lon, lat);
      three.units.player.root.visible = true;
      three.units.player.root.position.set(p.x, worldH(lon, lat) + 0.08, p.z);
      if (three.units.player.setArmyId) three.units.player.setArmyId(armyId);
      three.units.player.setSelected(true);
    }

    if (window.WalkUnitThree && WalkUnitThree.mountPair) {
      var fieldArmyId = 'field_near_rome';
      var armyStart = xz(12.35, 41.78);
      try {
        var CS0 = Bridge && Bridge.parentCS ? Bridge.parentCS()
          : (window.parent && window.parent.CampaignState);
        if (CS0 && CS0.state.fieldArmies && CS0.state.fieldArmies[0]) {
          fieldArmyId = CS0.state.fieldArmies[0].id;
        }
        var fa = CS0 && CS0.getFieldArmy && CS0.getFieldArmy(fieldArmyId);
        if (fa) armyStart = xz(fa.lon, fa.lat);
      } catch (_) {}

      var extras = (Bridge && Bridge.fieldArmyMountExtras)
        ? Bridge.fieldArmyMountExtras({
          pickLonLat: pickLonLatFromEvent,
          pickCityName: function (e) {
            var mark = pickCity(e);
            return mark && mark.campaignName ? mark.campaignName : null;
          },
          worldToLonLat: worldToLonLat,
          getFieldArmyId: function () { return fieldArmyId; },
          setFieldArmyId: function (id) { fieldArmyId = id; },
          showArmy: showPlayerArmyAt,
          hideArmy: hidePlayerArmy,
          getPlayer: function () { return three.units && three.units.player; },
          setStatus: setStatus
        })
        : {};

      three.units = WalkUnitThree.mountPair({
        THREE: THREE,
        scene: scene,
        camera: camera,
        canvas: canvas,
        land: land,
        hover: 0.08,
        scale: 2.0,
        speed: 9,
        combatStop: 1.8,
        armyId: fieldArmyId,
        playerStart: armyStart,
        npcStart: xz(14.08, 41.18),
        getHeight: function (x, z) {
          return worldH(x / SCALE + CX, CY - z / SCALE);
        },
        canWalk: function (x, z) {
          var lon = x / SCALE + CX, lat = CY - z / SCALE;
          var m = demM(lon, lat);
          if (!(m > 12)) return 'Сюда нельзя: море';
          if (m > 1500) return 'Сюда нельзя: высокие горы';
          return true;
        },
        setPanEnabled: function (on) { allowPan = on; },
        onMapClick: handleCityClick,
        beforeRmbMove: extras.beforeRmbMove,
        resolveEnterCity: extras.resolveEnterCity,
        onSelect: extras.onSelect,
        onArrive: extras.onArrive,
        follow: function (x, y, z) {
          target.x += (x - target.x) * 0.07;
          target.y += (y - target.y) * 0.07;
          target.z += (z - target.z) * 0.07;
        },
        onStatus: setStatus
      });
      three.walker = three.units.player;
    }

    applyCam();
    setStatus('Готово · клик по городу · ПКМ — ход армии');
  }

  function loop() {
    if (!three.renderer) return;
    var now = performance.now();
    var dt = Math.min(0.05, (now - (loop.last || now)) / 1000);
    loop.last = now;
    if (three.units) three.units.tick(dt);
    else if (three.walker) three.walker.tick(dt);
    cityMarks.forEach(function (m) {
      if (m.ring.visible) m.ring.rotation.z += dt * 0.7;
    });
    applyCam();
    three.renderer.render(three.scene, three.camera);
    three.raf = requestAnimationFrame(loop);
  }

  function onResize() {
    if (!three.renderer || !three.camera) return;
    var w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    three.camera.aspect = w / h;
    three.camera.updateProjectionMatrix();
    three.renderer.setSize(w, h, false);
  }

  var cityClick = { x: 0, y: 0, moved: false, pending: false };
  canvas.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    cityClick.x = e.clientX;
    cityClick.y = e.clientY;
    cityClick.moved = false;
    cityClick.pending = true;
    if (pickCity(e)) { allowPan = false; return; }
    if (!allowPan) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', function (e) {
    if (cityClick.pending) {
      var cdx = e.clientX - cityClick.x, cdy = e.clientY - cityClick.y;
      if (cdx * cdx + cdy * cdy > 36) cityClick.moved = true;
    }
    if (!dragging || !allowPan) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    var yaw = camYaw * Math.PI / 180;
    var k = 0.045 / camZoom;
    target.x -= (Math.cos(yaw) * dx + Math.sin(yaw) * dy) * k;
    target.z -= (-Math.sin(yaw) * dx + Math.cos(yaw) * dy) * k;
  });
  window.addEventListener('mouseup', function (e) {
    dragging = false;
    canvas.classList.remove('dragging');
    if (cityClick.pending && !cityClick.moved) {
      var mark = pickCity(e);
      if (mark) openCityPanel(mark);
      else closeCityPanel();
    }
    cityClick.pending = false;
    allowPan = true;
  });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    camZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camZoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    applyCam();
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'KeyQ') { e.preventDefault(); camTilt = Math.max(TILT_MIN, camTilt - TILT_STEP); }
    else if (e.code === 'KeyE') { e.preventDefault(); camTilt = Math.min(TILT_MAX, camTilt + TILT_STEP); }
    else if (e.code === 'KeyZ') { e.preventDefault(); camYaw = wrapYaw(camYaw - YAW_STEP); }
    else if (e.code === 'KeyC') { e.preventDefault(); camYaw = wrapYaw(camYaw + YAW_STEP); }
  });
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'campaign-sync') {
      campaignSync = e.data.state;
      return;
    }
    if (e.data.type === 'camera-tilt') {
      if (typeof e.data.delta === 'number') camTilt = Math.max(TILT_MIN, Math.min(TILT_MAX, camTilt + e.data.delta));
      else if (typeof e.data.deg === 'number') camTilt = Math.max(TILT_MIN, Math.min(TILT_MAX, e.data.deg));
    }
    if (e.data.type === 'camera-rotate') {
      if (typeof e.data.delta === 'number') camYaw = wrapYaw(camYaw + e.data.delta);
      else if (typeof e.data.deg === 'number') camYaw = wrapYaw(e.data.deg);
    }
    if (e.data.type === 'camera-goto' && typeof e.data.lon === 'number' && typeof e.data.lat === 'number') {
      var p = xz(e.data.lon, e.data.lat);
      target.x = p.x;
      target.z = p.z;
      target.y = worldH(e.data.lon, e.data.lat) + 1.2;
      applyCam();
    }
    if (e.data.type === 'camera-state-request') reportCamera();
  });
  window.addEventListener('resize', onResize);

  if (typeof THREE === 'undefined') {
    setStatus('Three.js не загрузился');
    return;
  }

  if (window.parent !== window) {
    try { window.parent.postMessage({ type: 'campaign-request-sync' }, '*'); } catch (_) {}
  }

  var demP = window.ItalyDEM ? ItalyDEM.load() : Promise.resolve(false);

  demP.then(function () {
    if (window.ItalyDEM && ItalyDEM.ready() && ItalyDEM.bbox) BOX = ItalyDEM.bbox.slice();
    geoFeatures = null;
    buildScene();
    loop();
    reportCamera();
  }).catch(function (err) {
    setStatus('Ошибка загрузки: ' + (err && err.message ? err.message : 'unknown'));
  });
})();
</script>
</body>
</html>
