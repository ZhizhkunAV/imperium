  }

  function applyThreeCam() {

    mesh.receiveShadows = true;

  }
  function cssHex(n) {
    return '#' + ('00000' + n.toString(16)).slice(-6);
  }
  function paintItalyMap(w, d) {
    var tw = 1024, th = 1200;
    var lon0 = CX - (w / 2) / SCALE, lon1 = CX + (w / 2) / SCALE;
    var lat0 = CY - (d / 2) / SCALE, lat1 = CY + (d / 2) / SCALE;
    var c = document.createElement('canvas');
    c.width = tw;
    c.height = th;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#1a4a66';
    ctx.fillRect(0, 0, tw, th);
    function toXY(lon, lat) {
      return {
        x: (lon - lon0) / (lon1 - lon0) * tw,
        y: (lat1 - lat) / (lat1 - lat0) * th
      };
    }
    function drawRings(rings, fill, stroke) {
      ctx.beginPath();
      for (var r = 0; r < rings.length; r++) {
        var ring = rings[r];
        if (!ring || ring.length < 3) continue;
        var p0 = toXY(ring[0][0], ring[0][1]);
        ctx.moveTo(p0.x, p0.y);
        for (var i = 1; i < ring.length; i++) {
          var p = toXY(ring[i][0], ring[i][1]);
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
      }
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.6; ctx.stroke(); }
    }
    var provinces = provinceFeatures.length ? provinceFeatures : [{
      rings: italyRings,
      color: 0x8ba888,
      name: ''
    }];
    for (var pi = 0; pi < provinces.length; pi++) {
      drawRings(provinces[pi].rings, cssHex(provinces[pi].color), '#5a4030');
    }
    ctx.fillStyle = '#2a1c0c';
    ctx.strokeStyle = '#f3e6c4';
    ctx.lineWidth = 3;
    ctx.font = '600 22px Cinzel, Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var li = 0; li < provinces.length; li++) {
      var prov = provinces[li];
      if (!prov.name || !prov.rings[0] || prov.rings[0].length < 3) continue;
      var sx = 0, sy = 0, n = prov.rings[0].length;
      for (var j = 0; j < n; j++) {
        var xy = toXY(prov.rings[0][j][0], prov.rings[0][j][1]);
        sx += xy.x; sy += xy.y;
      }
      var label = prov.name;
      ctx.font = (label.length > 10 ? '600 18px' : '600 22px') + ' Cinzel, Georgia, serif';
      ctx.strokeText(label, sx / n, sy / n);
      ctx.fillText(label, sx / n, sy / n);
    }
    return c.toDataURL('image/png');
  }
  function flareDataUrl() {
    var c = document.createElement('canvas');
    c.width = c.height = 32;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(16, 16, 1, 16, 16, 16);
    grd.addColorStop(0, '#fff8e0');
    grd.addColorStop(0.4, '#ffb040');
    grd.addColorStop(1, 'rgba(255,120,0,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 32, 32);
    return c.toDataURL('image/png');
  }

          return heightAt(x / SCALE + CX, CY - z / SCALE);
        },
        setPanEnabled: function (on) {
          if (controls) controls.enablePan = on;
        },
        follow: function (x, y, z) {
          if (!controls || !controls.target) return;
          controls.target.x += (x - controls.target.x) * 0.06;
          controls.target.y += (y - controls.target.y) * 0.06;
          controls.target.z += (z - controls.target.z) * 0.06;
        },
        onStatus: setStatus
      });
    }

    var fighting = false;
    function resetArmies() {
      fighting = false;
      reds.forEach(function (u) { u.stopped = false; u.mesh.position.set(u.home.x, u.home.y, u.home.z); });
      blues.forEach(function (u) { u.stopped = false; u.mesh.position.set(u.home.x, u.home.y, u.home.z); });
      setStatus('Three.js 3D · пан ЛКМ · Сброс армий');
    }
    function centroids() {
      var rc = { x: 0, z: 0 }, bc = { x: 0, z: 0 };
      reds.forEach(function (u) { rc.x += u.mesh.position.x; rc.z += u.mesh.position.z; });
      blues.forEach(function (u) { bc.x += u.mesh.position.x; bc.z += u.mesh.position.z; });
      rc.x /= reds.length; rc.z /= reds.length;
      bc.x /= blues.length; bc.z /= blues.length;
      return { rc: rc, bc: bc };
    }
    function tick() {
      if (current.name !== 'three') return;
      var now = performance.now();
      var dt = Math.min(0.05, (now - (tick.last || now)) / 1000);
      tick.last = now;
      if (units) units.tick(dt);
      else if (walker) walker.tick(dt);
      var c = centroids();
      var dx = c.bc.x - c.rc.x, dz = c.bc.z - c.rc.z;
      var distG = Math.sqrt(dx * dx + dz * dz);
      if (distG < 14) {
        if (!fighting) {
          if (window.BattleMapHook) {
            BattleMapHook.showBattleDialog({
              getPair: function () { return units; },
              getHeight: function (x, z) { return heightAt(x / SCALE + CX, CY - z / SCALE); },
              SCALE: SCALE, CX: CX, CY: CY, hover: 0.5, onStatus: setStatus
            });
          } else showBattleDialog();
        }
        fighting = true;
      }
      if (!fighting) {
        var nx = dx / (distG || 1), nz = dz / (distG || 1);
        var sp = 0.09;
        reds.forEach(function (u) {
          if (!u.stopped) { u.mesh.position.x += nx * sp; u.mesh.position.z += nz * sp; }
        });
        blues.forEach(function (u) {
          if (!u.stopped) { u.mesh.position.x -= nx * sp; u.mesh.position.z -= nz * sp; }
        });
      }
      if (controls) controls.update();
      applyThreeCam();
      renderer.render(scene, camera);
      current.raf = requestAnimationFrame(tick);
    }

    current.three = { renderer: renderer, scene: scene, camera: camera, controls: controls, camTarget: camTarget, reset: resetArmies, pack: pack, yaw: 0, walker: walker, units: units };
    current.name = 'three';
    resetArmies();
    applyCam();
    tick();
    setStatus('Three.js 3D · провинции · DEM-рельеф · колесо — зум · Q/E — наклон');
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { resolve(true); };
      s.onerror = function () { reject(new Error('load fail: ' + src)); };
      document.head.appendChild(s);
    });
  }

  function ensureBabylon() {

        return true;

    var scene = new BABYLON.Scene(engineB);

    camera.attachControl(pack.el, true);

    applyBabylonCam();

    var light = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.35, -1, 0.45), scene);
    light.position = new BABYLON.Vector3(40, 160, -40);

    light.diffuse = new BABYLON.Color3(1.0, 0.97, 0.9);

    fill.intensity = 0.35;
    fill.diffuse = new BABYLON.Color3(0.75, 0.82, 0.9);
    var shadow = new BABYLON.ShadowGenerator(2048, light);

    shadow.setDarkness(0.25);
    scene.ambientColor = new BABYLON.Color3(0.45, 0.48, 0.44);

    var ground = buildBabylonItaly(scene);

    ground.isPickable = true;
    addCampaignBordersBabylon(scene);

    var BridgeB = window.CampaignMapBridge;
    var cityMeshesB = [];
    var citiesB = (BridgeB && BridgeB.getCities()) ? BridgeB.getCities() : [];
    citiesB.forEach(function (city) {

      var col = city.faction === 'greek'
        ? new BABYLON.Color3(0.42, 0.24, 0.54)

      mat.diffuseColor = col;
      box.material = mat;
      box.isPickable = true;
      box.metadata = { city: city };
      cityMeshesB.push(box);
      var pole = BABYLON.MeshBuilder.CreateCylinder('cp_' + city.name, {
        height: 1.8, diameter: 0.1, tessellation: 6
      }, scene);
      pole.position.set(p.x + 0.7, y + 0.9, p.z);
      var poleMat = new BABYLON.StandardMaterial('cpm_' + city.name, scene);
      poleMat.diffuseColor = new BABYLON.Color3(0.79, 0.69, 0.44);
      pole.material = poleMat;
      pole.isPickable = false;
      var flag = BABYLON.MeshBuilder.CreateBox('cf_' + city.name, {
        width: 0.55, height: 0.4, depth: 0.05
      }, scene);
      flag.position.set(p.x + 0.95, y + 1.55, p.z);
      var flagMat = new BABYLON.StandardMaterial('cfm_' + city.name, scene);
      flagMat.diffuseColor = city.faction === 'greek'
        ? new BABYLON.Color3(0.42, 0.24, 0.54)
        : (city.faction === 'carthage'
          ? new BABYLON.Color3(0.6, 0.23, 0.2)
          : new BABYLON.Color3(0.63, 0.19, 0.19));
      flag.material = flagMat;
      flag.isPickable = false;
    });
    scene.onPointerObservable.add(function (pi) {
      if (pi.type !== BABYLON.PointerEventTypes.POINTERPICK) return;
      if (!BridgeB) return;
      var hit = pi.pickInfo && pi.pickInfo.hit && pi.pickInfo.pickedMesh;
      if (hit && hit.metadata && hit.metadata.city) {
        BridgeB.postCitySelect(BridgeB.selectCityPayload(hit.metadata.city));
        setStatus('Город: ' + (hit.metadata.city.ru || hit.metadata.city.name));
        return;
      }
      BridgeB.postCityDeselect();
    });

    var sea = BABYLON.MeshBuilder.CreateGround('sea', { width: 820, height: 820 }, scene);
    sea.position.y = -0.18;
    var seaMat = new BABYLON.StandardMaterial('seaMat', scene);
    seaMat.diffuseColor = new BABYLON.Color3(0.12, 0.33, 0.41);
    seaMat.specularColor = new BABYLON.Color3(0.18, 0.28, 0.32);
    seaMat.specularPower = 48;
    seaMat.emissiveColor = new BABYLON.Color3(0.05, 0.12, 0.16);
    seaMat.alpha = 0.96;
    sea.material = seaMat;
    sea.receiveShadows = true;

    var treeMatB = new BABYLON.StandardMaterial('treeB', scene);
    treeMatB.diffuseColor = new BABYLON.Color3(0.12, 0.22, 0.13);
    treeMatB.specularColor = new BABYLON.Color3(0, 0, 0);
    var trunkMatB = new BABYLON.StandardMaterial('trunkB', scene);
    trunkMatB.diffuseColor = new BABYLON.Color3(0.29, 0.2, 0.13);
    var boxT = (window.ItalyDEM && ItalyDEM.bbox) ? ItalyDEM.bbox.slice() : [6.4, 36.2, 18.9, 47.4];
    var planted = 0, tries = 0, tlon, tlat, tm, tp, hy;
    while (planted < 180 && tries < 4500) {
      tries++;
      tlon = boxT[0] + Math.random() * (boxT[2] - boxT[0]);
      tlat = boxT[1] + Math.random() * (boxT[3] - boxT[1]);
      tm = (window.ItalyDEM && ItalyDEM.ready()) ? ItalyDEM.meters(tlon, tlat) : 0;
      if (tm < 90 || tm > 1050) continue;
      tp = xz(tlon, tlat);
      hy = heightAtBabylon(tlon, tlat);
      var trunk = BABYLON.MeshBuilder.CreateCylinder('tr' + planted, { height: 0.5, diameter: 0.18, tessellation: 5 }, scene);
      trunk.material = trunkMatB;
      trunk.position.set(tp.x, hy + 0.25, tp.z);
      trunk.isPickable = false;
      var crown = BABYLON.MeshBuilder.CreateCylinder('cr' + planted, {
        height: 1.45, diameterTop: 0.04, diameterBottom: 0.9, tessellation: 6
      }, scene);
      crown.material = treeMatB;
      crown.position.set(tp.x, hy + 1.1, tp.z);
      crown.isPickable = false;
      planted++;
    }

    var pipeline = new BABYLON.DefaultRenderingPipeline('bloom', true, scene, [camera]);
    pipeline.bloomEnabled = true;
    pipeline.bloomThreshold = 0.9;
    pipeline.bloomWeight = 0.08;
    pipeline.bloomKernel = 24;
    pipeline.fxaaEnabled = true;
    if (pipeline.imageProcessing) {
      pipeline.imageProcessing.contrast = 1.08;
      pipeline.imageProcessing.exposure = 1.15;
    }

    var romeB = xz(12.5, 41.9);
    var walkerB = null;
    if (window.WalkUnitBabylon) {
      walkerB = WalkUnitBabylon.mount({
        scene: scene,
        camera: camera,
        canvas: pack.el,
        ground: ground,
        hover: 0.45,
        scale: 3.15,
        speed: 6,
        start: { x: romeB.x, z: romeB.z },
        getHeight: function (x, z) {
          return heightAtBabylon(x / SCALE + CX, CY - z / SCALE);
        },
        follow: function (x, y, z) {
          var t = camera.getTarget();
          camera.setTarget(new BABYLON.Vector3(
            t.x + (x - t.x) * 0.07,
            t.y + (y - t.y) * 0.07,

          ));
        },
        onStatus: setStatus
      });
    }

    function resetArmies() {
      setStatus('Babylon.js 3D · провинции · Q/E наклон · Z/C поворот');
    }
    engineB.runRenderLoop(function () {
      if (current.name !== 'babylon') return;
      applyBabylonCam();
      scene.render();

    current.babylon = { engine: engineB, scene: scene, camera: camera, reset: resetArmies, pack: pack, walker: walkerB };
    current.name = 'babylon';
    resetArmies();
    applyCam();
    setStatus('Babylon.js 3D · провинции · Q/E наклон · Z/C поворот');
  }

  /* ========== PHASER ========== */
  function startPhaser() {

  function startPhaserInner() {
    if (typeof Phaser === 'undefined') { setStatus('Phaser не загрузился'); return; }

    var bbox = (window.ItalyDEM && ItalyDEM.bbox) ? ItalyDEM.bbox.slice() : [6.4, 36.2, 18.9, 47.4];
    // кадр ближе к суше — меньше пустого моря снизу/по краям
    bbox[0] = Math.max(bbox[0], 7.2);
    bbox[1] = Math.max(bbox[1], 37.4);
    bbox[2] = Math.min(bbox[2], 18.4);
    bbox[3] = Math.min(bbox[3], 46.2);
    var lonSpan = bbox[2] - bbox[0];
    var latSpan = bbox[3] - bbox[1];
    var mapW = 4 * (lonSpan / latSpan); // ×2 к прежнему размеру
    var mapD = 4;
    var provinces = provinceFeatures.length ? provinceFeatures : [{
      name: 'Италия',
      color: 0xc4b47a,
      rings: italyRings
    }];

    function lonLatToModel(lon, lat) {
      return {
        x: ((lon - bbox[0]) / lonSpan - 0.5) * mapW,
        z: ((lat - bbox[1]) / latSpan - 0.5) * mapD
      };
    }
    function smoothstep01(a, b, x) {
      var t = (x - a) / ((b - a) || 1);
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      return t * t * (3 - 2 * t);
    }
    /** RTW: равнины почти плоские, Альпы/Апеннины — высокие с «шапками». */
    function elevY(m) {
      m = m == null ? 0 : m;
      if (m <= 2) return 0;
      var beach = smoothstep01(2, 90, m) * 0.01;
      var plains = smoothstep01(60, 350, m) * 0.035;
      var foothills = Math.pow(smoothstep01(280, 1100, m), 1.05) * 0.18;
      var peaks = Math.pow(smoothstep01(900, 3400, m), 1.55) * 0.72;
      return beach + plains + foothills + peaks;
    }
    function blurHeightField(arr, cols, rows, passes) {
      if (!arr || !arr.length) return;
      passes = passes || 2;
      var stride = cols + 1;
      var n = stride * (rows + 1);
      var p, i, j, idx, sum, w, di, dj, ni, nj;
      for (p = 0; p < passes; p++) {
        var next = new Float32Array(n);
        for (j = 0; j <= rows; j++) {
          for (i = 0; i <= cols; i++) {
            idx = j * stride + i;
            sum = arr[idx];
            w = 1;
            for (dj = -1; dj <= 1; dj++) {
              for (di = -1; di <= 1; di++) {
                if (!di && !dj) continue;
                ni = i + di;
                nj = j + dj;
                if (ni < 0 || nj < 0 || ni > cols || nj > rows) continue;
                sum += arr[nj * stride + ni];
                w++;
              }
            }
            next[idx] = sum / w;
          }
        }
        for (idx = 0; idx < n; idx++) arr[idx] = next[idx];
      }
    }
    function heightXZ(x, z) {
      var lon = bbox[0] + (x / mapW + 0.5) * lonSpan;
      var lat = bbox[1] + (z / mapD + 0.5) * latSpan;
      var m = (window.ItalyDEM && ItalyDEM.ready()) ? ItalyDEM.meters(lon, lat) : 0;
      return elevY(m || 0, lat, lon);
    }
    function projectModel(x, y, z) {
      // y=elev, z=planeY → vertex (x, z, y)
      var mesh = current.phaser && current.phaser.terrain;
      if (!mesh || !mesh.transformMatrix) return { x: 0, y: 0, scale: 1 };
      try {
        if (typeof mesh.preUpdate === 'function') mesh.preUpdate();
      } catch (_) {}
      var m = mesh.transformMatrix.val;
      var vx = x, vy = z, vz = y;
      var tx = vx * m[0] + vy * m[4] + vz * m[8] + m[12];
      var ty = vx * m[1] + vy * m[5] + vz * m[9] + m[13];
      var tw = vx * m[3] + vy * m[7] + vz * m[11] + m[15];
      if (Math.abs(tw) < 1e-8) tw = 1e-8;
      return {
        x: mesh.x + (tx / tw) * mesh.width,
        y: mesh.y - (ty / tw) * mesh.height,
        scale: Math.max(0.45, Math.min(1.35, 0.95 / Math.max(0.35, tw)))
      };
    }
    function paintPhaserTex(tw, th) {
      if (window.ItalyDEM && ItalyDEM.ready() && ItalyDEM.paintGeo) {
        return ItalyDEM.paintGeo(tw, th, bbox, { sea: '#4a8fa0', style: 'rtw' });
      }
      return paintLandGeo(tw, th, bbox, '#4a8fa0');
    }
    function factionBannerRgb(faction) {
      if (faction === 'greek') return [106, 61, 138];
      if (faction === 'carthage') return [154, 58, 50];
      return [196, 96, 110]; // рим — розово-красный как в RTW
    }
    function cityMarkerStats(city) {
      var Bridge = window.CampaignMapBridge;
      var CS = Bridge && Bridge.parentCS ? Bridge.parentCS() : null;
      var income = 180 + Math.abs(Math.round((city.lon || 0) * 17 + (city.lat || 0) * 11)) % 220;
      var happy = 1;
      var growth = true;
      if (CS) {
        var cs = CS.getCityState ? CS.getCityState(city.name) : null;
        if (cs) {
          income = 120 + (cs.influence || 50) * 3 + (cs.buildings ? cs.buildings.length * 40 : 0);
          happy = (cs.influence || 50) >= 55 ? 1 : ((cs.influence || 50) >= 35 ? 0 : -1);
          growth = !!(cs.queue && cs.queue.length) || (cs.buildings && cs.buildings.length < 4);
        }
      }
      if (city.capital) income = Math.round(income * 1.35);
      return { income: income, happy: happy, growth: growth };
    }
    /** Маркер города в духе Rome TW: постройки + знамя + табличка. */
    function makeRtwCityCanvas(city) {
      var st = cityMarkerStats(city);
      var name = (city.ru || city.name || 'Город').toString();
      var c = document.createElement('canvas');
      c.width = 168;
      c.height = 200;
      var g = c.getContext('2d');
      var br = factionBannerRgb(city.faction);
      var cx = 84;

      // тень
      g.fillStyle = 'rgba(0,0,0,0.28)';
      g.beginPath();
      g.ellipse(cx, 118, 48, 10, 0, 0, Math.PI * 2);
      g.fill();

      // основание
      g.fillStyle = '#c8c2b0';
      g.fillRect(cx - 42, 96, 84, 14);
      g.strokeStyle = 'rgba(60,50,40,0.35)';
      g.strokeRect(cx - 42, 96, 84, 14);
      g.fillStyle = '#8a9a58';
      g.fillRect(cx - 46, 108, 92, 6);

      function house(hx, hy, hw, hh, roofH) {
        g.fillStyle = '#e8dfc8';
        g.fillRect(hx, hy, hw, hh);
        g.strokeStyle = 'rgba(80,60,40,0.35)';
        g.strokeRect(hx, hy, hw, hh);
        g.fillStyle = '#c45a38';
        g.beginPath();
        g.moveTo(hx - 2, hy);
        g.lineTo(hx + hw / 2, hy - roofH);
        g.lineTo(hx + hw + 2, hy);
        g.closePath();
        g.fill();
        g.fillStyle = 'rgba(40,30,20,0.35)';
        g.fillRect(hx + hw * 0.35, hy + hh * 0.35, hw * 0.28, hh * 0.5);
      }
      house(cx - 36, 72, 28, 26, 14);
      house(cx - 2, 68, 32, 30, 16);
      house(cx + 18, 78, 22, 20, 11);
      // центр побольше (столица / ядро)
      g.fillStyle = '#efe6d2';
      g.fillRect(cx - 14, 58, 26, 22);
      g.fillStyle = '#b84830';
      g.beginPath();
      g.moveTo(cx - 16, 58);
      g.lineTo(cx - 1, 42);
      g.lineTo(cx + 14, 58);
      g.closePath();
      g.fill();

      // древко + знамя
      g.fillStyle = '#a89058';
      g.fillRect(cx + 22, 8, 5, 92);
      g.fillStyle = 'rgb(' + br[0] + ',' + br[1] + ',' + br[2] + ')';
      g.beginPath();
      g.moveTo(cx + 27, 10);
      g.lineTo(cx + 62, 10);
      g.lineTo(cx + 62, 78);
      g.lineTo(cx + 44.5, 88);
      g.lineTo(cx + 27, 78);
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(40,20,20,0.45)';
      g.lineWidth = 1.2;
      g.stroke();

      try {
        if (game.canvas) {
          game.canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
        }
      } catch (_) {}
    } catch (err) {
      setStatus('Phaser 3D: нужен WebGL · ' + err.message);
      return;
    }
    current.phaser.game = game;
    setTimeout(function () {
      if (!current.phaser || current.phaser.game !== game) return;
      try {
        var rw = Math.max(2, stage.clientWidth || window.innerWidth || 640);
        var rh = Math.max(2, stage.clientHeight || window.innerHeight || 480);
        game.scale.resize(rw, rh);
        game.scale.refresh();
      } catch (_) {}
      applyCam();
    }, 80);
    setTimeout(function () {
      if (!current.phaser || current.phaser.game !== game) return;
      try {
        var rw2 = Math.max(2, stage.clientWidth || window.innerWidth || 640);
        var rh2 = Math.max(2, stage.clientHeight || window.innerHeight || 480);
        game.scale.resize(rw2, rh2);
        game.scale.refresh();
      } catch (_) {}
      applyCam();
    }, 400);
    setStatus('Phaser · красный Рим · белый Карфаген · атака открывает окно боя');
  }

  function onResize() {
    if (current.name === 'three' && current.three) {
      current.three.pack.fit();
      var w = current.three.pack.el.width, h = current.three.pack.el.height;
      current.three.camera.aspect = w / h;
      current.three.camera.updateProjectionMatrix();
      current.three.renderer.setSize(w, h, false);
    }
    if (current.name === 'babylon' && current.babylon) {
      current.babylon.pack.fit();
      try { current.babylon.engine.resize(); } catch (_) {}
    }
    if (current.name === 'phaser' && current.phaser && current.phaser.game && current.phaser.game.scale) {
      try {
        var pw = Math.max(2, stage.clientWidth || window.innerWidth || 640);
        var ph = Math.max(2, stage.clientHeight || window.innerHeight || 480);
        current.phaser.game.scale.resize(pw, ph);
      } catch (_) {}
    }
    applyCam();
  }

  function startEngine(name) {
    engine = name;
    markButtons();
    disposeAll();
    window.removeEventListener('resize', onResize);
    try {
      if (name === 'babylon') startBabylon();
      else if (name === 'phaser') startPhaser();
      else {
        if (typeof THREE === 'undefined') {
          setStatus('Three.js не загрузился (локальный)');
          return;
        }
        startThree();
      }
    } catch (err) {
      setStatus('Ошибка карты: ' + (err && err.message ? err.message : String(err)));
      console.error(err);
    }
    window.addEventListener('resize', onResize);
    try {
      window.parent.postMessage({
        type: 'camera-state',
        center: { lon: 12.5, lat: 42.0 },
        viewQuad: [
          { lon: 6.6, lat: 47.1 }, { lon: 18.6, lat: 47.1 },
          { lon: 18.6, lat: 36.5 }, { lon: 6.6, lat: 36.5 }
        ]
      }, '*');
    } catch (_) {}
  }

  document.querySelectorAll('#engineBar [data-engine]').forEach(function (btn) {
    btn.addEventListener('click', function () { startEngine(btn.getAttribute('data-engine')); });
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (current.three && current.three.reset) current.three.reset();
    if (current.babylon && current.babylon.reset) current.babylon.reset();
    if (current.phaser && current.phaser.reset) current.phaser.reset();
  });
  document.getElementById('localBattleBtn').addEventListener('click', function () {
    if (window.BattleMapHook) BattleMapHook.showBattleDialog({ onStatus: setStatus });
    else if (window.BattleSystem) BattleSystem.showBattleDialog();
    else {
      try { window.parent.postMessage({ type: 'battle-open-local' }, '*'); } catch (_) {}
    }
  });
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    var factor = current.name === 'phaser' ? 1.1 : 1.1;
    nudgeZoom(e.deltaY < 0 ? factor : 1 / factor);
  }, { passive: false, capture: true });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'KeyQ') { e.preventDefault(); nudgeTilt(-TILT_STEP); }
    else if (e.code === 'KeyE') { e.preventDefault(); nudgeTilt(TILT_STEP); }
    else if (e.code === 'KeyZ') { e.preventDefault(); nudgeYaw(-YAW_STEP); }
    else if (e.code === 'KeyC') { e.preventDefault(); nudgeYaw(YAW_STEP); }
  }, true);
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'set-map-paint-view' && e.data.view != null) {
      var vid = Number(e.data.view) || 12;
      if (!(window.MapPaint && MapPaint.setView)) return;
      MapPaint.setView(vid).then(function () {
        if (current && current.name) startEngine(current.name);
      });
    }
    if (e.data.type === 'set-engine' && e.data.engine) {
      if (e.data.engine === engine && current.name === e.data.engine && current.phaser && current.phaser.game) return;
      if (e.data.engine === engine && current.name === e.data.engine && current.three) return;
      if (e.data.engine === engine && current.name === e.data.engine && current.babylon) return;
      var nextEng = e.data.engine;
      var paintVid = nextEng === 'phaser' ? 12 : (Number(localStorage.getItem('campaignMapVariant')) || 10);
      var paintP = (window.MapPaint && MapPaint.setView) ? MapPaint.setView(paintVid) : Promise.resolve();
      paintP.then(function () { startEngine(nextEng); });
    }
    if (e.data.type === 'camera-tilt') {
      if (typeof e.data.delta === 'number') nudgeTilt(e.data.delta);
      else if (typeof e.data.deg === 'number') { camTilt = e.data.deg; nudgeTilt(0); }
    }
    if (e.data.type === 'camera-rotate') {
      if (typeof e.data.delta === 'number') nudgeYaw(e.data.delta);
      else if (typeof e.data.deg === 'number') { camYaw = wrapYaw(e.data.deg); nudgeYaw(0); }
    }
    if (e.data.type === 'camera-zoom') {
      if (typeof e.data.factor === 'number') nudgeZoom(e.data.factor);
      else if (typeof e.data.deltaY === 'number') {
        var f = 1.1;
        nudgeZoom(e.data.deltaY < 0 ? f : 1 / f);
      }
    }
    if (e.data.type === 'camera-state-request') {
      try {
        window.parent.postMessage({
          type: 'camera-state',
          center: { lon: 12.5, lat: 42.0 },
          viewQuad: [
            { lon: 6.6, lat: 47.1 }, { lon: 18.6, lat: 47.1 },
            { lon: 18.6, lat: 36.5 }, { lon: 6.6, lat: 36.5 }
          ]
        }, '*');
      } catch (_) {}
    }
  });

  function fetchFirst(urls) {
    var i = 0;
    function next() {
      if (i >= urls.length) return Promise.reject(new Error('no geo'));
      var url = urls[i++];
      return fetch(url).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).catch(function () { return next(); });
    }
    return next();
  }

  function resolvePaintView() {
    try {
      var params = new URLSearchParams(window.location.search);
      var eng = (params.get('engine') || engine || 'three').toLowerCase();
      if (eng === 'phaser') return 12;
      var v = Number(localStorage.getItem('campaignMapVariant'));
      if (v === 4 || v === 5 || v === 10 || v === 12 || v === 16) return v;
    } catch (_) {}
    return engine === 'phaser' ? 12 : 10;
  }

  function loadPaintForCurrentView() {
    if (!(window.MapPaint && MapPaint.setView)) return Promise.resolve(false);
    return MapPaint.setView(resolvePaintView());
  }

  markButtons();
  loadPaintForCurrentView().then(function () {
    return Promise.all([
      fetchFirst(GEO_URLS).then(function (geo) {
        extractItaly(geo);
        return true;
      }).catch(function () { return false; }),
      // регионы поверх контура Italy из world.geojson (если доступны)
      fetch('/maps/view1/regions.geojson').then(function (r) {
        if (!r.ok) throw new Error('no regions');
        return r.json();
      }).then(function (geo) {
        var outline = italyRings.slice();
        extractItaly(geo);
        if (outline.length) italyRings = outline;
        return true;
      }).catch(function () { return false; }),
      window.ItalyDEM ? ItalyDEM.load() : Promise.resolve(false)
    ]);
  }).then(function () {
    startEngine(engine);
  });
})();
  </script>
</body>
</html>
