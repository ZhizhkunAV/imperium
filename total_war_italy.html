<!DOCTYPE html>
<html>
<head>
    <title>Карта Италии в стиле Total War</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a1a; }
        #map { height: 100vh; width: 100vw; }
        .leaflet-control-zoom { display: none !important; }
        .leaflet-attribution-flag { display: none !important; }
        .leaflet-control-attribution { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Подключаем библиотеку для генерации треугольных сеток -->
    <script src="https://unpkg.com/d3-array@3"></script>
    <script src="https://unpkg.com/d3-delaunay@6"></script>
    
    <script>
        var map = L.map('map', { center: [41.8, 12.5], zoom: 5, zoomControl: false, attributionControl: false });
        var layerGroup = L.featureGroup().addTo(map);

        function getRandomColor() {
            return `hsl(${Math.random() * 360}, 70%, 55%)`;
        }

        fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
            .then(response => response.json())
            .then(data => {
                let italyCoordinates = null;

                data.features.forEach(feature => {
                    if (feature.properties && feature.properties.name === "Italy") {
                        italyCoordinates = feature.geometry.coordinates;
                    }
                });

                if (!italyCoordinates) {
                    alert("Италия не найдена");
                    return;
                }

                // Функция проверки, находится ли точка внутри итальянского полигона
                function isPointInItaly(lon, lat) {
                    for(let p = 0; p < italyCoordinates.length; p++) {
                        const coords = italyCoordinates[p][0];
                        let inside = false;
                        for (let i = 0, j = coords.length - 1; i < coords.length; j = i++) {
                            const xi = coords[i][0], yi = coords[i][1];
                            const xj = coords[j][0], yj = coords[j][1];
                            const intersect = ((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
                            if (intersect) inside = !inside;
                        }
                        if(inside) return true;
                    }
                    return false;
                }

                // 1. Генерируем 400 точек внутри Италии (для создания сетки)
                const points = [];
                let attempts = 0;
                while(points.length < 400 && attempts < 15000) {
                    attempts++;
                    let lon = 6.0 + Math.random() * 13.5;
                    let lat = 36.0 + Math.random() * 12.0;
                    if(isPointInItaly(lon, lat)) {
                        points.push([lon, lat]);
                    }
                }

                // 2. Создаем триангуляцию Делоне (треугольная сетка)
                const delaunay = d3.Delaunay.from(points);
                const voronoi = delaunay.voronoi();

                // 3. Получаем список всех треугольников
                const triangles = delaunay.triangles;
                
                // 4. Отрисовываем каждый треугольник как отдельный полигон
                for (let i = 0; i < triangles.length; i += 3) {
                    const p1 = points[triangles[i]];
                    const p2 = points[triangles[i+1]];
                    const p3 = points[triangles[i+2]];

                    if(!p1 || !p2 || !p3) continue;

                    // Координаты вершин треугольника
                    const triangleCoords = [
                        [p1[1], p1[0]],
                        [p2[1], p2[0]],
                        [p3[1], p3[0]]
                    ];

                    // Проверка: все ли вершины внутри Италии (отсекаем море)
                    const centerLat = (p1[1] + p2[1] + p3[1]) / 3;
                    const centerLon = (p1[0] + p2[0] + p3[0]) / 3;
                    if(!isPointInItaly(centerLon, centerLat)) continue;

                    // Рисуем треугольник
                    L.polygon(triangleCoords, {
                        color: "#000000",
                        weight: 1.5,
                        fillColor: getRandomColor(),
                        fillOpacity: 0.9
                    }).addTo(layerGroup);
                }

                // 5. Рисуем финальный черный контур Италии сверху
                data.features.forEach(feature => {
                    if (feature.properties && feature.properties.name === "Italy") {
                        L.geoJSON(feature, { color: "#000000", weight: 4, fill: false }).addTo(layerGroup);
                    }
                });

                map.fitBounds(layerGroup.getBounds());
            })
            .catch(error => {
                document.body.innerHTML = `<div style="color:white; text-align:center; margin-top:20%; font-family:sans-serif;">Ошибка загрузки: ${error.message}<br>Проверьте интернет.</div>`;
            });
    </script>
</body>
</html>
